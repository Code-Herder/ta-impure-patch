; Total Annihilation - Impure Patch: the settings ddraw.dll reads at start.
; These are the values the patch is measured with. The one that must not change is
; renderer=openglcore: every pass draws through the OpenGL 3.3 core context.
;
; Four settings are DELIBERATELY not here -- windowed, fullscreen,
; toggle_borderless and max_resolutions. The DLL owns them (tagpu_cfg.c): it
; opens the game borderless fullscreen, makes alt+enter switch between that and
; a window, and bounds the mode list against TA's own 100-entry buffer. Writing
; any of them here reads as YOUR choice and turns that off for that key -- which
; is how you override one if you want to.
;
; Display mode, the frame cap and the window's position and size are settings of
; the in-game menu, saved in impure.cfg. fullscreen, maxfps, posX, posY, width or
; height written here override the menu, and its row turns grey.

[ddraw]
renderer=openglcore
border=true
maintas=true
vsync=false
adjmouse=true
savesettings=0

[TotalA]
lock_surfaces=true
singlecpu=false
maxgameticks=0
minfps=0
