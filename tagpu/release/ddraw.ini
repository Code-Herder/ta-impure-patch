; Total Annihilation - Impure Patch: the settings ddraw.dll reads at start.
; These are the values the patch is measured with. The one that must not change is
; renderer=openglcore: every pass draws through the OpenGL 3.3 core context.

[ddraw]
renderer=openglcore
; A bordered window at the game's own resolution. fullscreen=true makes it a
; borderless window covering the screen instead; alt+enter switches at run time.
windowed=true
fullscreen=false
border=true
maintas=true
vsync=false
maxfps=60
adjmouse=true
savesettings=0

[TotalA]
max_resolutions=32
lock_surfaces=true
singlecpu=false
maxgameticks=0
minfps=0
