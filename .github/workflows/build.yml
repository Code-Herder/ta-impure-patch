# Build ddraw.dll on every push and package it: the release folder is the run's
# artifact, and a v* tag also publishes it as a GitHub release. The build is the
# same two commands as on a desk -- make -C tagpu/ddraw, then
# tagpu/release/package.sh -- with the Debian/Ubuntu mingw cross compiler (GCC 13,
# the version the fork is built with). The token is read-only everywhere except
# the release job, which only a tag reaches.
name: ddraw.dll

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      name: ${{ steps.package.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # git describe names the build

      - name: mingw cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-i686 make zip
          i686-w64-mingw32-gcc --version | head -1

      - name: build
        run: make -C tagpu/ddraw -j"$(nproc)"

      - name: package
        id: package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="$GITHUB_REF_NAME"; fi
          zip="$(tagpu/release/package.sh | tail -n1)"
          echo "name=$(basename "$zip" .zip)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.name }}
          path: ${{ needs.build.outputs.name }}

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ needs.build.outputs.name }}
        run: |
          zip -q -r "$NAME.zip" "$NAME"
          gh release create "$GITHUB_REF_NAME" "$NAME.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "ddraw.dll built from $GITHUB_SHA. Unzip next to TotalA.exe; README.txt inside says the rest."
