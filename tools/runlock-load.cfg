# The run lock's load guard (tools/runlock.py, THE LOAD GUARD). The slots bound the work the lock
# sees; this bounds what an admission adds on top of the work it does not see. The run being admitted
# takes no more slots than keep max(L, H) + its slots at or under load_per_thread times the
# machine's threads, L the 1-minute load average and H the slots other runs hold. Each tree reads its
# own file: the guard decides only when a run starts, never what the slots bound, so two trees with
# different figures can only admit at different moments.
#
# load_per_thread: 1.0, the load at which every thread is busy and nothing waits for a CPU. Past it
# every run slows by the ratio: at a load average of 81 on the reference setup's 32 threads every run
# ran at about 40 % of its speed (MEASURED 2026-11-13, 14:50), and the checks bounded in time fail
# for the load alone. The run lock's own budget of 28 slots stays under it on its own, so the guard
# bites only when work outside the lock, or a holder running more than its slots, has taken the
# rest of the machine.
load_per_thread = 1.0
