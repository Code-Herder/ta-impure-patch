<!DOCTYPE html>
<!-- tascene-view.html — the browser half of the tascene lab.

     Draws a scene pack built by `tools/tascene build` in WebGL2. There are two
     renderers and they do not blend (research/notes/tascene-design.md):

       (nothing)       BOTH — the wipe, Classic left, Classic++ right. A
                       bare page, or one with only eye/zoom/ss, shows both;
                       naming a renderer, a preset or any Classic++ parameter
                       shows that one look alone. Under shot=1 a bare query
                       is Classic alone: `tascene shot pack` with no options
                       is the parity ritual's baseline, and a shot measures
       lane=classic    "Classic" — tagpu's OWN shaders, extracted
                       from the C sources at export time into pack/shaders/*,
                       on their full-colour branch with assets=0 light=0 as
                       the game draws Classic: flat 32-px grid, each texel its
                       palette colour (the base atlases, baseAtlas below), the
                       unit faces shaded by PALETTE.SHD's row as an RGB
                       multiplier (shadeK below). The only renderer that
                       carries a pixel claim against the game. Was `parity`,
                       which is still accepted — the code and the notes call
                       it the parity lane, because that is its property.
       lane=classicpp  "Classic++" — the LAB shaders below: restored colour,
                       a level-normalised per-pixel sun, trilinear textures,
                       cast shadows. Makes no parity claim at all. Was
                       `explore`, still accepted; `classic++` cannot be spelled
                       in a query string, where a + is a space.

     THE RENDERER BUTTONS in the status bar toggle the two. One selected shows
     that look alone; both selected shows the wipe with its divider. They
     rewrite the query and reload: the current eye, ss and wipe are kept, and
     a renderer that is already on screen keeps every parameter its side has.

     LIVE RELOAD. Under `tascene serve` this file is re-staged into the pack
     whenever the checked-in source changes, and the open page polls `__reload`
     and refreshes itself — so editing the viewer updates the browser with no
     server restart and no manual reload. `serve --no-reload` turns both halves
     off. Never active under shot=1. See the poll at the bottom of this file.

     Query parameters. Global (top level only):
       shot=1        hide the UI, render one frame, then set document.title to
                     "tascene-ready" so a screenshotter knows it is done
       zoom=<z>      view zoom, 0.25..8, default 1 — tagpu_zoom.c's range.
                     The viewport shows vw/z x vh/z world units centred where
                     the zoom-1 view is centred; the eye stays the zoom-1
                     top-left, as in the game. The WHEEL changes it live with
                     the game's camera (CAMERA below). Both renderers zoom;
                     only zoom 1 carries a parity claim (tagpu resamples
                     differently at other zooms — no A/B has been done there)
       ss=<n>        supersample factor for the offscreen. DEFAULT 2, THE
                     GAME'S OWN: tagpu renders its native unit FBO at 2x and
                     box-downsamples (tagpu_native.c, `tagpu_ss.off` turns it
                     off), so at 1 the unit textures alias where the game's
                     do not — the kbot lab's roof shimmers. The composite is
                     an exact n x n box for any n; 1 = raw. Terrain and
                     sprites are 1:1 texel-to-pixel and do not change with it
       eye=<x,y>     override the pack's eye (viewport top-left, world units)
       a=<query>     the WIPE: render two looks into the same frame and split
       b=<query>     them at `wipe`, so the difference between two parameter
       wipe=<0..1>   sets is read off at identical pixel coordinates. A value
                     with no "=" in it names a preset: a=engine&b=relief-sun.
       debug=shadow  show side A's shadow depth map instead of the frame
                     (near = bright), for "is the caster in the map at all"

     Per side (spell them at the top level for one look, or inside a= / b=):
       preset=<name> a named look from tascene-presets.json; anything you also
                     spell out wins over it
       pass=<list>   comma-separated passes: terrain,features,units
       feat=<what>   features: both (default), body, shadow — a debug split
       lane=<lane>   classic | classicpp (parity | explore still accepted)
       edge=<what>   EDGE, both lanes: `black` (default, the game's) or
                     `mirror`, with its knobs:
       edgedim=<b>   brightness of the mirror at the map's edge, default 0.5
       edgegrey=<g>  0 = the mirrored colour, 1 = the fog's grey; default 0.75
       edgefade=<px> world px from the edge to black, default 1536
       edgesteps=<n> bands of the fade, default 0 = smooth
       edgedither=<b> a 4x4 ordered dither across the bands, default 0 —
                     TA never dithers when it darkens, so this is off
       relief=<k>    EXPLORE: displacement scale. DEFAULT 0 — the art left
                     exactly where the engine paints it, lit by the real
                     gradient. 1 = the engine's own h/2, which MISREGISTERS
                     the art: the tiles are already the oblique projection of
                     the hill, so displacing them applies it twice. Measured on
                     Two Continents, relief=1 moves the terrain 41-94 px away
                     from the engine's frame while the features do not move at
                     all. Keep it for the double-count experiment; do not
                     mistake it for a better picture
       datum=<h>     EXPLORE: the height a NON-ZERO relief pivots about, so a
                     cell moves by relief*(h-datum)/2 and a cell AT the datum
                     stays where the engine paints it. Default is the map's
                     own sealevel, which removes the constant part of the
                     slide (66 px of it here); datum=0 is the un-pivoted h/2.
                     It cannot remove the part that varies with the terrain,
                     which is why relief itself defaults to 0
       sun=<az,el>   EXPLORE: sun in degrees, or `off`. The default 324,53 IS
                     tagpu_render3do.c's own model light re-expressed as a
                     direction, so terrain and units share one sun by default.
                     LEVEL GROUND ALWAYS TAKES EXACTLY 1.0: the art is already
                     lit (artlight), so the sun only modulates by how far a
                     surface tilts from level — sunward slopes brighten past
                     the painted colour, leeward ones darken. Before this
                     normalisation level ground took 0.870, a second sun on
                     top of the artist's, and the whole lane read 13 % dark.
                     Terrain, feature sprites and unit faces take the one
                     rule (LAB_LIGHT), evaluated per pixel where there is a
                     normal to evaluate it on
       amb=<a>       EXPLORE: ambient floor, default 0.35 — relative to level
                     ground, so a face turned fully away from the sun takes
                     amb / (amb + (1-amb)·sin(el)) = 0.40 at the defaults
       slope=<k>     EXPLORE: exaggerate the heightfield's gradient, default 1
       filter=<f>    EXPLORE: how the RESTORED unit textures are sampled.
                     linear = trilinear (bilinear + mipmaps, levels 0..2)
                     with `aniso` taps — what the deleted replacement-mesh path
                     did (GL_LINEAR_MIPMAP_LINEAR, tagpu_hires.c). nearest = one
                     texel, the stock look. DEFAULT linear when the pack's
                     unit atlas is padded for it (`build` since UNIT_PAD),
                     nearest otherwise; filter=linear on an unpadded pack
                     fails loudly, because its mips would bleed neighbours.
                     Indexed colour is always nearest: an index cannot be
                     averaged
       aniso=<n>     EXPLORE: anisotropic taps for filter=linear, default 4.
                     TA's projection foreshortens every vertical face 2:1,
                     which trilinear alone over-blurs. 0 or 1 = off. The
                     status bar says what the GPU allows; none = unsupported
       shadows=<b>   EXPLORE: cast shadows from the sun, default 1. A depth
                     map of every 3DO (units, wrecks, buildings) rendered
                     along the sun, read back by terrain and units with a
                     Poisson PCF kernel — self-shadowing and unit-on-unit
                     included. Sprites neither cast nor receive (a billboard
                     has no geometry; a tree's shadow is in its own frames).
                     0 = off. Off whenever the sun is
       penumbra=<k>  EXPLORE: PCSS-lite — the penumbra widens by k world
                     units per world unit between blocker and receiver, so a
                     track is sharp where it meets the ground and a turret's
                     shadow is soft. Default 0.05 — TA's casters are 11-60
                     units tall, so 0.25 was all penumbra and 0.1 still
                     washed a low building's rim out; 0 = hard
       unitsun=<az,el>   EXPLORE: see THREE SUNS above
       shadowsun=<az,el> EXPLORE: see THREE SUNS above
       shadowlen=<a>,<b>  EXPLORE: how long a 3DO's shadow is, in world
                     units: a + b * the model's height. Default 14,0.25 —
                     a Flash (8.5 tall) gets 16, the kbot lab (11) 17, a
                     Peewee (26) 21, the laser tower (47) 26. The base term
                     is what a LOW unit shows: a Flash is 28 wide, so of a
                     12-unit shadow almost nothing cleared its own body.
                     A parallel light makes length
                     proportional to height, and what reads on TA's low
                     buildings is three times too long on its kbots; the
                     engine does not project mobile units at all (a flat
                     5-px drop). Implemented as a per-caster vertical scale
                     in the depth pass, the unit's own shadow lookup scaled
                     with it; hills are unscaled. off = physical
       shade=<s>     EXPLORE: the fraction of the DIRECT light a shadow
                     removes, default 1 (ambient only in full shadow, which
                     is amb/level = 0.40 at the defaults). Lower for a
                     lighter shadow
       terrainshadow=<b>  EXPLORE: the heightfield casts too (hills shadow
                     the valley), default 1. The art has slope shading but
                     no cast shadows, so this adds and does not double-count
       shadowres=<n> EXPLORE: depth map size, default 2048 (1.28 world units
                     a texel on a 1920x1080 frame: the 1x view plus its
                     margins). The texel grid is anchored to the map and
                     sized by zoom octave, and below 1x the map doubles to
                     4096 — the game's rule (renderers.md 2.7), so a scroll
                     or a zoom does not make shadow edges crawl
       castsplit=<b> EXPLORE: mirror the GAME's caster/receiver split, default
                     1. The game's terrain gather emits screen-space quads with
                     no height in them, so its fragment shader rebuilds the
                     world point and the normal from the height grid per
                     fragment (tagpu_terr.c taTerrW/taTerrN), while the CASTER
                     was a separate world-space mesh built from the same bytes
                     (build_hills, deleted from the game 2026-09-23; the game
                     builds no terrain caster now). One surface described
                     twice. castsplit=1 does both here; castsplit=0 is the lab's older single
                     buffer, cast and shaded, and is byte-identical to what the
                     lab drew before the knob existed. MEASURED 2026-09-09: the
                     two differ by 0.001 std of the shadow term, which is what
                     falsified the split as the cause of the ground acne
                     (renderers.md 2.7b)
       bfloor=<w>    EXPLORE, DIAGNOSTIC: floor the constant shadow bias at w
                     world units, default 0 (off). This is the ACNE ORACLE: the
                     shadow term at bfloor=24 keeps every shadow a real caster
                     throws and loses the ones the bias failed to cover, so
                     acne = std(term) - std(term at bfloor=24). Needed because
                     the raw term is dominated by legitimate terrain shadow
       bslack=<k>    EXPLORE: k world units of extra depth allowance per world
                     unit of blocker-search tap offset. The receiver-plane bias
                     is a LINEAR extrapolation and the search runs a fixed 24
                     world units; this is the candidate fix for what that
                     leaves uncovered on a curved receiver. 0 = off (default)
       undither=<b>  EXPLORE: 1 = the pack's restored true-colour atlases,
                     0 = the palette indices. DEFAULT: restored when the pack
                     carries them (`tascene build --undither`), indexed
                     otherwise — so on an indexed pack the lane's defaults
                     still reduce to parity, and on a restored pack they show
                     the colour it was built for. undither=1 on an indexed
                     pack fails loudly rather than drawing something plausible

     THREE SUNS, BECAUSE THE ENGINE HAS THREE. All in map space (x east,
     y up, z south), all in degrees as az,el, all EXPLORE-only:
       sun        the terrain's, default 324.5,53.1 — north-west, the side
                  the tile art is painted from (artlight). It is SH_L below
                  mirrored north-south, which is what an earlier note called
                  "the engine's light re-expressed"; it is not
       unitsun    the units', default 215.5,53.1 — tagpu_render3do.c:250's
                  SH_L = (-0.35, 0.80, -0.49) taken out of 3DO model space
                  (z north) into map space. South-west: the camera light,
                  fronts lit, which is how the engine's LUT shades a unit
       shadowsun  the shadows', default 225,40 — the engine's own slant
                  (shadows-cloak.md: gx = x + y/4, gy = -z - y/4, a
                  parallel light at 225,70.5 leaning every shadow up-right
                  by a quarter of the height) with the elevation lowered
                  so a shadow is 1.2x the height instead of 0.35x. TA's
                  buildings are LOW — the kbot lab is 11 units tall over a
                  95-unit footprint — so the engine's stub is a 3-px rim
                  and at 60 it was still only 6; at 40 it reads. Same
                  lean. shadowsun=225,70.5 is the engine's exactly;
                  215.5,53.1 makes the shadow fall away from the light the
                  unit is shaded by
     Unit normals are dotted in map space (3DO z flipped), so unitsun and
     sun mean the same compass. sun=off turns all three off.

     CAMERA: THE GAME'S, WHICH IS BAR'S (Beyond All Reason, on the Recoil
     engine) for pan and zoom — tagpu_zoom.c, research/notes/bar-camera-port.md.
     Global, because the wipe shares one camera.
       the clamp     the point at the screen centre is clamped to the map
                     (Recoil's SpringController Update), so the map's edge
                     can reach the middle of the screen at every zoom:
                     eye in [-W/2, extent - W/2], the extent the
                     engine's own (the map less 32 and 128 px)
       zoom in       holds the world point under the pointer
       zoom out      the camera pulls straight back: the centre holds
       the notch     14 % of the camera's distance 1/z per notch (BAR's
                     ScrollWheelSpeed 20 x Recoil's 0.007): x1.163 in, x0.877
                     out, so in-then-out does not come back; the target is
                     clamped to 0.25..8 and one within a thousandth of 1 is 1
       the tween     the drawn camera goes from where it is to the new pose in
                     0.25 s along 1 - (1 - t)^4 — fast, then settling. The pose
                     is lerped as centre and 1/zoom, which is the 3D camera
                     position here: on a ray through the pointer it keeps the
                     point still; a notch mid-tween starts a new tween from the
                     drawn pose toward the previous target times the notch
     A pointer off the world viewport zooms about the centre (the game ignores
     a wheel there instead). Drag and the arrow keys move the world by the
     pointer's own distance at every zoom; grabbing the map mid-zoom lands the
     zoom first.

     EDGE: WHAT IS PAST THE MAP. The game draws black. BAR's Map Edge Extension
     widget draws the map mirrored past each edge, from the minimap texture,
     at 30 % brightness, bending away and fading out. edge=mirror is that idea
     in TA's own terms: the same tiles, texel for texel (a cell reflects
     across every edge it is past, and its texels flip), in the fog of war's
     grey, dimmed, and fading smoothly to black, IN FULL COLOUR IN BOTH
     LANES: Classic takes each texel's palette colour, exactly the colour it
     draws, and darkens that. The mirror is not something the engine draws,
     so there is no palette to stay inside, and an 8-bit fade either shows
     its steps or needs a dither — TA never dithers when it darkens, and a
     dither is what Classic++ exists to take out. The grey is the RGB mean,
     as TAGPU_GLSL_FOG_GREY_RGB takes it, not snapped to the palette the way
     the engine's own fog grey is. Unlit, because mirrored art
     is lit from wherever the reflection sent the painted light. The map's own
     features (the TNT's anchors, not a scenario's) are mirrored with the
     terrain: flipped with it across a side edge, upright across the top and
     bottom, standing where the reflected art puts them, in the same tone, and
     never drawn over the map itself. Units stay on the map.

     ORDER MARKERS: the engine's queued-order graphics (ui-markers.md §3), in
     both renderers, from the pack's copy of anims/cursors.gaf. Each unit's
     scenario `orders` is drawn as a shift-queue by the engine's walk: from
     the unit, every order whose descriptor mask has bit 1 or 3 draws the
     cursor_ary sprite at its target, a bit-1 order on the hovered unit also
     draws the `pathicon` route dots from the previous target to it, and the
     chain moves on. The dots march 48 world units per 30 ticks, one every 48;
     the sprite shows frame (gameTime / (2 * frame 0's ticks)) % count at
     ordalpha (default 0.5, PALETTE.ALP's mix). Drawn onto the canvas after
     the composite, at canvas resolution, inside each side's half of the
     wipe, and re-presented every display frame on a 30 Hz game clock, so the
     world under them is not redrawn to animate them. There is no fog and
     nothing draws over them. Per side:
       ordstyle=<s>  gaf (default: the engine's art) | proc (what tagpu draws
                     today, tagpu_order.c: a 2.4-px disc per dot and a
                     breathing crosshair, opaque, in the art's ink) | off
       ordsize=<s>   canvas px per texel: world (default) = the zoom, the
                     engine's pixel magnified with the world; screen = 1 at
                     every zoom; int = the zoom rounded, at least 1; clamp =
                     the zoom held inside ordmin..ordmax (default 1..2)
       ordfilter=<f> nearest (default) | sharp (each texel flat, only the
                     pixel across a texel edge blended: even texels at a
                     scale that is not whole) | linear
       ordspace=<s>  the dot spacing: world (default) 48 world units; screen
                     48 canvas px at every zoom; octave 48 x 2^k world units,
                     k the zoom's octave, each octave's dots every other dot
                     of the one below, so a zoom adds or drops dots and
                     moves none
       ordanim=<a>   engine (default) | cursor: each frame for its own
                     ticks, as the mouse cursor animates (0x4B8BF0)
       ordtick=<t>   int (default: the clock in whole ticks, as the engine
                     steps) | smooth
       orddots=<d>   all (default: every unit is the hovered one) | active
                     (only the unit being ordered; the others show their
                     sprites, as a merely selected unit does)
       ordalpha=<a>  the sprite's opacity, default 0.5
     Global: orders=<unit>:<cmd>@<x>,<z>;<cmd>#<handle>|<unit>:… replaces the
     scenario's queues, ordunit=<id> is the unit being ordered, ordtime=<t> is
     the clock under shot=1 (default 0). Serving, SHIFT-click queues the order
     picked in the status bar, CTRL-click picks the unit, and both write back
     into the address bar.

     THE COORDINATE CONVENTION IS TAGPU'S, DELIBERATELY. The extracted vertex
     shader maps game py 0 -> NDC -1, i.e. the offscreen's row 0 is the game
     frame's TOP row and gl_FragCoord.xy is the game-frame pixel — which is what
     the fog and scaffold rules in tagpu_glsl.h assume. So this page renders into
     an FBO exactly as tagpu does and flips only in the final composite to the
     canvas. Do not "fix" the flip in the vertex shader: it would silently
     invert every screen-space rule the shaders carry.
-->
<meta charset="utf-8">
<title>tascene</title>

<!-- the Classic lane (tagpu's shaders over the pack), shared with the in-game wiki's mockup -->
<script src="tascene-render.js"></script>
<script type="module">
const TR = window.TasceneRender;
const { div32trunc, ceil32, TILE_PX, UNIT_STRIDE } = TR;
const { program, nameShadowUnits, uniforms, tex2D } = TR;
const Q = new URLSearchParams(location.search);
const SHOT = Q.get("shot") === "1";
const SS   = Math.max(1, parseInt(Q.get("ss") || "2", 10));
const err  = document.getElementById("err");
const bar  = document.getElementById("bar");
if (SHOT) document.body.classList.add("shot");

let contextLost = false;         // set by the canvas's webglcontextlost handler
function fail(msg) {
  // drop the shot class first: `body.shot #err` hides the banner, and a
  // headless shot of a mistyped parameter would otherwise be a black frame
  // with nothing to read
  document.body.classList.remove("shot");
  err.style.display = "block";
  // after a lost context every GL call fails, so whatever failed next is a
  // symptom: the banner keeps saying what happened
  if (!contextLost) err.textContent = String(msg && msg.stack || msg);
  document.title = "tascene-error";
  throw msg;
}

const fetchJSON = async (u) => (await fetch(u)).json();
const fetchText = async (u) => (await fetch(u)).text();
async function fetchBin(u) {
  const r = await fetch(u);
  if (!r.ok) throw new Error(`${u}: HTTP ${r.status}`);
  return new Uint8Array(await r.arrayBuffer());
}

// ---------------------------------------------------------------------------
// PARAMETERS. Two scopes: a handful are global to the frame, the rest describe
// ONE LOOK and so exist once per wipe side. A side's parameters are the
// top-level query overridden by its own a= / b= query overridden by nothing —
// which is what makes `?eye=X,Y&a=engine&b=relief` share the camera and differ
// only in the look, i.e. the same pixel coordinates on both sides.
const GLOBAL = new Set(["shot", "ss", "eye", "wipe", "a", "b", "debug", "zoom",
                        "orders", "ordunit", "ordtime"]);
const zoomClamp = (z) => (Number.isNaN(z) ? 1 : Math.max(0.25, Math.min(8, z)));
let zoom = zoomClamp(parseFloat(Q.get("zoom") || "1"));

const DEBUG = Q.get("debug") || "";      // "shadow": show side A's depth map
// naming any of these IS choosing the exploration lane; saying lane=parity as
// well is a contradiction and an error rather than a silent winner
const EXPLORE_ONLY = ["relief", "datum", "sun", "amb", "slope", "undither",
                      "filter", "aniso", "shadows", "penumbra", "shade",
                      "terrainshadow", "shadowres", "unitsun", "shadowsun",
                      "shadowlen", "airshadow", "bslack", "bfloor", "castsplit", "pbias", "mindist", "castsmooth", "noff", "pofac", "pounits"];

function sideQuery(side, presets) {
  const p = new URLSearchParams();
  for (const [k, v] of Q) if (!GLOBAL.has(k)) p.set(k, v);
  if (side !== null) {
    const q = side.includes("=") ? side : "preset=" + side;
    for (const [k, v] of new URLSearchParams(q)) p.set(k, v);
  }
  const name = p.get("preset");
  if (!name) return p;
  const preset = presets[name];
  if (!preset)
    fail(`no preset named "${name}" — have: ${Object.keys(presets).join(", ")}`);
  if (/(^|&)preset=/.test(preset.q))
    fail(`preset "${name}" names another preset; presets do not nest`);
  const merged = new URLSearchParams(preset.q);
  for (const [k, v] of p) merged.set(k, v);      // spelled out beats the preset
  return merged;
}

// The three suns (header, THREE SUNS). SH_L = (-0.35, 0.80, -0.49) is
// tagpu_render3do.c:250's model light; in map space its z flips, which is
// UNITSUN_DEFAULT (round-trips to within 0.0013 per component). SUN_DEFAULT
// is that vector mirrored north-south — the side the art is painted from.
// The engine's slant (x + y/4, -z - y/4) as a direction is (-1, 4, 1)/sqrt(18),
// az 225, el atan(4/sqrt(2)) = 70.53; SHADOWSUN_DEFAULT keeps its azimuth and
// drops to 40 so a shadow is 1.2x the height rather than 0.35x (header).
const SUN_DEFAULT = [324.5, 53.1];
const UNITSUN_DEFAULT = [215.5, 53.1];
const SHADOWSUN_DEFAULT = [225, 40];

function sunVector(az, el) {
  const a = az * Math.PI / 180, e = el * Math.PI / 180;
  return [Math.sin(a) * Math.cos(e), Math.sin(e), -Math.cos(a) * Math.cos(e)];
}

function readLook(p, label) {
  const num = (k, d) => (p.get(k) === null ? d : parseFloat(p.get(k)));
  const named = EXPLORE_ONLY.filter((k) => p.get(k) !== null);
  // the renderers' names, and the lane names the code and the notes use
  const LANE = { classic: "parity", parity: "parity",
                 classicpp: "explore", "classic++": "explore", explore: "explore" };
  let lane = p.get("lane");
  if (lane !== null && !(lane in LANE))
    fail(`${label}: lane must be classic or classicpp (parity / explore still ` +
         `accepted), not "${lane}"`);
  if (lane !== null) lane = LANE[lane];
  if (lane === "parity" && named.length)
    fail(`${label}: ${named.join(", ")} ${named.length > 1 ? "are" : "is a"} ` +
         `Classic++ parameter${named.length > 1 ? "s" : ""}, but lane=classic ` +
         `was asked for. Drop one of the two — the renderers do not blend.`);
  if (!lane) lane = named.length ? "explore" : "parity";

  const passes = (p.get("pass") || "terrain,features,units").split(",").map((s) => s.trim());
  const sunRaw = p.get("sun");
  const lit = lane === "explore" && sunRaw !== "off";
  let sun = SUN_DEFAULT;
  if (lit && sunRaw) {
    const v = sunRaw.split(",").map(Number);
    if (v.length !== 2 || v.some(Number.isNaN))
      fail(`${label}: sun must be "<azimuth>,<elevation>" in degrees, or "off"`);
    sun = v;
  }
  const angles = (key, dflt) => {
    const raw = p.get(key);
    if (!lit || raw === null) return dflt;
    const v = raw.split(",").map(Number);
    if (v.length !== 2 || v.some(Number.isNaN))
      fail(`${label}: ${key} must be "<azimuth>,<elevation>" in degrees`);
    return v;

  const unitAE = angles("unitsun", UNITSUN_DEFAULT);
  let shadowlen = [14, 0.25];                         // a + b * height, or null
  const slRaw = p.get("shadowlen");
  if (slRaw === "off") shadowlen = null;
  else if (slRaw !== null) {
    shadowlen = slRaw.split(",").map(Number);
    if (shadowlen.length !== 2 || shadowlen.some(Number.isNaN))
      fail(`${label}: shadowlen must be "<a>,<b>" (length = a + b*height) or off`);
  }
  const shadowAE = angles("shadowsun", SHADOWSUN_DEFAULT);
  // amb >= 1 is how "no sun" reaches the shaders: one uniform, no branch
  const amb = lit ? Math.min(1, Math.max(0, num("amb", 0.35))) : 1;
  const sunV = sunVector(sun[0], sun[1]), unitV = sunVector(unitAE[0], unitAE[1]);

  // sun may only modulate by the tilt from level: every lambert is divided by
  // the one a level normal (0,1,0) gets, whose N.L is the sun's y. The floor
  // keeps amb=0 with the sun on the horizon finite instead of 1/0. Units get
  // the same rule under their own sun.

    fail(`${label}: filter must be linear or nearest, not "${filter}"`);

    label, lane, name: lane === "parity" ? "Classic" : "Classic++",
    preset: p.get("preset") || null, query: p.toString(),
    terrain: passes.includes("terrain"),
    features: passes.includes("features"),
    units: passes.includes("units"),
    feat: p.get("feat") || "both",
    relief: lane === "explore" ? num("relief", 0) : 0,
    // null = "not named", resolved against the map's sealevel once the scene
    // is loaded; readLook only sees the query, so it cannot know the map yet
    datum: lane === "explore" && p.get("datum") !== null ? num("datum", 0) : null,
    slope: num("slope", 1),
    amb, norm, unitNorm,
    sun: sunV, sunAE: lit ? sun : null,
    unitSun: unitV, unitSunAE: unitAE,
    shadowSun: sunVector(shadowAE[0], shadowAE[1]), shadowSunAE: shadowAE,
    shadowlen,

    // once the scene is loaded, like datum
    undither: lane !== "explore" ? false

    filter: lane !== "explore" ? "nearest" : filter,
    aniso: Math.max(1, Math.floor(num("aniso", 4))),
    shadows: lit && p.get("shadows") !== "0",
    // CLASSIC only: the silhouette drop shadow. A debug split like `feat=`,
    // because "is the shadow drawing at all" is not eye-answerable, and the
    // one way to reproduce the pre-2026-09-04 Classic baseline
    unitShadows: p.get("unitshadow") !== "0",
    penumbra: Math.max(0, num("penumbra", 0.05)),
    shade: Math.min(1, Math.max(0, num("shade", 1))),
    terrainshadow: p.get("terrainshadow") !== "0",
    shadowres: Math.max(256, Math.min(4096, num("shadowres", 2048) | 0)),
    bslack: Math.max(0, num("bslack", 0)),
    bfloor: Math.max(0, num("bfloor", 0)),
    pbias: Math.max(0, num("pbias", 0)),
    mindist: Math.max(0, num("mindist", 0)),
    castsmooth: Math.max(0, Math.min(8, num("castsmooth", 0) | 0)),
    noff: Math.max(0, num("noff", 0)),
    pofac: num("pofac", 0), pounits: num("pounits", 0),
    // castsplit: mirror the split the GAME had — a separate world-space
    // caster mesh (build_hills, deleted from the game) and a receiver that reconstructs its world point
    // per fragment, instead of casting and shading one buffer. Default ON:
    // what the lab shows should be what the game does (renderers.md 2.7b).
    castsplit: p.get("castsplit") !== "0",
    airshadow: (() => {
      const v = p.get("airshadow") || "len";
      if (!["drop", "len", "physical"].includes(v))
        fail(`${label}: airshadow must be drop, len or physical`);
      return v;

    // past the map's edge (header, EDGE): black, as the game draws it, or the
    // map mirrored across the edge in the fog's grey, dimmed and faded

    edgeGrey: Math.min(1, Math.max(0, num("edgegrey", 0.75))),
    edgeFade: Math.max(32, num("edgefade", 1536)),

  }
  float lam;
  if (uCastSplit == 1) {
    // the vertex carries the point it DEPICTS, (x, h, z + h/2); the game's
    // vWorld is the flat grid point under it, which is that with the shear
    // taken back out. Both interpolate linearly across the quad, so this is
    // the same varying the game's terrain shader receives.
    vec2 w = vec2(vWorld.x, vWorld.z - 0.5 * vWorld.y);
    vec3 dWdx, dWdy;
    vec3 W = taTerrW(w, dWdx, dWdy);
    lam = lambertD(taTerrN(w), W, dWdx, dWdy);
  } else {
    lam = lambert(vNrm, vWorld);
  }
  frag = vec4(rgb * lam, 1.0);
}`;

// Features are billboards, so there is no normal to light them by; they take
// the GROUND's lambert at their own anchor cell instead, which is what makes a
// tree on a shadowed slope sit in the shadow rather than on top of it.
const LAB_SPR_VS = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in vec2 aUV;
layout(location=2) in vec2 aCM;     // colour key /255, mode
layout(location=3) in vec2 aWorld;  // unused here; kept so one build fills both
layout(location=4) in float aLam;   // ground lambert at the anchor
uniform vec2 uGame;
uniform float uDepthScale;
uniform float uZoom; uniform vec2 uZoomC;
out vec2 vUV; flat out vec2 vCM; flat out float vLam;
void main(){
  vec2 p = (aPos.xy - uZoomC) * uZoom + uZoomC;
  gl_Position = vec4(p.x/uGame.x*2.0-1.0, p.y/uGame.y*2.0-1.0,
                     clamp(1.0 - aPos.z/uDepthScale, 0.0, 1.0), 1.0);
  vUV = aUV; vCM = aCM; vLam = aLam;
}`;
const LAB_SPR_FS = `#version 300 es
precision highp float;
in vec2 vUV; flat in vec2 vCM; flat in float vLam;
out vec4 frag;
uniform sampler2D uAtlas;
uniform sampler2D uRGB;
uniform sampler2D uPal;
uniform int uUndither;
void main(){
  vec3 rgb;
  if (uUndither == 1) {
    // the restorer inpaints the colour key and keeps its alpha, so the hole
    // arrives as alpha and not as an index compare
    vec4 t = texture(uRGB, vUV);
    if (t.a < 0.5) discard;
    rgb = t.rgb;
  } else {
    float idx = texture(uAtlas, vUV).r;
    if (abs(idx - vCM.x) < 0.5/255.0) discard;
    rgb = texelFetch(uPal, ivec2(int(idx*255.0+0.5), 0), 0).rgb;
  }
  float a = (int(vCM.y + 0.5) == 2) ? 0.5 : 1.0;
  frag = vec4(rgb * vLam * a, a);
}`;

// The unit lab shader ignores slot 3 (tagpu's PALETTE.SHD row / 31) and lights
// from slot 6, the posed face normal, per PIXEL through LAB_LIGHT. Same buffer,
// same stride, one attribute more — which is the whole difference between the
// two shading philosophies: 32 shade rows chosen per face (the game turns the
// row into an RGB multiplier in both of its presets, shadeK below), or a
// lambert evaluated at every fragment, where a local light can vary across the
// face.
const LAB_UNIT_VS = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in vec2 aUV;
layout(location=2) in vec2 aFC;     // flat idx/255, tex colour key/255
layout(location=4) in vec2 aWorld;
layout(location=5) in float aVY;
layout(location=6) in vec3 aNrm;    // posed, map space, unit length; flat per face
layout(location=7) in vec3 aWorld3; // posed world position, map space
uniform vec2 uGame;
uniform float uDepthScale;
uniform float uZoom; uniform vec2 uZoomC;
out vec2 vUV; flat out vec2 vFC; out vec3 vNrm; out vec3 vWorld;
void main(){
  vec2 p = (aPos.xy - uZoomC) * uZoom + uZoomC;
  gl_Position = vec4(p.x/uGame.x*2.0-1.0, p.y/uGame.y*2.0-1.0,
                     clamp(1.0 - aPos.z/uDepthScale, 0.0, 1.0), 1.0);
  vUV = aUV; vFC = aFC; vNrm = aNrm; vWorld = aWorld3;
}`;
const LAB_UNIT_FS = `#version 300 es
precision highp float;
in vec2 vUV; flat in vec2 vFC; in vec3 vNrm; in vec3 vWorld;
out vec4 frag;
uniform sampler2D uAtlas;
uniform sampler2D uRGB;
uniform sampler2D uPal;
uniform int uUndither;
${LAB_LIGHT}
void main(){
  vec3 rgb;
  if (vUV.x < 0.0) {                          // untextured face: one index
    rgb = texelFetch(uPal, ivec2(int(vFC.x*255.0+0.5), 0), 0).rgb;
  } else if (uUndither == 1) {
    vec4 t = texture(uRGB, vUV);
    if (t.a < 0.5) discard;
    rgb = t.rgb;
  } else {
    float idx = texture(uAtlas, vUV).r;
    if (abs(idx - vFC.y) < 0.5/255.0) discard;
    rgb = texelFetch(uPal, ivec2(int(idx*255.0+0.5), 0), 0).rgb;
  }
  frag = vec4(rgb * lambert(vNrm, vWorld), 1.0);
}`;

// ---- past the map's edge: the mirror (header, EDGE) ------------------------
// A cell off the map draws the tile of the cell it mirrors, texels flipped on
// each axis the reflection crossed. It takes TA's own fog-of-war grey — the
// engine's grey table is (R+G+B)/3 then the nearest palette colour (0x4BAD30,
// exe-reverse-engineering.md), which TAGPU_GLSL_FOG_GREY_RGB reproduces as the
// plain RGB mean — dimmed, and faded smoothly toward black with the distance
// from the map (edgesteps= cuts the fade into bands, and edgedither= dithers
// across them in WORLD texels, both off by default). Unlit: the
// art is painted lit from the north-west, and its mirror image is lit from
// wherever the reflection sent that light, which no sun direction agrees with.
const EDGE_VS = `#version 300 es
precision highp float;
layout(location=0) in vec2 aPos;    // game px, where the grid places the cell
layout(location=1) in vec2 aUV;     // the mirrored cell's texels
layout(location=2) in vec2 aWorld;  // the off-map grid point it stands on
uniform vec2 uGame;
uniform float uZoom; uniform vec2 uZoomC;
out vec2 vUV; out vec2 vWorld;
void main(){
  vec2 p = (aPos - uZoomC) * uZoom + uZoomC;
  gl_Position = vec4(p.x/uGame.x*2.0-1.0, p.y/uGame.y*2.0-1.0, 0.0, 1.0);
  vUV = aUV; vWorld = aWorld;
}`;
// The mirror's tone, shared by its terrain and its features so the two cannot
// drift: the band a drawn point falls in, from its distance to the map on the
// tile grid, and what that band does to a colour. Full colour in both lanes:
// the mirror is not something the engine draws, so Classic has no palette to
// stay inside here, and an 8-bit fade either bands or dithers.
const EDGE_TONE = `
uniform sampler2D uPal;
uniform vec2 uMapPx;         // the map's extent on the tile grid, px
uniform vec4 uEdge;          // brightness at the edge, grey, fade px, bands
uniform int uDither;
const float BAYER[16] = float[16](0.0, 8.0, 2.0, 10.0, 12.0, 4.0, 14.0, 6.0,
                                  3.0, 11.0, 1.0, 9.0, 15.0, 7.0, 13.0, 5.0);
float edgeT(vec2 w) {
  vec2 o = max(max(-w, w - uMapPx), vec2(0.0));
  return clamp(length(o) / uEdge.z, 0.0, 1.0);
}
float edgeBand(vec2 w, float t) {
  float f = t * uEdge.w;
  if (uDither == 1) {
    ivec2 q = ivec2(floor(w)) & 3;
    f += (BAYER[q.y * 4 + q.x] + 0.5) / 16.0;
  }
  return clamp(floor(f), 0.0, uEdge.w);
}
vec3 edgeRGB(vec3 c, vec2 w) {
  float t = edgeT(w), band = edgeBand(w, t), S = uEdge.w;
  c = mix(c, vec3(dot(c, vec3(1.0/3.0))), uEdge.y);
  return c * uEdge.x * (S > 0.0 ? 1.0 - band / S : 1.0 - t);
}
// an index's colour: the texel exactly as Classic draws it
vec3 edgePal(float idx) {
  return texelFetch(uPal, ivec2(int(idx * 255.0 + 0.5), 0), 0).rgb;
}`;
const EDGE_FS = `#version 300 es
precision highp float;
in vec2 vUV; in vec2 vWorld;
out vec4 frag;
uniform sampler2D uAtlas;    // R8 palette indices
uniform sampler2D uRGB;      // restored colour, same layout
uniform int uUndither;
${EDGE_TONE}
void main(){
  vec3 c = uUndither == 1 ? texture(uRGB, vUV).rgb : edgePal(texture(uAtlas, vUV).r);
  frag = vec4(edgeRGB(c, vWorld), 1.0);
}`;
// The map's own features, mirrored with the terrain under them: the sprite
// format of tagpu_feat.c (so the depth keys sort them against the map's own
// features), but slot 3 is the point each corner is DRAWN at on the tile grid,
// which is what the tone's distance and dither read.
const EDGE_SPR_VS = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;    // game px x, y, depth key
layout(location=1) in vec2 aUV;
layout(location=2) in vec2 aCM;     // colour key /255, mode
layout(location=3) in vec2 aWorld;  // the drawn point on the tile grid
uniform vec2 uGame;
uniform float uDepthScale;
uniform float uZoom; uniform vec2 uZoomC;
out vec2 vUV; flat out vec2 vCM; out vec2 vWorld;
void main(){
  vec2 p = (aPos.xy - uZoomC) * uZoom + uZoomC;
  gl_Position = vec4(p.x/uGame.x*2.0-1.0, p.y/uGame.y*2.0-1.0,
                     clamp(1.0 - aPos.z/uDepthScale, 0.0, 1.0), 1.0);
  vUV = aUV; vCM = aCM; vWorld = aWorld;
}`;
const EDGE_SPR_FS = `#version 300 es
precision highp float;
in vec2 vUV; flat in vec2 vCM; in vec2 vWorld;
out vec4 frag;
uniform sampler2D uAtlas;
uniform sampler2D uRGB;
uniform int uUndither;
${EDGE_TONE}
void main(){
  // a side copy stays off the map's own columns, where its overhang would lay
  // a reflected tree over the tree it reflects; a copy above or below crosses
  // nothing here, since buildFeatures drops any that would
  if (all(greaterThanEqual(vWorld, vec2(0.0))) && all(lessThan(vWorld, uMapPx))) discard;
  vec3 rgb;
  if (uUndither == 1) {
    vec4 t = texture(uRGB, vUV);
    if (t.a < 0.5) discard;
    rgb = edgeRGB(t.rgb, vWorld);
  } else {
    float idx = texture(uAtlas, vUV).r;
    if (abs(idx - vCM.x) < 0.5/255.0) discard;
    rgb = edgeRGB(edgePal(idx), vWorld);
  }
  float a = (int(vCM.y + 0.5) == 2) ? 0.5 : 1.0;
  frag = vec4(rgb * a, a);
}`;

// ---- the composite: FBO -> canvas, flipped, and the wipe --------------------
// The offscreen holds the game frame with row 0 at the BOTTOM (see the header
// comment). Canvas NDC +1 is the top, so the top of the canvas samples v = 0.
const BLIT_VS = `#version 300 es
precision highp float;
out vec2 vUV;
void main(){
  vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  vUV = vec2(p.x, 1.0 - p.y);
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;
const DEBUG_FS = `#version 300 es
precision highp float;
in vec2 vUV; out vec4 frag;
uniform highp sampler2D uShadowRaw;
void main(){
  float d = texture(uShadowRaw, vec2(vUV.x, 1.0 - vUV.y)).r;   // light-space v up
  frag = vec4(vec3(1.0 - d), 1.0);                             // near = bright
}`;
const BLIT_FS = `#version 300 es
precision highp float;
in vec2 vUV; out vec4 frag;
uniform sampler2D uA;
uniform sampler2D uB;
uniform float uWipe;      // split position in canvas x; > 1 = side A only
uniform float uWidth;     // canvas width in px, so the divider is one pixel
uniform int uSS;          // the offscreen is uSS x the canvas: exact box filter
void main(){
  ivec2 sz = textureSize(uA, 0);
  ivec2 base = ivec2(floor(vUV * vec2(sz) / float(uSS))) * uSS;
  vec3 c = vec3(0.0);
  for (int j = 0; j < uSS; j++)
    for (int i = 0; i < uSS; i++)
      c += (vUV.x < uWipe) ? texelFetch(uA, base + ivec2(i, j), 0).rgb
                           : texelFetch(uB, base + ivec2(i, j), 0).rgb;
  c /= float(uSS * uSS);
  if (uWipe <= 1.0 && abs(vUV.x - uWipe) * uWidth < 1.0) c = vec3(0.85, 0.70, 0.29);
  frag = vec4(c, 1.0);
}`;

// ---------------------------------------------------------------------------
// ORDER MARKERS (header, ORDER MARKERS). Drawn straight onto the canvas after
// the composite, so an animation tick redraws only this layer and never the
// world. Vertices are canvas px with row 0 at the top; one stride-9 layout for
// all three primitives: x,y, u,v, mode,alpha, r,g,b.
const ORD_VS = `#version 300 es
precision highp float;
layout(location=0) in vec2 aPos;
layout(location=1) in vec2 aUV;     // atlas texels (sprite) or -1..1 (disc)
layout(location=2) in vec2 aMA;     // mode, alpha
layout(location=3) in vec3 aCol;    // the solid colour of a disc or a bar
uniform vec2 uCanvas;
out vec2 vUV; flat out vec2 vMA; flat out vec3 vCol;
void main(){
  gl_Position = vec4(aPos.x/uCanvas.x*2.0-1.0, 1.0-aPos.y/uCanvas.y*2.0, 0.0, 1.0);
  vUV = aUV; vMA = aMA; vCol = aCol;
}`;
const ORD_FS = `#version 300 es
precision highp float;
in vec2 vUV; flat in vec2 vMA; flat in vec3 vCol;
out vec4 frag;
uniform sampler2D uOrd;   // RGBA, every texel its palette colour, (0,0,0,0) at the key
uniform int uFilter;      // 0 nearest, 1 sharp, 2 linear
void main(){
  int mode = int(vMA.x + 0.5);
  vec4 c;
  if (mode == 1) {                          // a disc, its edge one pixel soft
    float r = length(vUV);
    c = vec4(vCol, 1.0) * clamp((1.0 - r) / max(fwidth(r), 1e-4) + 0.5, 0.0, 1.0);
  } else if (mode == 2) {
    c = vec4(vCol, 1.0);                    // a bar
  } else if (uFilter == 0) {
    c = texelFetch(uOrd, ivec2(floor(vUV)), 0);
  } else {
    vec2 t = vUV;
    if (uFilter == 1) {
      // SHARP: each texel flat, and only the one screen pixel straddling a
      // texel boundary blended — nearest's look without its uneven texels at
      // a scale that is not a whole number
      vec2 p = t - 0.5, f = fract(p), s = max(fwidth(p), vec2(1e-4));
      t = floor(p) + clamp((f - 0.5) / s + 0.5, 0.0, 1.0) + 0.5;
    }
    c = texture(uOrd, t / vec2(textureSize(uOrd, 0)));
  }
  frag = c * vMA.y;                         // premultiplied
}`;

// What each scenario order draws: the order descriptor's marker mask (+0x0C)
// and cursor_ary index (+0x10), read out of the 25-byte records behind
// *(u32*)0x512344 in the pristine exe (exe-reverse-engineering.md, the order
// descriptor table). Bit 1 is the sprite and, for the unit under the mouse,
// the route dots (0x4394E0); bit 3 the sprite alone (0x439740). No stock
// record sets bit 2, the target circle. Which record a scenario `cmd` issues
// for a GROUND unit is [INFERRED] from the names: move Move_Ground, patrol
// Patrol, attack Attack_Chase, defend Follow_Ground, repair RepairUnit,
// reclaim Reclaim, capture Capture, load Ground_Pickup, unload Ground_Unload,
// teleport Teleport, blast AttackSpecial.
const ORDER_TYPES = {
  move: [0x12, "cursormove"], patrol: [0x12, "cursorpatrol"],
  attack: [0x08, "cursorattack"], blast: [0x08, "cursorattack"],
  defend: [0x12, "cursordefend"], repair: [0x12, "cursorrepair"],
  reclaim: [0x12, "cursorreclamate"], capture: [0x08, "cursorcapture"],
  load: [0x08, "cursorload"], unload: [0x08, "cursorunload"],
  teleport: [0x08, "cursorteleport"], stop: [0, null],
};
// the overlay's knobs, `ord<key>`; the first value of each is the default
const ORD_KNOBS = {
  style: ["gaf", "proc", "off"],
  size: ["world", "screen", "int", "clamp"],
  filter: ["nearest", "sharp", "linear"],
  space: ["world", "screen", "octave"],
  anim: ["engine", "cursor"],
  tick: ["int", "smooth"],
  dots: ["all", "active"],
};

// ---------------------------------------------------------------------------
async function main() {
  const scene = await fetchJSON("scene.json");
  let presets = {};
  try {
    presets = (await fetchJSON("tascene-presets.json")).presets || {};
  } catch (e) { presets = {}; }        // a pack served without the presets file

  // NOTHING NAMED SHOWS BOTH: a bare page (or eye/zoom/ss alone) is the wipe,
  // Classic on the left, Classic++ on the right. A renderer, a preset or any
  // Classic++ parameter at the top level names one look and shows it alone.
  // Under shot=1 nothing named is Classic alone: a shot is a measurement, and
  // `tascene shot pack` with no options is the parity ritual's baseline.
  const NAMES = new Set(["lane", "preset", ...EXPLORE_ONLY]);
  const nothingNamed = Q.get("a") === null && Q.get("b") === null &&
                       ![...Q.keys()].some((k) => NAMES.has(k));
  const sides = nothingNamed && !SHOT
    ? [readLook(sideQuery("lane=classic", presets), "a"),
       readLook(sideQuery("lane=classicpp", presets), "b")]
    : [readLook(sideQuery(Q.get("a"), presets), "a")];
  if (sides.length === 1 && Q.get("b") !== null)
    sides.push(readLook(sideQuery(Q.get("b"), presets), "b"));
  let wipe = sides.length > 1 ? Math.min(1, Math.max(0, parseFloat(Q.get("wipe") ?? "0.5")))
                              : 2.0;

  // The displacement pivots about a reference height rather than about 0. The
  // engine's tile art is ALREADY the oblique projection of the hill, so any
  // displacement re-applies it; the part of h/2 that is common to the whole
  // viewport is pure misregistration carrying no shape at all. Pivoting about
  // the map's own sealevel removes it — on Two Continents that is 66.4 px of
  // mean slide down to 28.9 px, and a cell at the waterline lands exactly
  // where the engine paints it. datum=0 restores the un-pivoted behaviour.
  for (const L of sides) if (L.datum === null) L.datum = scene.map.sealevel || 0;
  // undither not named: restored when the pack carries the atlases
  for (const L of sides) if (L.undither === null) L.undither = !!scene.map.atlas.rgba;
  // filter not named: linear where the unit atlas can be mipmapped without
  // bleeding, i.e. a pack built with the padded layout
  const unitPad = (scene.units && scene.units.atlas.pad) || 0;
  for (const L of sides) {
    if (L.filter === null) L.filter = unitPad >= 4 ? "linear" : "nearest";
    else if (L.filter === "linear" && L.lane === "explore" && scene.units && unitPad < 4)
      fail("filter=linear, but this pack's unit atlas is not padded for mipmaps.\n" +
           "Rebuild it with:  tools/tascene build <scenario> -o <pack> --undither");
  }

  const view = scene.view, map = scene.map;
  // WHERE THE MAP ENDS (tagpu_fx.h tagpu_edge_area): the engine's scroll
  // extent, the tile map less 32 px wide and 128 px tall, in 32-px tile cells.
  // Stock never shows a pixel past it, so the camera stops there and the mirror
  // folds there; the strip between it and the tile map is drawn as the
  // reflection. At most the tile map's own size, so a folded cell indexes it.
  const edgeArea = (extent, n) => {
    const a = Math.floor(extent / 32);
    return a > 0 && a < n ? a : n;
  };
  const areaC = edgeArea(map.w16 * 16 - 32, map.tilemap.w);
  const areaR = edgeArea(map.h16 * 16 - 128, map.tilemap.h);
  const [GW, GH] = view.res;
  const [vpL, vpT, vw, vh] = view.vp;
  // THE ZOOMED VIEW. The viewport shows vw/zoom x vh/zoom world units centred
  // where the zoom-1 view is centred; E is that region's top-left and W its
  // size, both integer. Every builder sweeps from E over W and places its
  // vertices relative to E at scale 1; the shaders scale about (vpL, vpT) by
  // uZoom — tagpu's own transform with its centre moved to the corner, the
  // same picture. At zoom 1, E is the eye and W the viewport: byte-identical.
  let E = [0, 0], W = [vw, vh];                   // set by zoomView() before every draw
  function zoomView() {
    const ww = vw / zoom, wh = vh / zoom;
    E = [Math.floor(eye[0] + (vw - ww) / 2), Math.floor(eye[1] + (vh - wh) / 2)];
    W = [Math.ceil(ww) + (zoom === 1 ? 0 : 1), Math.ceil(wh) + (zoom === 1 ? 0 : 1)];
  }
  const ZOOM_C = [vpL, vpT];
  let eye = view.eye.slice();
  if (Q.get("eye")) eye = Q.get("eye").split(",").map(Number);

  const cv = document.getElementById("cv");
  cv.width = GW; cv.height = GH;
  // The canvas must land on device pixels 1:1 or at an integer multiple. A
  // non-integer nearest-neighbour upscale duplicates every Nth row and column,
  // and WHICH ones shifts as the content pans — a shimmer on any fine texture
  // (the kbot lab's roof) that the game, drawing 1:1, never shows. Measured at
  // devicePixelRatio 1.1: 1024 backing px drawn onto 1126 device px. Browser
  // zoom changes the ratio live, so refit on resize.
  const fit = () => {
    const dpr = window.devicePixelRatio || 1;
    const k = Math.max(1, Math.floor(dpr + 1e-6));
    cv.style.width = `${GW * k / dpr}px`;
    cv.style.height = `${GH * k / dpr}px`;
    cv.dataset.device = `${k}:1 @ ${dpr.toFixed(2)}`;
  };
  fit();
  addEventListener("resize", () => { fit(); if (!SHOT) report(); });
  cv.style.width = GW + "px"; cv.style.height = GH + "px";
  const gl = cv.getContext("webgl2", { antialias: false, preserveDrawingBuffer: true });
  if (!gl) fail("no WebGL2 context");
  // A LOST CONTEXT KILLS EVERY GL OBJECT THE PAGE HOLDS, and the page builds
  // them once, so the only recovery is a fresh load. Measured on the first
  // page of a fresh headless Chromium on ANGLE-Vulkan: the context is lost
  // ~0.4 s into loading and every page after it is fine, and the symptom was
  // "offscreen framebuffer incomplete" (status 0x8cdd from a dead context).
  // So the page asks for the context back and reloads when it returns; the
  // count stops a GPU that keeps losing it from reloading forever.
  cv.addEventListener("webglcontextlost", (e) => {
    e.preventDefault();
    contextLost = true;
    let n = 0;
    try { n = +sessionStorage.getItem("tascene-lost") || 0; } catch (_) {}
    err.style.display = "block";
    if (n >= 3) {
      err.textContent = "the WebGL context was lost three loads running; reload by hand";
      return;
    }
    try { sessionStorage.setItem("tascene-lost", String(n + 1)); } catch (_) {}
    err.textContent = "the WebGL context was lost; reloading when it comes back";
  });
  cv.addEventListener("webglcontextrestored", () => {
    let n = 0;
    try { n = +sessionStorage.getItem("tascene-lost") || 0; } catch (_) {}
    if (n <= 3) location.reload();
  });

  // ---- what the union of the sides actually needs
  const any = (f) => sides.some(f);
  const hasFeat = !!scene.features && any((L) => L.features);
  const hasUnit = !!scene.units && any((L) => L.units);
  const hasTerr = any((L) => L.terrain);
  const wantParity = any((L) => L.lane === "parity");
  const wantLab = any((L) => L.lane === "explore");
  // `airshadow=drop` asks the Classic++ lane for a CLASSIC silhouette under its
  // aircraft, so that lane needs the parity unit program compiled as well
  const wantUnitClassic = wantParity || any(
    (L) => L.lane === "explore" && L.airshadow === "drop" && L.unitShadows);
  const wantRGB = any((L) => L.undither);
  const labD = scene.labDepth || { terrain: 0.10, flat: 0.50, tallCol: 0.9 };
  // tagpu_terr.c's guard rail: cells sit CELL_PITCH apart and the border texel
  // is a COPY of the cell's edge, so a fragment landing exactly on a quad's far
  // edge resolves to the right colour instead of the first texel of the NEXT
  // cell. Packs built before the guard have neither field — fall back to the
  // old flush 32-px layout rather than reading one cell to the left.
  const PITCH = map.atlas.pitch || TILE_PX;
  const BORDER = map.atlas.border || 0;

  if (wantRGB && !map.atlas.rgba)
    fail("undither=1, but this pack has no restored atlases.\n" +
         "Rebuild it with:  tools/tascene build <scenario> -o <pack> --undither");

  const [atlasBuf, tilemapBuf, heightBuf, palBuf, terrVS, terrFS, sprVS, sprFS] =
    await Promise.all([
      fetchBin(map.atlas.file), fetchBin(map.tilemap.file), fetchBin(map.height.file),
      fetchBin(scene.palette.file),
      wantParity ? fetchText("shaders/terrain.vert") : "",
      wantParity ? fetchText("shaders/terrain.frag") : "",
      hasFeat && wantParity ? fetchText("shaders/sprite.vert") : "",
      hasFeat && wantParity ? fetchText("shaders/sprite.frag") : "",
    ]);
  const [featAtlas, featInst] = hasFeat ? await Promise.all([
    fetchBin(scene.features.atlas.file), fetchBin(scene.features.instances),
  ]) : [null, null];

  let unitAtlas = null, shdBuf = null, unitVS = "", unitFS = "", meshData = {};
  // the structure shadow's casters (tascene: the engine's own piece rule),
  // model-space x,y,z triangles; a pack built before it has none
  const slantData = {};
  if (hasUnit) {
    [unitAtlas, shdBuf, unitVS, unitFS] = await Promise.all([
      fetchBin(scene.units.atlas.file), fetchBin(scene.palette.shd),
      wantUnitClassic ? fetchText("shaders/unit.vert") : "",
      wantUnitClassic ? fetchText("shaders/unit.frag") : "",
    ]);
    await Promise.all(Object.entries(scene.units.meshes).map(async ([k, m]) => {
      const b = await fetchBin(m.file);
      meshData[k] = new Float32Array(b.buffer, b.byteOffset, b.byteLength >> 2);
      if (m.slant && m.slant.verts > 0) {
        const c = await fetchBin(m.slant.file);
        slantData[k] = new Float32Array(c.buffer, c.byteOffset, c.byteLength >> 2);
      }
    }));
  }
  const [terrRGB, featRGB, unitRGB] = wantRGB ? await Promise.all([
    map.atlas.rgba ? fetchBin(map.atlas.rgba) : null,
    hasFeat && scene.features.atlas.rgba ? fetchBin(scene.features.atlas.rgba) : null,
    hasUnit && scene.units.atlas.rgba ? fetchBin(scene.units.atlas.rgba) : null,
  ]) : [null, null, null];

  const tilemap = new Uint16Array(tilemapBuf.buffer, tilemapBuf.byteOffset,
                                  tilemapBuf.byteLength >> 1);

  // Raw bytes straight to texImage2D: no image decode path, so nothing
  // colour-manages or premultiplies the palette INDICES (tascene-design.md).
  // The restored atlases go the same way for the same reason — a browser is
  // free to rewrite a PNG's colours and would do it silently.
  tex2D(gl, 0, gl.R8, map.atlas.w, map.atlas.h, gl.RED, gl.UNSIGNED_BYTE, atlasBuf);
  tex2D(gl, 1, gl.RGBA8, 256, 1, gl.RGBA, gl.UNSIGNED_BYTE, palBuf);
  // fog is off in the parity fixture, but the samplers must still be bound
  tex2D(gl, 2, gl.RG8, 1, 1, gl.RG, gl.UNSIGNED_BYTE, new Uint8Array([0, 0]));
  const DUMMY = new Uint8Array([0, 0, 0, 0]);
  const rgbaTex = (unit, buf, w, h) =>
    tex2D(gl, unit, gl.RGBA8, buf ? w : 1, buf ? h : 1, gl.RGBA, gl.UNSIGNED_BYTE,
          buf || DUMMY);
  // the base atlas (every index its palette colour, alpha 0 at a frame's
  // key) and the face-shade multipliers: tascene-render.js's, over this pack's palette
  const baseAtlas = (r8, w, h, rects, pad) => TR.baseAtlas(palBuf, r8, w, h, rects, pad);
  rgbaTex(8, terrRGB, map.atlas.w, map.atlas.h);

  // ---- offscreen(s) at game resolution (x SS). One per wipe side, because the
  // wipe compares two whole frames, not two halves of one.
  const FW = GW * SS, FH = GH * SS;
  function offscreen() {
    const colour = gl.createTexture();
    gl.activeTexture(gl.TEXTURE4); gl.bindTexture(gl.TEXTURE_2D, colour);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, FW, FH, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    // the composite texelFetches its SS x SS box, so no filter is involved
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    // DEPTH24_STENCIL8, not DEPTH_COMPONENT24: the Classic silhouette shadow
    // needs a stencil to blend each shadow exactly once (see drawUnits)
    const depth = gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER, depth);
    gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH24_STENCIL8, FW, FH);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, colour, 0);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_STENCIL_ATTACHMENT, gl.RENDERBUFFER, depth);
    if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE)
      fail("offscreen framebuffer incomplete");
    return { colour, fbo };
  }
  const targets = sides.map(offscreen);

  // ---- terrain, parity: tagpu's own shaders and the 32-px grid, instanced
  // (tascene-render.js classicTerrain)
  const TVST = 6;              // the mirror's vertex: x,y, u,v, wx,wz
  const terr = wantParity ? TR.classicTerrain(gl, terrVS, terrFS, map.atlas, atlasBuf, palBuf) : null;

  // ---- terrain, exploration: the 16-px heightfield
  const LTVST = 11;                     // x,gy,row, u,v, nx,ny,nz, WX,WY,WZ
  let ltProg = null, LTU = {};
  // each side keeps its own chunks (buildTerrainLab)
  const ltStore = (L) => L.lt || (L.lt = { chunks: new Map(), knobs: "", frame: 0, draw: [] });
  if (wantLab) {
    ltProg = program(gl, LAB_TERR_VS, LAB_TERR_FS, "lab-terrain");
    LTU = uniforms(gl, ltProg, ["uGame", "uDepthScale", "uAtlas", "uRGB", "uPal",
                                "uUndither", "uSun", "uAmb", "uNorm", "uZoom", "uZoomC",
                                "uHeight", "uHDim", "uCastSplit", "uShift", "uKey",
                                ...SHADOW_U]);
    // the height grid the game's fragment shader reads (tagpu_terr.c
    // build_height): R8, one byte per 16-px cell, NEAREST, clamped
    tex2D(gl, 14, gl.R8, map.w16, map.h16, gl.RED, gl.UNSIGNED_BYTE, heightBuf);
    gl.activeTexture(gl.TEXTURE0);        // tex2D leaves its own unit selected
  }

  // ---- past the map's edge: the mirror, in both lanes (EDGE_VS/FS). Always
  // compiled, because the status bar toggles it live. Same vertex layout as
  // the parity terrain: x,y, u,v, wx,wz.
  const edgeProg = program(gl, EDGE_VS, EDGE_FS, "edge");
  const edgeVAO = gl.createVertexArray(), edgeVBO = gl.createBuffer();
  gl.bindVertexArray(edgeVAO);
  gl.bindBuffer(gl.ARRAY_BUFFER, edgeVBO);
  for (let i = 0; i < 3; i++) {
    gl.enableVertexAttribArray(i);
    gl.vertexAttribPointer(i, 2, gl.FLOAT, false, TVST * 4, i * 8);
  }
  gl.bindVertexArray(null);
  const EU = uniforms(gl, edgeProg, ["uGame", "uZoom", "uZoomC", "uAtlas", "uRGB", "uPal",
                                     "uUndither", "uMapPx", "uEdge", "uDither"]);
  // EDGE_TONE's uniforms, on whichever mirror program is in use
  function edgeTone(U, L) {
    gl.uniform1i(U.uPal, 1);
    gl.uniform2f(U.uMapPx, areaC * 32, areaR * 32);
    gl.uniform4f(U.uEdge, L.edgeDim, L.edgeGrey, L.edgeFade, L.edgeSteps);
    gl.uniform1i(U.uDither, L.edgeDither ? 1 : 0);
  }

  // ---- feature (sprite) pass — tagpu_feat.c's shaders and vertex format, plus
  // the lab's one extra float (the anchor's ground lambert)
  const SVST = 9;                                   // x,y,enc, u,v, ck,mode, wx,wz
  const LSVST = 10;                                 // ... + lam
  let spr = null, lsProg = null, lsVAO = null, sprVBO = null;
  let LSU = {}, anchors = [], mapAnchors = [];
  let sprVerts = null, esProg = null, esVAO = null, esVBO = null, ESU = {};
  let esVerts = new Float32Array(1);
  if (hasFeat) {
    tex2D(gl, 5, gl.R8, scene.features.atlas.w, scene.features.atlas.h,
          gl.RED, gl.UNSIGNED_BYTE, featAtlas);
    rgbaTex(9, featRGB, scene.features.atlas.w, scene.features.atlas.h);
    sprVBO = gl.createBuffer();
    if (wantParity)
      spr = TR.classicSprites(gl, sprVS, sprFS, sprVBO, scene.features, featAtlas, palBuf);
    if (wantLab) {
      lsProg = program(gl, LAB_SPR_VS, LAB_SPR_FS, "lab-sprite");
      lsVAO = gl.createVertexArray();
      gl.bindVertexArray(lsVAO);
      gl.bindBuffer(gl.ARRAY_BUFFER, sprVBO);
      const sizes = [3, 2, 2, 2, 1], offs = [0, 12, 20, 28, 36];
      for (let i = 0; i < 5; i++) {
        gl.enableVertexAttribArray(i);
        gl.vertexAttribPointer(i, sizes[i], gl.FLOAT, false, LSVST * 4, offs[i]);
      }
      gl.bindVertexArray(null);
      LSU = uniforms(gl, lsProg, ["uGame", "uDepthScale", "uAtlas", "uRGB",
                                  "uPal", "uUndither", "uZoom", "uZoomC"]);
    }
    // cell -> anchor, so the sweep can look features up in its own order
    const inst = new Uint16Array(featInst.buffer, featInst.byteOffset,
                                 featInst.byteLength >> 1);
    for (let i = 0; i < inst.length; i += 3)
      anchors[inst[i + 1] * map.w16 + inst[i]] = inst[i + 2];
    // the same, for the MAP's own anchors only — the TNT's, which come first
    // in the list: the mirror carries what the map is, not what a scenario
    // placed on it. A pack built before the split says nothing, and then every
    // anchor counts as the map's.
    const nMap = scene.features.map ?? inst.length / 3;
    for (let i = 0; i < nMap * 3; i += 3)
      mapAnchors[inst[i + 1] * map.w16 + inst[i]] = inst[i + 2];
    sprVerts = new Float32Array(65536 * LSVST);
    esProg = program(gl, EDGE_SPR_VS, EDGE_SPR_FS, "edge-sprite");
    esVAO = gl.createVertexArray(); esVBO = gl.createBuffer();
    gl.bindVertexArray(esVAO);
    gl.bindBuffer(gl.ARRAY_BUFFER, esVBO);
    const sizes = [3, 2, 2, 2], offs = [0, 12, 20, 28];
    for (let i = 0; i < 4; i++) {
      gl.enableVertexAttribArray(i);
      gl.vertexAttribPointer(i, sizes[i], gl.FLOAT, false, SVST * 4, offs[i]);
    }
    gl.bindVertexArray(null);
    ESU = uniforms(gl, esProg, ["uGame", "uZoom", "uZoomC", "uDepthScale", "uAtlas", "uRGB",
                                "uUndither", "uPal", "uMapPx", "uEdge", "uDither"]);
  }
  // ---- unit pass — tagpu_native.c's shaders, tagpu_render3do.c's geometry rule
  // (tascene-render.js emitUnits, classicUnits)
  const UVST = TR.UVST;
  let uVAO = null, uVBO = null, luProg = null, cu = null, LUU = {};
  let uVerts = null;
  const meshTop = {};                 // model height (max y) per unit type
  let unitRGBTex = null;
  const ANISO = gl.getExtension("EXT_texture_filter_anisotropic");
  const ANISO_MAX = ANISO ? gl.getParameter(ANISO.MAX_TEXTURE_MAX_ANISOTROPY_EXT) : 0;
  const [SH_NEUTRAL, SH_DIR] = scene.palette.neutral;
  if (hasUnit) {
    tex2D(gl, 6, gl.R8, scene.units.atlas.w, scene.units.atlas.h,
          gl.RED, gl.UNSIGNED_BYTE, unitAtlas);
    unitRGBTex = rgbaTex(10, unitRGB, scene.units.atlas.w, scene.units.atlas.h);
    if (unitRGB && unitPad >= 4) {
      // levels 0..log2(pad) are bleed-free by construction; never go deeper
      gl.generateMipmap(gl.TEXTURE_2D);
      gl.texParameterf(gl.TEXTURE_2D, gl.TEXTURE_MAX_LOD, Math.log2(unitPad));
    }
    ({ vao: uVAO, vbo: uVBO } = TR.unitArray(gl));
    if (wantUnitClassic)
      cu = TR.classicUnits(gl, unitVS, unitFS, scene.units, unitAtlas, palBuf, shdBuf,
                           scene.palette.shdRows, SH_NEUTRAL);
    if (wantLab) {
      luProg = program(gl, LAB_UNIT_VS, LAB_UNIT_FS, "lab-unit");
      LUU = uniforms(gl, luProg, ["uGame", "uDepthScale", "uAtlas", "uRGB",
                                  "uPal", "uUndither", "uSun", "uAmb", "uNorm",
                                  "uZoom", "uZoomC", ...SHADOW_U]);
    }
    uVerts = new Float32Array(65536 * UVST);
  }

  // ---- ORDER MARKERS (header). The queues: the scenario's `orders` on each
  // unit, or `orders=` when the URL carries one, which replaces them all. A
  // node keeps the order's world target, or the handle of a unit or feature
  // it names, and its issue time in 30 Hz ticks.
  const OS = scene.orders;
  const gndAt = (wx, wz) => {
    const col = Math.min(map.w16 - 1, Math.max(0, wx >> 4));
    const row = Math.min(map.h16 - 1, Math.max(0, wz >> 4));
    return heightBuf[row * map.w16 + col];
  };
  const instList = (scene.units && scene.units.instances) || [];
  const instName = (inst, i) => inst.id || `#${i}`;
  const byName = new Map(instList.map((inst, i) => [instName(inst, i), inst]));
  // the hot point emitUnits draws a unit about: on the terrain, or `agl` above
  const instXYZ = (inst) => {
    const g = gndAt(inst.pos[0], inst.pos[1]);
    const agl = Math.max(0, inst.alt !== undefined ? inst.alt - g : (inst.agl || 0));
    return [inst.pos[0], g + agl, inst.pos[1]];
  };
  let ordQueues = [];               // [{ unit: name, nodes: [{cmd, to|target, issue}] }]
  let ordActive = Q.get("ordunit");
  const parseOrders = (s) => s.split("|").filter(Boolean).map((u) => {
    const [unit, list = ""] = u.split(":");
    return { unit, nodes: list.split(";").filter(Boolean).map((n) => {
      const m = /^([a-z]+)(?:@(-?\d+),(-?\d+)|#(.+))$/.exec(n);
      if (!m) fail(`orders: cannot read "${n}" — want cmd@x,z or cmd#handle`);
      return m[4] ? { cmd: m[1], target: m[4], issue: 0 }
                  : { cmd: m[1], to: [+m[2], +m[3]], issue: 0 };
    }) };
  });
  const ordersQuery = () => ordQueues.filter((q) => q.nodes.length).map((q) =>
    `${q.unit}:` + q.nodes.map((n) => n.target ? `${n.cmd}#${n.target}`
                                               : `${n.cmd}@${n.to[0]},${n.to[1]}`).join(";"))
    .join("|");
  if (Q.get("orders") !== null) ordQueues = parseOrders(Q.get("orders"));
  else instList.forEach((inst, i) => {
    if (inst.orders && inst.orders.length)
      ordQueues.push({ unit: instName(inst, i),
                       nodes: inst.orders.map((o) => ({ ...o, issue: 0 })) });
  });
  for (const q of ordQueues) {
    if (!byName.has(q.unit)) fail(`orders: no unit "${q.unit}" in this pack`);
    for (const n of q.nodes)
      if (!(n.cmd in ORDER_TYPES))
        fail(`orders: no order "${n.cmd}" — have ${Object.keys(ORDER_TYPES).join(", ")}`);
  }
  if (ordActive === null || !byName.has(ordActive))
    ordActive = ordQueues.length ? ordQueues[0].unit
              : instList.length ? instName(instList[0], 0) : null;
  let ordCmd = "move";              // what a shift-click queues
  // a node's target in world units (x, altitude, z): a ground point at the
  // terrain's height there, or where the named unit or feature stands
  const nodeXYZ = (n) => {
    if (n.target !== undefined) {
      const inst = byName.get(n.target);
      return inst ? instXYZ(inst) : null;
    }
    if (!Array.isArray(n.to)) return null;
    return [n.to[0], gndAt(n.to[0], n.to[1]), n.to[1]];
  };

  let ordProg = null, ORDU = {}, ordVAO = null, ordVBO = null;
  let ordVerts = new Float32Array(9 * 6 * 4096);
  const ordInk = {};                // sequence name -> [r, g, b] 0..1
  if (OS) {
    const ab = await fetchBin(OS.atlas.file);
    const rects = [];
    for (const s of Object.values(OS.seqs))
      for (const f of s.frames) rects.push({ x: f.x, y: f.y, w: f.w, h: f.h, key: f.ck });
    tex2D(gl, 15, gl.RGBA8, OS.atlas.w, OS.atlas.h, gl.RGBA, gl.UNSIGNED_BYTE,
          baseAtlas(ab, OS.atlas.w, OS.atlas.h, rects, 0), gl.LINEAR);
    gl.activeTexture(gl.TEXTURE0);
    // THE INK tagpu_order.c's procedural markers take from the art they
    // replace (seq_ink): of frame 0's indices holding at least a twentieth of
    // its opaque texels, the brightest by 2R + 5G + B
    for (const [name, s] of Object.entries(OS.seqs)) {
      const f = s.frames[0], hist = new Map();
      let n = 0;
      for (let y = 0; y < f.h; y++)
        for (let x = 0; x < f.w; x++) {
          const v = ab[(f.y + y) * OS.atlas.w + f.x + x];
          if (v === f.ck) continue;
          hist.set(v, (hist.get(v) || 0) + 1); n++;
        }
      let best = -1, lum = -1;
      for (const [v, c] of hist) {
        if (c < Math.max(1, Math.floor(n / 20))) continue;
        const l = 2 * palBuf[v * 4] + 5 * palBuf[v * 4 + 1] + palBuf[v * 4 + 2];
        if (l > lum) { lum = l; best = v; }
      }
      ordInk[name] = best < 0 ? [1, 1, 1]
                   : [palBuf[best * 4] / 255, palBuf[best * 4 + 1] / 255, palBuf[best * 4 + 2] / 255];
    }
    ordProg = program(gl, ORD_VS, ORD_FS, "orders");
    ORDU = uniforms(gl, ordProg, ["uCanvas", "uOrd", "uFilter"]);
    ordVAO = gl.createVertexArray(); ordVBO = gl.createBuffer();
    gl.bindVertexArray(ordVAO);
    gl.bindBuffer(gl.ARRAY_BUFFER, ordVBO);
    const sizes = [2, 2, 2, 3], offs = [0, 8, 16, 24];
    for (let i = 0; i < 4; i++) {
      gl.enableVertexAttribArray(i);
      gl.vertexAttribPointer(i, sizes[i], gl.FLOAT, false, 9 * 4, offs[i]);
    }
    gl.bindVertexArray(null);
  }

  // THE GAME CLOCK the markers animate on: 30 ticks a second, the engine's
  // gameTime at normal speed. A shot is a measurement, so it reads ordtime=
  // (default 0) instead of the wall clock.
  const ORD_T0 = performance.now();
  const ordClock = () => SHOT ? parseFloat(Q.get("ordtime") || "0")
                              : (performance.now() - ORD_T0) * 0.03;

  // One side's markers as canvas-px vertices, by the engine's walk (0x439B30,
  // ui-markers.md §3.2): `pos` starts at the unit and every drawer that runs
  // moves it to its node's target, so the dots run unit -> wp1 -> wp2 …
  function orderVerts(L, tReal) {
    const o = L.ord;
    let n = 0;
    const push = (x, y, u, v, m, a, c) => {
      if (n + 9 > ordVerts.length) {
        const g = new Float32Array(ordVerts.length * 2); g.set(ordVerts); ordVerts = g;
      }
      ordVerts.set([x, y, u, v, m, a, c[0], c[1], c[2]], n); n += 9;
    };
    const quad = (x0, y0, x1, y1, u0, v0, u1, v1, m, a, c) => {
      push(x0, y0, u0, v0, m, a, c); push(x1, y0, u1, v0, m, a, c); push(x0, y1, u0, v1, m, a, c);
      push(x1, y0, u1, v0, m, a, c); push(x1, y1, u1, v1, m, a, c); push(x0, y1, u0, v1, m, a, c);
    };
    const NOC = [0, 0, 0];
    // the zoomed frame's projection: tagpu's (wx - eyeX + 128, wz - alt/2 -
    // eyeY + 32) about the viewport corner, which is what every pass here does
    const proj = (p) => [vpL + (p[0] - E[0]) * zoom, vpT + (p[2] - p[1] / 2 - E[1]) * zoom];
    // texels -> canvas px
    const scale = o.size === "world" ? zoom : o.size === "screen" ? 1
                : o.size === "int" ? Math.max(1, Math.round(zoom))
                : Math.min(o.max, Math.max(o.min, zoom));
    const t = o.tick === "int" ? Math.floor(tReal) : tReal;
    const frameOf = (s) => {
      const fr = s.frames, nf = fr.length;
      if (o.anim === "engine") {
        // 0x439740: (gameTime / (2 * period)) % count, the period being frame 0's ticks
        return Math.floor(t / (2 * Math.max(1, fr[0].d))) % nf;
      }
      // the mouse cursor's own rule (0x4B8BF0): each frame for its own ticks
      const total = fr.reduce((a, f) => a + Math.max(1, f.d), 0);
      let k = t % total;
      for (let i = 0; i < nf; i++) { k -= Math.max(1, fr[i].d); if (k < 0) return i; }
      return nf - 1;
    };
    const blit = (f, hx, hy, a) => {
      let x0 = hx - f.hx * scale, y0 = hy - f.hy * scale;
      if (o.filter === "nearest") { x0 = Math.round(x0); y0 = Math.round(y0); }
      quad(x0, y0, x0 + f.w * scale, y0 + f.h * scale, f.x, f.y, f.x + f.w, f.y + f.h, 0, a, NOC);
    };
    const sprite = (name, P) => {
      const s = OS.seqs[name];
      if (!s) return;
      const [hx, hy] = proj(P);
      const k = frameOf(s);
      if (o.style === "gaf") { blit(s.frames[k], hx, hy, o.alpha); return; }
      // tagpu_order.c draw_sprite: a crosshair breathing on the same frame
      // index, opaque, in the sequence's ink, one pixel wide
      const a = s.frames.length > 1 ? k / (s.frames.length - 1) : 0;
      const out = 4 + 5 * a, inn = 1.5 + 2 * a, c = ordInk[name];
      const cx = Math.floor(hx) + 0.5, cy = Math.floor(hy) + 0.5;
      quad(cx - out, cy - 0.5, cx - inn, cy + 0.5, 0, 0, 0, 0, 2, 1, c);
      quad(cx + inn, cy - 0.5, cx + out, cy + 0.5, 0, 0, 0, 0, 2, 1, c);

    const gw = w16 + 1, gh = h16 + 1;
    ltNrm = new Float32Array(gw * gh * 3);
    for (let gr = 0; gr < gh; gr++)
      for (let gc = 0; gc < gw; gc++) normalAt(gc, gr, slope, ltNrm, (gr * gw + gc) * 3);

  }
  function buildTerrainLab(L) {
    const stride = map.tilemap.w, mrows = map.tilemap.h;
    const tx0 = div32trunc(E[0]), fx = E[0] - tx0 * 32;
    const ty0 = div32trunc(E[1]), fy = E[1] - ty0 * 32;
    // a cell rises by relief*(h-datum)/2 <= 128 px, so cells up to 4 more 32-px
    // rows BELOW the viewport can still reach into it. With a datum a cell
    // BELOW it also SINKS, by up to relief*datum/2, so rows ABOVE the viewport
    // now reach in too — which they could not before and is why this scan runs
    // from a negative row. (rowBase() already leaves 16 rows of depth-key
    // headroom above the eye, so the keys of those rows stay positive.)
    const cols = ceil32(W[0] + fx) + 1;
    const rows = ceil32(W[1] + fy) + (L.relief > 0 ? 5 : 1);
    const rAbove = L.relief > 0 && L.datum > 0
                 ? Math.ceil(L.relief * L.datum * 0.5 / 32) + 1 : 0;
    // the view's tiles, half-open, clipped to the map
    const x0 = Math.max(0, tx0), x1 = Math.min(areaC, tx0 + cols);
    const y0 = Math.max(0, ty0 - rAbove), y1 = Math.min(areaR, ty0 + rows);
    const D = scene.depth;
    // Per-row keys only when relief can lift a southern cell over a northern
    // unit. With relief=0 nothing rises, and per-row keys would put the ground
    // of every row south of a unit's anchor IN FRONT of the unit's parts that
    // reach into those rows — the kbot lab lost its whole south wall to the
    // grass (found by the shadow the roof cast on that grass). Flat, the
    // terrain is parity's one band behind everything.
    gl.useProgram(ltProg);
    gl.uniform2f(LTU.uShift, vpL - E[0], vpT - E[1]);
    gl.uniform4f(LTU.uKey, labD.terrain, rowBase(), (W[1] >> 4) + 40,
                 L.relief > 0 ? D.rowStep : 0);
    const lt = ltStore(L), knobs = `${L.relief} ${L.datum} ${L.slope}`;
    if (lt.knobs !== knobs) {
      for (const c of lt.chunks.values()) freeChunk(c);
      lt.chunks.clear(); lt.knobs = knobs;
    }
    lt.frame++;
    lt.draw = [];
    let n = 0;
    if (x1 > x0 && y1 > y0)
      for (let cy = Math.floor(y0 / LT_CHUNK); cy * LT_CHUNK < y1; cy++)
        for (let cx = Math.floor(x0 / LT_CHUNK); cx * LT_CHUNK < x1; cx++) {
          const id = cy * 65536 + cx;
          let c = lt.chunks.get(id);
          if (!c) lt.chunks.set(id, (c = emitChunk(L, cx, cy)));
          c.used = lt.frame;
          if (c.n) { lt.draw.push(c); n += c.n; }
        }
    // least recently drawn first; never one this frame draws
    if (lt.chunks.size > LT_KEEP) {
      const old = [...lt.chunks].filter(([, c]) => c.used !== lt.frame)
                                .sort((a, b) => a[1].used - b[1].used);
      for (const [id, c] of old.slice(0, lt.chunks.size - LT_KEEP)) {
        freeChunk(c); lt.chunks.delete(id);
      }
    }
    let cells = 0, junk = 0;
    for (let my = y0; my < y1; my++)
      for (let mx = x0; mx < x1; mx++)
        if (tilemap[my * stride + mx] >= map.atlas.tiles) junk++; else cells++;

                skipped: cols * (rows + rAbove) - cells - junk, junk };
