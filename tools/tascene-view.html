  }
  function drawTerrainLab(L) {
    for (const c of L.lt.draw) {
      gl.bindVertexArray(c.vao);
      gl.drawElements(gl.TRIANGLES, c.n, gl.UNSIGNED_SHORT, 0);
    }
    gl.bindVertexArray(null);
  }
  function freeChunk(c) {
    gl.deleteVertexArray(c.vao); gl.deleteBuffer(c.vbo); gl.deleteBuffer(c.ibo);
  }
  function emitChunk(L, cx, cy) {
    const stride = map.tilemap.w, mrows = map.tilemap.h;
    const x0 = cx * LT_CHUNK, x1 = Math.min(areaC, x0 + LT_CHUNK);
    const y0 = cy * LT_CHUNK, y1 = Math.min(areaR, y0 + LT_CHUNK);
    const vb = new Float32Array((x1 - x0) * (y1 - y0) * 9 * LTVST);
    const ib = new Uint16Array((x1 - x0) * (y1 - y0) * 24);
    const iw = 1 / map.atlas.w, ih = 1 / map.atlas.h;
    const k = L.relief * 0.5, dat = L.datum;
    const N = gridNormals(L.slope), gw = w16 + 1;
    let nv = 0, ni = 0;
    for (let my = y0; my < y1; my++) {
      for (let mx = x0; mx < x1; mx++) {
        const idx = tilemap[my * stride + mx];
        if (idx >= map.atlas.tiles) continue;
        const cxa = idx % map.atlas.cols, cya = (idx / map.atlas.cols) | 0;
        const tu = cxa * PITCH + BORDER, tv = cya * PITCH + BORDER;
        const base = nv;
        // the tile's 3 x 3 grid points: the OUTER ones land on the guard; the
        // middle row and column are inside the same tile, so they need none
        for (let j = 0; j < 3; j++) {
          for (let i = 0; i < 3; i++) {
            const gc = mx * 2 + i, gr = my * 2 + j;
            const o = nv * LTVST, q = (gr * gw + gc) * 3;
            const h = H(gc, gr);
            vb[o]     = gc * 16;
            vb[o + 1] = gr * 16 - k * (h - dat);
            vb[o + 2] = gr;
            vb[o + 3] = (tu + i * 16) * iw;
            vb[o + 4] = (tv + j * 16) * ih;
            vb[o + 5] = N[q]; vb[o + 6] = N[q + 1]; vb[o + 7] = N[q + 2];
            // The world point this vertex DEPICTS, not where it is drawn: the
            // art at grid row G shows the ground the engine projects there,
            // and the engine projects world Z at screen Z - Y/2, so the
            // depicted point is Z = G + h/2 (less whatever relief already
            // moved the vertex). A unit standing at wz is drawn at wz - wy/2,
            // i.e. on the art of grid row wz - wy/2, which depicts Z = wz: its
            // shadow lands at its feet.
            vb[o + 8] = gc * 16;
            vb[o + 9] = h;
            vb[o + 10] = gr * 16 + h * 0.5 - k * (h - dat);
            nv++;
          }
        }
        // the four quads, each on the diagonal (1,0)-(0,1)
        for (let sy = 0; sy < 2; sy++)
          for (let sx = 0; sx < 2; sx++) {
            const a = base + sy * 3 + sx;
            ib[ni++] = a; ib[ni++] = a + 1; ib[ni++] = a + 3;
            ib[ni++] = a + 1; ib[ni++] = a + 4; ib[ni++] = a + 3;
          }

    gl.bindVertexArray(vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    gl.bufferData(gl.ARRAY_BUFFER, vb.subarray(0, nv * LTVST), gl.STATIC_DRAW);
    // the world point at location 7, where SHADOW_VS reads it in every VAO
    const sizes = [3, 2, 3, 3], offs = [0, 12, 20, 32], locs = [0, 1, 2, 7];
    for (let i = 0; i < 4; i++) {
      gl.enableVertexAttribArray(locs[i]);
      gl.vertexAttribPointer(locs[i], sizes[i], gl.FLOAT, false, LTVST * 4, offs[i]);
    }
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, ib.subarray(0, ni), gl.STATIC_DRAW);
    gl.bindVertexArray(null);
    return { vao, vbo, ibo, n: ni, used: 0 };
  }

  // The mirror: the parity grid's own sweep over the zoomed window, keeping
  // only the cells OFF the map. Each reflects across every edge it is past — a
  // triangle wave, so a view wider than the map still lands on real tiles, and
  // a cell two maps out is the map again the right way round.
  let edgeVerts = new Float32Array(1);
  const reflect = (m, n) => {
    const p = ((m % (2 * n)) + 2 * n) % (2 * n);
    return p < n ? [p, false] : [2 * n - 1 - p, true];
  };
  function buildEdge() {
    const stride = map.tilemap.w, mrows = map.tilemap.h;
    // a FLOOR, not the engine's toward-zero division: the window here starts
    // past the map's top or left edge, and toward zero would start the sweep a
    // cell late and leave up to 31 px of the view's leading edge undrawn
    const tx0 = Math.floor(E[0] / 32), fx = E[0] - tx0 * 32;
    const ty0 = Math.floor(E[1] / 32), fy = E[1] - ty0 * 32;
    const cols = ceil32(W[0] + fx), rows = ceil32(W[1] + fy);
    const need = cols * rows * 6 * TVST;
    if (edgeVerts.length < need) edgeVerts = new Float32Array(need);
    const iw = 1 / map.atlas.w, ih = 1 / map.atlas.h;
    let n = 0;
    const put = (x, y, u, v, wx, wz) => {
      const o = n * TVST;
      edgeVerts[o] = x; edgeVerts[o + 1] = y; edgeVerts[o + 2] = u;
      edgeVerts[o + 3] = v; edgeVerts[o + 4] = wx; edgeVerts[o + 5] = wz; n++;
    };
    for (let r = 0; r < rows; r++) {
      const my = ty0 + r, [sy, flipY] = reflect(my, areaR);
      for (let c = 0; c < cols; c++) {
        const mx = tx0 + c;
        if (mx >= 0 && mx < areaC && my >= 0 && my < areaR) continue;
        const [sx, flipX] = reflect(mx, areaC);
        const idx = tilemap[sy * stride + sx];
        if (idx >= map.atlas.tiles) continue;
        const cx = idx % map.atlas.cols, cy = (idx / map.atlas.cols) | 0;
        const tu = cx * PITCH + BORDER, tv = cy * PITCH + BORDER;
        // swapping a quad's two u (or v) flips its texels exactly: a pixel
        // centre at i + 0.5 samples texel 31 - i, never the guard column
        let u0 = tu * iw, u1 = (tu + TILE_PX) * iw;
        let v0 = tv * ih, v1 = (tv + TILE_PX) * ih;
        if (flipX) [u0, u1] = [u1, u0];
        if (flipY) [v0, v1] = [v1, v0];
        const x0 = vpL + c * 32 - fx, y0 = vpT + r * 32 - fy;
        const wx0 = mx * 32, wz0 = my * 32;
        put(x0,      y0,      u0, v0, wx0,      wz0);
        put(x0 + 32, y0,      u1, v0, wx0 + 32, wz0);
        put(x0,      y0 + 32, u0, v1, wx0,      wz0 + 32);
        put(x0 + 32, y0,      u1, v0, wx0 + 32, wz0);
        put(x0 + 32, y0 + 32, u1, v1, wx0 + 32, wz0 + 32);
        put(x0,      y0 + 32, u0, v1, wx0,      wz0 + 32);
      }
    }
    gl.bindBuffer(gl.ARRAY_BUFFER, edgeVBO);
    gl.bufferData(gl.ARRAY_BUFFER, edgeVerts.subarray(0, n * TVST), gl.DYNAMIC_DRAW);
    return n;
  }
  // Drawn first, under everything, with no depth: off the map there is nothing
  // for it to sort against, and relief rising over the top edge covers it.
  function drawEdge(L) {
    const n = buildEdge();
    L.stats.mirror = n / 6;
    if (!n) return;
    gl.useProgram(edgeProg);
    gl.uniform2f(EU.uGame, GW, GH);
    gl.uniform1f(EU.uZoom, zoom); gl.uniform2f(EU.uZoomC, ZOOM_C[0], ZOOM_C[1]);
    gl.uniform1i(EU.uAtlas, 0); gl.uniform1i(EU.uRGB, 8);
    gl.uniform1i(EU.uUndither, L.undither ? 1 : 0);
    edgeTone(EU, L);
    gl.disable(gl.DEPTH_TEST); gl.depthMask(false);
    gl.bindVertexArray(edgeVAO);
    gl.drawArrays(gl.TRIANGLES, 0, n);
    gl.bindVertexArray(null);
    gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
  }

  // tagpu_feat.c's gather (tascene-render.js gatherFeatures): the engine's own
  // sweep rect, projection and depth keys; under the mirror the sweep runs past
  // the map as well, so the mirrored features take their depth keys from the
  // SAME base and formula as the map's own and sort against them.
  function buildFeatures(L) {
    const lab = L.lane === "explore";
    const VST = lab ? LSVST : SVST;
    const mirror = L.edge === "mirror";
    L.edgeFeat = null;
    const got = TR.gatherFeatures({
      lab, mirror, r0: rowBase(), E, W, vpL, vpT, w16, h16, heights: heightBuf,
      area: [areaC, areaR],
      anchors, mapAnchors, defs: scene.features.defs, atlas: scene.features.atlas,
      D: scene.depth, labD, lambertAt: (col, row) => lambertAt(col, row, L) });
    if (!got) return [0, 0];
    const { shadow, body, mshadow, mbody } = got;
    const all = shadow.concat(body);
    if (all.length > sprVerts.length) sprVerts = new Float32Array(all.length);
    sprVerts.set(all);
    gl.bindBuffer(gl.ARRAY_BUFFER, sprVBO);
    gl.bufferData(gl.ARRAY_BUFFER, sprVerts.subarray(0, all.length), gl.DYNAMIC_DRAW);
    L.stats.feat = (shadow.length + body.length) / 6 / VST;
    if (mirror) {
      const mall = mshadow.concat(mbody);
      if (mall.length > esVerts.length) esVerts = new Float32Array(mall.length);
      esVerts.set(mall);
      gl.bindBuffer(gl.ARRAY_BUFFER, esVBO);
      gl.bufferData(gl.ARRAY_BUFFER, esVerts.subarray(0, mall.length), gl.DYNAMIC_DRAW);

  // The mirrored features: after the map's own, depth-tested against them with
  // the keys buildFeatures gave both; shadows first with no depth writes, as
  // drawSprites does, then the bodies.
  function drawEdgeSprites(L) {
    const [ns, nb] = L.edgeFeat;
    if (!ns && !nb) return;
    gl.useProgram(esProg);
    gl.uniform2f(ESU.uGame, GW, GH);
    gl.uniform1f(ESU.uZoom, zoom); gl.uniform2f(ESU.uZoomC, ZOOM_C[0], ZOOM_C[1]);
    gl.uniform1f(ESU.uDepthScale, scene.depth.scale);
    gl.uniform1i(ESU.uAtlas, 5); gl.uniform1i(ESU.uRGB, 9);
    gl.uniform1i(ESU.uUndither, L.undither ? 1 : 0);
    edgeTone(ESU, L);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);   // the shader premultiplies
    gl.bindVertexArray(esVAO);
    if (ns) { gl.depthMask(false); gl.drawArrays(gl.TRIANGLES, 0, ns); }
    if (nb) { gl.depthMask(true);  gl.drawArrays(gl.TRIANGLES, ns, nb); }
    gl.bindVertexArray(null);
    gl.disable(gl.BLEND);
  }

  function drawSprites(L, nShadow, nBody, bodyBase) {
    const lab = L.lane === "explore";
    if (lab) {
      gl.useProgram(lsProg);
      gl.uniform2f(LSU.uGame, GW, GH);
      gl.uniform1f(LSU.uDepthScale, scene.depth.scale);
      gl.uniform1i(LSU.uAtlas, 5); gl.uniform1i(LSU.uRGB, 9);
      gl.uniform1i(LSU.uPal, 1); gl.uniform1i(LSU.uUndither, L.undither ? 1 : 0);
      gl.uniform1f(LSU.uZoom, zoom); gl.uniform2f(LSU.uZoomC, ZOOM_C[0], ZOOM_C[1]);
    } else {
      // the engine's area, and the clip to the map's columns under the mirror,
      // as tagpu_feat.c publishes them (s_pub.mapPxW/H, s_clip)
      spr.use({ ...frameNow(), mapPx: [areaC * 32, areaR * 32], clip: L.edge === "mirror" });
      spr.draw(nShadow, nBody, bodyBase);
      return;
    }
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);   // the shader premultiplies
    gl.bindVertexArray(lsVAO);
    if (nShadow) { gl.depthMask(false); gl.drawArrays(gl.TRIANGLES, 0, nShadow); }
    if (nBody)   { gl.depthMask(true);  gl.drawArrays(gl.TRIANGLES, bodyBase, nBody); }
    gl.bindVertexArray(null);
    gl.disable(gl.BLEND);
  }

  // Every unit instance, yawed, projected, shaded per face and keyed in depth
  // (tascene-render.js emitUnits); the lab lane's slot 3 stays 1.0 and slot 6
  // carries the posed face normal it lights by.
  function buildUnits(L) {
    const { n, nSlant } = TR.emitUnits({
      instances: scene.units.instances, meshData, slantData, meshTop, out: uVerts,
      D: scene.depth, r0: rowBase(), E, W, vpL, vpT, w16, h16, heights: heightBuf,
      neutral: SH_NEUTRAL, dir: SH_DIR }, L);
    gl.bindBuffer(gl.ARRAY_BUFFER, uVBO);
    gl.bufferData(gl.ARRAY_BUFFER, uVerts.subarray(0, n * UVST), gl.DYNAMIC_DRAW);
    L.stats.units = (n - nSlant) / 3;
    return n;
  }

  function drawUnits(L, n) {
    if (!n) return;
    const lab = L.lane === "explore";
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.bindVertexArray(uVAO);

    // shadows first, as the engine emits them inside each unit's own draw.
    // Classic draws every unit's; Classic++ only borrows one for an aircraft,
    // and only under `airshadow=drop` — everything else it has is cast.
    if (L.unitShadows && (!lab || L.airshadow === "drop")) {
      cu.use(frameNow());
      cu.silhouettes(L.unitRanges, lab ? (r) => r.air : () => true);
    }

    if (lab) {
      gl.useProgram(luProg);
      gl.uniform2f(LUU.uGame, GW, GH);
      gl.uniform1f(LUU.uDepthScale, scene.depth.scale);
      gl.uniform1i(LUU.uAtlas, 6); gl.uniform1i(LUU.uRGB, 10);
      gl.uniform1i(LUU.uPal, 1); gl.uniform1i(LUU.uUndither, L.undither ? 1 : 0);
      gl.uniform3f(LUU.uSun, L.unitSun[0], L.unitSun[1], L.unitSun[2]);
      gl.uniform1f(LUU.uAmb, L.amb); gl.uniform1f(LUU.uNorm, L.unitNorm);
      gl.uniform1f(LUU.uZoom, zoom); gl.uniform2f(LUU.uZoomC, ZOOM_C[0], ZOOM_C[1]);
      setShadowUniforms(LUU, L, L.shadowFrame);
      // the sampler state is per side, because the two sides of a wipe may
      // sample the one restored atlas differently
      const lin = L.filter === "linear";
      gl.activeTexture(gl.TEXTURE10); gl.bindTexture(gl.TEXTURE_2D, unitRGBTex);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER,
                       lin ? gl.LINEAR_MIPMAP_LINEAR : gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, lin ? gl.LINEAR : gl.NEAREST);
      if (ANISO) gl.texParameterf(gl.TEXTURE_2D, ANISO.TEXTURE_MAX_ANISOTROPY_EXT,
                                  lin ? Math.min(L.aniso, ANISO_MAX) : 1);
    } else if (!L.unitShadows) {
      cu.use(frameNow());
    }

    gl.depthMask(true);
    // the bodies, range by range: a structure's slant casters sit in the
    // same buffer after its body and are the shadow pass's alone
    for (const r of L.unitRanges)
      if (r.count) gl.drawArrays(gl.TRIANGLES, r.first, r.count);
    gl.bindVertexArray(null);
    gl.disable(gl.BLEND);
  }

  function drawSide(L, target) {
    const nterr = L.lane === "explore" ? buildTerrainLab(L) : buildTerrain(L);
    // units are built before the depth pass needs them and drawn after it
    const nu = hasUnit && L.units ? buildUnits(L) : 0;
    L.shadowFrame = L.lane === "explore" && L.shadows && shProg
                  ? shadowPass(L, nterr, nu) : null;
    gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
    gl.viewport(0, 0, FW, FH);
    gl.disable(gl.SCISSOR_TEST);
    gl.clearColor(0, 0, 0, 1);
    gl.clearDepth(1.0);
    gl.clearStencil(0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT | gl.STENCIL_BUFFER_BIT);
    // The play area is the engine's viewport rect; the HUD around it is not
    // ours to draw. FBO y == game py here, so the scissor needs no flip.
    gl.enable(gl.SCISSOR_TEST);
    gl.scissor(vpL * SS, vpT * SS, vw * SS, vh * SS);
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LESS);
    gl.depthMask(true);
    gl.disable(gl.BLEND);

    L.stats.mirror = undefined;
    if (L.terrain && L.edge === "mirror") drawEdge(L);
    if (L.terrain) {
      if (L.lane === "explore") {
        gl.useProgram(ltProg);
        gl.uniform2f(LTU.uGame, GW, GH);
        gl.uniform1f(LTU.uDepthScale, scene.depth.scale);
        gl.uniform1i(LTU.uAtlas, 0); gl.uniform1i(LTU.uRGB, 8);
        gl.uniform1i(LTU.uPal, 1);
        gl.uniform1i(LTU.uUndither, L.undither ? 1 : 0);
        gl.uniform3f(LTU.uSun, L.sun[0], L.sun[1], L.sun[2]);
        gl.uniform1f(LTU.uAmb, L.amb);
        gl.uniform1f(LTU.uNorm, L.norm);
        gl.uniform1f(LTU.uZoom, zoom); gl.uniform2f(LTU.uZoomC, ZOOM_C[0], ZOOM_C[1]);
        gl.uniform1i(LTU.uHeight, 14);
        gl.uniform2f(LTU.uHDim, map.w16, map.h16);
        gl.uniform1i(LTU.uCastSplit, L.castsplit ? 1 : 0);
        setShadowUniforms(LTU, L, L.shadowFrame);
        drawTerrainLab(L);
      } else {
        terr.draw(frameNow(), nterr);
      }
    }

    if (hasFeat && L.features) {
      const [ns, nb] = buildFeatures(L);
      drawSprites(L, L.feat === "body" ? 0 : ns, L.feat === "shadow" ? 0 : nb, ns);
      if (L.edgeFeat) drawEdgeSprites(L);
    }
    if (nu) drawUnits(L, nu);
  }

  function draw() {
    zoomView();
    for (let i = 0; i < sides.length; i++) drawSide(sides[i], targets[i]);
    if (dbgProg) {                        // side A's depth map, as it was left
      if (sides.length > 1) shadowPass(sides[0], buildTerrainLab(sides[0]), buildUnits(sides[0]));
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.disable(gl.SCISSOR_TEST); gl.disable(gl.DEPTH_TEST);
      gl.viewport(0, 0, GW, GH);
      gl.useProgram(dbgProg); gl.uniform1i(DBU.uShadowRaw, 13);
      gl.bindVertexArray(blitVAO); gl.drawArrays(gl.TRIANGLES, 0, 3);
      gl.bindVertexArray(null);
      if (!SHOT) report();
      return;
    }
    present();
    if (!SHOT) report();
  }

  // the composite and the order markers over it: all an animation tick
  // redraws, since the world under the markers has not moved
  function present() {
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.disable(gl.SCISSOR_TEST);
    gl.disable(gl.DEPTH_TEST);
    gl.viewport(0, 0, GW, GH);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(blitProg);
    gl.activeTexture(gl.TEXTURE4);
    gl.bindTexture(gl.TEXTURE_2D, targets[0].colour);
    gl.activeTexture(gl.TEXTURE11);
    gl.bindTexture(gl.TEXTURE_2D, (targets[1] || targets[0]).colour);
    gl.uniform1i(BU.uA, 4); gl.uniform1i(BU.uB, 11);
    gl.uniform1f(BU.uWipe, wipe); gl.uniform1f(BU.uWidth, GW); gl.uniform1i(BU.uSS, SS);
    gl.bindVertexArray(blitVAO);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindVertexArray(null);
    drawOrders();
  }

  // The edge, live. It is per look, so the toggle sets it on every side.
  function edgeRow() {
    const edge = sides.every((L) => L.edge === "mirror") ? "mirror"
               : sides.every((L) => L.edge === "black") ? "black" : "";
    const knob = (v) =>
      `<button data-edge="${v}" class="${edge === v ? "on" : ""}">${v}</button>`;
    return `<div class="row modes"><span>edge</span>${knob("black")}${knob("mirror")}</div>`;
  }

  // The order overlay's knobs, live, on every side at once like the edge; a
  // button is lit only when every side agrees. The second row is the queue a
  // shift-click edits.
  function orderRows() {
    if (!OS) return [];
    const knobs = Object.entries(ORD_KNOBS).map(([k, vals]) => {
      const cur = sides.every((L) => L.ord[k] === sides[0].ord[k]) ? sides[0].ord[k] : "";
      return `<span>${k}</span>` + vals.map((v) =>
        `<button data-ord="${k}:${v}" class="${cur === v ? "on" : ""}">${v}</button>`).join("");
    }).join("");
    const o = sides[0].ord;
    const cmds = Object.keys(ORDER_TYPES).filter((c) => ORDER_TYPES[c][0]).map((c) =>
      `<button data-ordcmd="${c}" class="${ordCmd === c ? "on" : ""}">${c}</button>`).join("");
    const nq = ordQueues.reduce((a, q) => a + q.nodes.length, 0);
    return [
      `<div class="row modes"><span>orders</span>${knobs}` +
      `<span>alpha</span><b>${o.alpha}</b>` +
      (o.size === "clamp" ? `<span>scale</span><b>${o.min}..${o.max}</b>` : "") + `</div>`,
      `<div class="row modes"><span>queue</span><b>${ordActive ?? "no unit"}</b>` +
      `<span>${nq} orders</span>${cmds}` +
      `<button data-ordedit="undo">undo</button><button data-ordedit="clear">clear</button>` +
      `<span>shift-click queues · ctrl-click picks the unit</span></div>`];
  }

  function report() {
    const s0 = sides[0].stats, on = new Set(sides.map((L) => L.lane));
    const rows = [
      `<div class="row modes"><span>renderers</span>` +
      `<button data-mode="parity" class="${on.has("parity") ? "on" : ""}">Classic</button>` +
      `<button data-mode="explore" class="${on.has("explore") ? "on" : ""}">Classic++</button>` +
      `</div>`,
      edgeRow(),
      ...orderRows(),
      `<div class="row"><b>${map.name}</b> <span>${map.w16}x${map.h16} cells</span>` +
      `<span>eye</span><b>${eye[0]},${eye[1]}</b>` +
      `<span>grid</span><b>${s0.cols}x${s0.rows}</b>` +
      `<span>frac</span><b>${s0.fx},${s0.fy}</b>` +
      (sides.length > 1 ? `<span>wipe</span><b>${wipe.toFixed(2)}</b>` : "") +
      `<span>zoom</span><b>${zoom === 1 ? "1" : zoom.toFixed(3).replace(/0+$/, "")}</b>` +
      `<span>ss</span><b>${SS}</b><span>aniso</span><b>${ANISO_MAX || "none"}</b>` +
      `<span>device</span><b>${cv.dataset.device}</b>` +
      `</div>`];
    for (let i = 0; i < sides.length; i++) {
      const L = sides[i], st = L.stats;
      rows.push(
        `<div class="row">` +
        (sides.length > 1 ? `<span class="tag ${i ? "b" : "a"}">${L.label}</span>` : "") +
        `<b>${L.name}</b>` +
        (L.preset ? `<span>preset</span><b>${L.preset}</b>` : "") +
        (L.lane === "explore"
          ? `<span>relief</span><b>${L.relief}</b>` +
            (L.relief > 0 ? `<span>datum</span><b>${L.datum}</b>` : "") +
            `<span>sun</span><b>${L.sunAE ? L.sunAE.join(",") : "off"}</b>` +
            (L.sunAE ? `<span>unitsun</span><b>${L.unitSunAE.join(",")}</b>` +
                       `<span>shadowsun</span><b>${L.shadowSunAE.join(",")}</b>` : "") +
            `<span>amb</span><b>${L.amb.toFixed(2)}</b>` +
            `<span>slope</span><b>${L.slope}</b>` +
            `<span>colour</span><b>${L.undither ? "restored" : "indexed"}</b>` +
            `<span>filter</span><b>${L.filter}${L.filter === "linear" && L.aniso > 1
                ? ` ·${Math.min(L.aniso, ANISO_MAX || 1)}x` : ""}</b>` +
            `<span>shadows</span><b>${L.shadows
                ? `pen ${L.penumbra} shade ${L.shade}${L.terrainshadow ? " +hills" : ""}` +
                  (L.shadowlen ? ` len ${L.shadowlen[0]}+${L.shadowlen[1]}h` : " len physical") +
                  (L.shadowFrame ? ` map ${L.shadowFrame.res} texel ${L.shadowFrame.texel.toFixed(2)}` : "")
                : "off"}</b>`
          : "") +
        `<span>cells</span><b>${st.cells}</b>` +
        `<span>off-map</span><b>${st.skipped}</b>` +
        (st.mirror !== undefined ? `<span>mirrored</span><b>${st.mirror}` +
          (L.edgeFeat ? ` + ${st.mfeat} features` : "") + `</b>` : "") +
        (st.feat !== undefined ? `<span>features</span><b>${st.feat}</b>` : "") +
        (st.units !== undefined ? `<span>unit tris</span><b>${st.units}</b>` : "") +
        `</div>`);
    }
    bar.innerHTML = rows.join("");
  }

  // ---- interaction (serve only): pan the eye, which is what the engine
  // scrolls, and drag the wipe divider when the pointer is on it
  if (!SHOT) {
    // The renderer buttons rewrite the query and reload. A renderer already
    // on screen keeps its side's own parameters; a new one comes in at its
    // defaults; the live eye, ss, debug and the wipe position carry over.
    bar.addEventListener("click", (e) => {
      const ok = e.target.closest("button[data-ord]");
      if (ok) {
        const [k, v] = ok.dataset.ord.split(":");
        for (const L of sides) {
          L.ord[k] = v;
          const q = new URLSearchParams(L.query);
          if (v === ORD_KNOBS[k][0]) q.delete("ord" + k); else q.set("ord" + k, v);
          L.query = q.toString();
        }
        writeQuery("ord" + k, v === ORD_KNOBS[k][0] ? null : v);
        report(); present();
        return;
      }
      const oc = e.target.closest("button[data-ordcmd]");
      if (oc) { ordCmd = oc.dataset.ordcmd; report(); return; }
      const oe = e.target.closest("button[data-ordedit]");
      if (oe) {
        const q = ordQueues.find((x) => x.unit === ordActive);
        if (oe.dataset.ordedit === "clear") ordQueues = [];
        else if (q) q.nodes.pop();
        writeQuery("orders", ordersQuery());
        report(); present();
        return;
      }
      const set = e.target.closest("button[data-edge]");
      if (set) {
        const edge = set.dataset.edge;
        for (const L of sides) {
          L.edge = edge;
          const q = new URLSearchParams(L.query);
          if (edge === "black") q.delete("edge"); else q.set("edge", edge);
          L.query = q.toString();
        }
        writeEdgeQuery(edge);
        kick();
        return;
      }
      const btn = e.target.closest("button[data-mode]");
      if (!btn) return;
      const want = new Set(sides.map((L) => L.lane)), mode = btn.dataset.mode;
      if (want.has(mode)) { if (want.size === 1) return; want.delete(mode); }
      else want.add(mode);
      const own = (lane) => {
        const L = sides.find((s) => s.lane === lane);
        return L ? L.query : (lane === "parity" ? "lane=classic" : "lane=classicpp");
      };
      const q = new URLSearchParams();
      for (const k of ["ss", "debug"]) if (Q.get(k) !== null) q.set(k, Q.get(k));
      q.set("eye", `${eye[0]},${eye[1]}`);
      if (zoom !== 1) q.set("zoom", String(zoom));
      const modes = ["parity", "explore"].filter((m) => want.has(m));
      if (modes.length === 1) {
        for (const [k, v] of new URLSearchParams(own(modes[0]))) q.set(k, v);
      } else {
        q.set("a", own(modes[0])); q.set("b", own(modes[1]));
        q.set("wipe", (wipe > 1 ? 0.5 : wipe).toFixed(2));
      }
      location.search = "?" + q.toString();
    });
    // THE CAMERA (header, CAMERA). `cam` is the eye in floats — the game keeps
    // an integer eye and carries the remainder, which is the same thing — and
    // `eye` its rounding, which is all the builders ever see.
    const cam = eye.slice();
    const mapW = map.w16 * 16 - 32, mapH = map.h16 * 16 - 128;
    // The range the eye may take, [loX, hiX, loY, hiY]: the centre clamp
    // (tagpu_zoom.c camera_range) — the ground point at the screen centre is
    // clamped to the engine's scroll extent, the same at every zoom.
    const range = () => [-vw / 2, mapW - vw / 2, -vh / 2, mapH - vh / 2];
    const clamp = () => {
      const [loX, hiX, loY, hiY] = range();
      cam[0] = Math.max(loX, Math.min(cam[0], hiX));
      cam[1] = Math.max(loY, Math.min(cam[1], hiY));
      eye[0] = Math.round(cam[0]); eye[1] = Math.round(cam[1]);
    };
    // the edge, written back into the address bar so the look stays a link
    const writeEdgeQuery = (edge) => writeQuery("edge", edge === "black" ? null : edge);
    // one top-level parameter written back into the address bar; null deletes
    // it. Under a wipe the per-side knobs live inside a= and b=, so they are
    // rewritten there too
    function writeQuery(k, v) {
      const q = new URLSearchParams(location.search);
      const put = (p) => { if (v === null || v === "") p.delete(k); else p.set(k, v); };
      if (!GLOBAL.has(k) && (q.has("a") || q.has("b"))) {
        for (const s of ["a", "b"]) {
          if (!q.has(s)) continue;
          const raw = q.get(s);
          const inner = new URLSearchParams(raw.includes("=") ? raw : "preset=" + raw);
          put(inner); q.set(s, inner.toString());
        }
      } else put(q);
      history.replaceState(null, "", "?" + q.toString());
    }
    // the game-space point under the pointer: the canvas is the game frame 1:1
    const gamePoint = (e) => {
      const r = cv.getBoundingClientRect();
      return [(e.clientX - r.left) / r.width * GW, (e.clientY - r.top) / r.height * GH];
    };
    // THE WHEEL (header, CAMERA). A notch only says where the view is going;
    // the frame loop below moves it there. BAR's notch and tween (Recoil
    // CamTransitionMode 0): a notch is 14 % of the camera's distance (BAR's
    // ScrollWheelSpeed 20 x SpringController's 0.007), the controller takes
    // the new pose at once, and the DRAWN camera tweens to it from where it is
    // over 0.25 s along 1 - (1 - t)^4, an ease-out. The pose is lerped as
    // centre and 1/zoom, which is the 3D camera position here: on a ray
    // through the pointer it keeps the point still. Zooming IN aims the new
    // centre so the point under the pointer holds; zooming OUT keeps the
    // centre. A pointer off the world viewport has no world point: the zoom
    // is about the centre.
    const cx = vpL + vw / 2, cy = vpT + vh / 2;
    let tween = null;           // { c0, iz0, c1, iz1, t0 } in centre, 1/zoom
    function stepTween(now) {
      const f = Math.min(1, Math.max(0, (now - tween.t0) / 250));
      const g = 1 - Math.pow(1 - f, 4);
      const iz = tween.iz0 + (tween.iz1 - tween.iz0) * g;
      zoom = 1 / iz;
      cam[0] = tween.c0[0] + (tween.c1[0] - tween.c0[0]) * g - vw / 2;
      cam[1] = tween.c0[1] + (tween.c1[1] - tween.c0[1]) * g - vh / 2;
      clamp();
      if (f >= 1) { zoom = 1 / tween.iz1; tween = null; clamp(); }
    }
    // finish whatever the wheel started, at once: grabbing the map mid-zoom
    // lands where the zoom was going
    function settle() {
      if (tween) stepTween(Infinity);
    }
    let raf = 0;
    const kick = () => { if (!raf) raf = requestAnimationFrame(frame); };
    function frame(now) {
      raf = 0;
      if (tween) stepTween(now);
      draw();
      if (tween) kick();
    }
    cv.addEventListener("wheel", (e) => {
      e.preventDefault();
      const n = -e.deltaY / 100;                      // notches, + = in
      if (!n) return;
      const [ax, ay] = gamePoint(e);
      const a = ax >= vpL && ax < vpL + vw && ay >= vpT && ay < vpT + vh ? [ax, ay] : null;
      // the controller's pose: the tween's target while one is in flight
      const c = tween ? tween.c1.slice() : [cam[0] + vw / 2, cam[1] + vh / 2];
      const iz0 = tween ? tween.iz1 : 1 / zoom;
      let iz = Math.min(4, Math.max(0.125, iz0 * Math.max(0.1, 1 - 0.14 * n)));
      if (1 / iz > 0.999 && 1 / iz < 1.001) iz = 1;   // the game lands exactly on 1
      if (a && iz < iz0) {
        c[0] += (a[0] - cx) * (iz0 - iz); c[1] += (a[1] - cy) * (iz0 - iz);
      }
      const [loX, hiX, loY, hiY] = range();
      c[0] = Math.max(loX, Math.min(c[0] - vw / 2, hiX)) + vw / 2;
      c[1] = Math.max(loY, Math.min(c[1] - vh / 2, hiY)) + vh / 2;
      tween = { c0: [cam[0] + vw / 2, cam[1] + vh / 2], iz0: 1 / zoom,
                c1: c, iz1: iz, t0: performance.now() };
      kick();
    }, { passive: false });
    // a scroll step is world px, so it is divided by the zoom: the SCREEN moves
    // at the same rate at every zoom (the game scales ScrollSpeed by 1/z)
    addEventListener("keydown", (e) => {
      const step = (e.shiftKey ? 256 : 32) / zoom;
      if (!["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.key)) return;
      settle();
      if (e.key === "ArrowLeft")  cam[0] -= step;
      else if (e.key === "ArrowRight") cam[0] += step;
      else if (e.key === "ArrowUp")    cam[1] -= step;
      else cam[1] += step;
      e.preventDefault(); clamp(); kick();
    });
    const canvasX = (e) => {
      const r = cv.getBoundingClientRect();
      return (e.clientX - r.left) / r.width;
    };
    let drag = null;
    // the ground point under the pointer: invert the projection, then walk
    // the terrain's own half-height lift until it settles
    const groundPoint = (e) => {
      const [sx, sy] = gamePoint(e);
      if (sx < vpL || sx >= vpL + vw || sy < vpT || sy >= vpT + vh) return null;
      const wx = Math.round(E[0] + (sx - vpL) / zoom), wz0 = E[1] + (sy - vpT) / zoom;
      let wz = wz0;
      for (let i = 0; i < 4; i++) wz = wz0 + gndAt(wx, Math.round(wz)) / 2;
      return [wx, Math.round(wz)];
    };
    // SHIFT-CLICK queues the selected order at the ground point, CTRL-CLICK
    // makes the nearest unit (within 48 world units) the one being ordered
    function orderClick(e) {
      const g = groundPoint(e);
      if (!g) return;
      if (e.ctrlKey) {
        let best = null, bd = 48;
        instList.forEach((inst, i) => {
          if (inst.feature) return;
          const d = Math.hypot(inst.pos[0] - g[0], inst.pos[1] - g[1]);
          if (d < bd) { bd = d; best = instName(inst, i); }
        });
        if (best) { ordActive = best; writeQuery("ordunit", best); }
      } else if (ordActive) {
        let q = ordQueues.find((x) => x.unit === ordActive);
        if (!q) ordQueues.push(q = { unit: ordActive, nodes: [] });
        q.nodes.push({ cmd: ordCmd, to: g, issue: Math.floor(ordClock()) });
        writeQuery("orders", ordersQuery());
      }
      report(); present();
    }
    cv.addEventListener("pointerdown", (e) => {
      if (OS && (e.shiftKey || e.ctrlKey)) { orderClick(e); return; }
      if (sides.length > 1 && Math.abs(canvasX(e) - wipe) * GW < 8) drag = { wipe: true };
      else { settle(); drag = { x: e.clientX, y: e.clientY, cx: cam[0], cy: cam[1] }; }
      cv.setPointerCapture(e.pointerId);
    });
    cv.addEventListener("pointermove", (e) => {
      if (!drag) {
        if (sides.length > 1)
          cv.style.cursor = Math.abs(canvasX(e) - wipe) * GW < 8 ? "col-resize" : "";
        return;
      }
      if (drag.wipe) wipe = Math.min(1, Math.max(0, canvasX(e)));
      else {
        // pointer deltas are CSS px; one canvas px is k/dpr of those, and one
        // world px is `zoom` canvas px — so the ground stays under the pointer
        const s = GW / cv.getBoundingClientRect().width / zoom;
        cam[0] = drag.cx - (e.clientX - drag.x) * s;
        cam[1] = drag.cy - (e.clientY - drag.y) * s;
        clamp();
      }
      kick();
    });
    cv.addEventListener("pointerup", () => { drag = null; });
    // THE MARKERS ANIMATE on their own clock: every display frame re-presents
    // the composite with the markers over it, unless a world frame is already
    // on its way (it presents too)
    if (ordProg) {
      const tick = () => {
        if (!raf && !contextLost && ordQueues.length &&
            sides.some((L) => L.ord.style !== "off")) present();
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }
  }

  draw();
  try { sessionStorage.removeItem("tascene-lost"); } catch (_) {}
  document.title = "tascene-ready";
}

main().catch(fail);

// LIVE RELOAD. `tascene serve` re-stages this file into the pack whenever the
// checked-in source changes and writes its mtime token to __reload; we poll
// that and reload when it moves, so editing the viewer updates the open tab
// without a server restart or a manual refresh. Never under shot=1 — the
// headless shooter must render exactly one frame and stop. Any failure (an old
// pack with no token, a server that is not tascene's) silently stops the poll
// rather than logging once a second.
if (!SHOT) {
  (async () => {
    const read = async () => (await fetch("__reload", { cache: "no-store" })).text();
    let seen;
    try { seen = await read(); } catch (e) { return; }
    for (;;) {
      await new Promise((r) => setTimeout(r, 700));
      let now;
      try { now = await read(); } catch (e) { return; }
      if (now !== seen) { location.reload(); return; }
    }
  })();
}
</script>
