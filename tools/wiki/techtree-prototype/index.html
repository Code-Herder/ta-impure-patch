<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tech tree prototype</title>
<!-- PROTOTYPE, throwaway. Question: what should the wiki's tech-tree entry look like? Four structurally different
     variants on one page, switched by ?variant=A|B|C|D (the bar at the bottom, or the arrow keys), over the active mod's
     real build menus (extract.py writes them into the gitignored tools/wiki/mockup/gfx/techtree/<mod>/).
     Serve the repository root with  python3 tools/wiki/serve.py  and open /tools/wiki/techtree-prototype/. -->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="techtree.css">
</head>
<body>
<header id="controls">
  <h1>Tech tree <small>prototype</small></h1>
  <label>Detected mod <select id="mod"><option value="stock">Stock</option><option value="mayhem">Total Mayhem</option>
    <option value="prota">ProTA</option><option value="twilight">Twilight</option><option value="escalation">Escalation</option>
    <option value="tazero">TA Zero</option></select></label>
  <label>Side <select id="side"></select></label>
  <label class="find">Find <input id="find" type="search" placeholder="unit name…" list="names" autocomplete="off"><datalist id="names"></datalist></label>
  <span id="stats"></span>
</header>
<main id="win">
  <div id="wt"><span id="wtitle">Tech tree</span><span id="wsub"></span></div>
  <div id="body">
    <section id="view"></section>
    <aside id="detail" hidden></aside>
  </div>
</main>
<nav id="switcher" aria-label="Prototype variant">
  <button id="sw-prev" title="Previous variant (←)">&#9664;</button>
  <span id="sw-label"></span>
  <button id="sw-next" title="Next variant (→)">&#9654;</button>
</nav>
<script src="../mockup/pose.js"></script>
<script src="../mockup/cob.js"></script>
<script src="techtree.js" type="module"></script>
</body>
</html>
