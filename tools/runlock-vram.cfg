# The run lock's GPU memory budget (tools/runlock.py, THE VRAM TOKENS): the device's total memory,
# less reserve_mib, in tokens of one harness game's bound plus a margin, one token a game that
# renders on the GPU. Every figure is MiB.
#
# reserve_mib: what the runs must leave to everything else on the card. The reference setup's
# desktop holds about 2 GB of its 12 282 MiB with no game running (the owner's figure, 2026-11-12);
# 3 GiB keeps a further GiB for its growth and for the drivers' own allocations.
reserve_mib = 3072
#
# cap_mib: the GPU memory cap of a harness game. tacli writes it into the instance's impure.cfg as
# `gpumem=` for every launch inside a run-lock hold, and the DLL charges each device-local
# allocation against it at vkAllocateMemory, refusing one that would take the sum past it
# (inc/tagpu_vkcap.h): a game's own allocations never sum past cap_mib, by construction. The only
# allocations sized against free memory -- the restorer's neighbourhood atlas and its restored
# chain -- ask the cap's headroom first and restore the terrain per tile instead.
# 920, from tools/vramproof.py at cap 768 on the play defaults (MEASURED 2026-11-13, run3: 8 games of
# scenarios/200v200 and 4 of scenarios/500v500 at once on the reference setup):
#   * 200v200: no refusal; the ledger's peak 654 MiB in every game.
#   * 500v500: the cap refused one allocation in every game, of 63.75 MiB (66 846 720 bytes, at 747
#     MiB held) or 31.875 MiB (33 423 360, at 741-754 MiB held), while the terrain's per-tile
#     restore ran. The least the heaviest game asked for is therefore 747 + 64 = 811 MiB (754 + 32 =
#     786 in another), and 768 was too small.
#   * The tokens: a token is cap_mib + 96 (below), and (12 282 - 3072) // (cap_mib + 96) is 9 for
#     every cap_mib from 826 to 927; 920 is the largest multiple of 8 that keeps 9 games
#     on the GPU, and so the most headroom the same 9 tokens buy: 109 MiB over the 811 MiB asked.
#   * What a larger cap changes: the neighbourhood atlas (192 MB) is taken only when it is at most
#     half of the cap's headroom at that moment; the ledger then held 411-463 MiB in the 200v200
#     games and 609-625 in the 500v500 ones (768 less the `MB left` of each game's `vk: terr` line).
#     At 920 the 200v200 games have 457-509 MiB of headroom there and TAKE the atlas (192 <= half),
#     leaving at least 265 MiB after it, so their 654 MiB peak is not their peak at 920; the
#     500v500 games have 295-311 and keep the per-tile restore (the atlas would need a cap of
#     1009). The fits rule keeps the atlas from taking the last half of the headroom,
#     but no rule bounds what the game asks for after it: that no allocation is refused is
#     MEASURED per scenario, by tools/vramproof.py, never inferred from a cap.
# A test-render game (tareplay's TEST_RENDER: ss 1, no restorer) held 308-338 MiB (MEASURED
# 2026-11-12), far under the cap.
cap_mib = 920
#
# driver_mib: what the driver holds for a game outside its allocations -- the swapchain's images,
# pipelines, descriptor and command pools -- and what the ledger's 64 KiB charge granule misses. 64:
# in run3 above the largest process peak over its ledger's peak was 46 MiB (a 500v500 game: 800
# MiB per process, 754 in its ledger), past the 32 a game at the main menu suggested (19 MiB in
# all, MEASURED 2026-11-12); 64 keeps 18 MiB over the largest seen. The two peaks are sampled at
# different moments (nvidia-smi once a second, the ledger at each high water), so the gap is a
# figure of the run and not a bound. The bound of one game, B, is cap_mib + driver_mib = 984.
driver_mib = 64
#
# margin_mib: over B, for what the device holds for a game outside every process. 32: in run3 the
# device's use rose 5011 MiB with the eight 200v200 games, 115 more than their processes' 4896,
# 14.4 MiB a game, and 2525 with the four 500v500 games, 53 more than their 2472, 13.3 a game.
margin_mib = 32
#
# A token is B + margin_mib = 1016. On the reference setup: (12 282 - 3072) // 1016 = 9 games on the
# GPU at once, together at most 9 x 1016 = 9144 of the 9210 MiB the reserve leaves.
