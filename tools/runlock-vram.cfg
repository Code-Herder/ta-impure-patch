# The run lock's GPU memory budget (tools/runlock.py, THE GPU MEMORY): the device's total memory,
# less reserve_mib, counted in units of 32 MiB. Each game a run puts on the GPU takes its cap -- the
# play defaults' cap_mib below, or its suite's in tools/runlock-suites.cfg -- plus driver_mib and
# margin_mib. Every figure is MiB.
#
# This file SEEDS the lock's own copy, runslots/vram.cfg beside tareplay.lock in the common git
# directory: the first run on a lock without one writes it from its tree's file, and every run
# reads the lock's, whatever its tree's says (runlock.py, THE BUDGET BELONGS TO THE LOCK, NOT TO A
# TREE). A change here reaches the runs only once that copy is edited or removed.
#
# reserve_mib: what the runs must leave to everything else on the card. The reference setup's
# desktop holds about 2 GB of its 12 282 MiB with no game running (the owner's figure, 2026-11-12);
# 3 GiB keeps a further GiB for its growth and for the drivers' own allocations.
reserve_mib = 3072
#
# cap_mib: the GPU memory cap of a game of a run that names no suite: the play defaults'. Every game
# launched inside such a hold carries it in its impure.cfg as `gpumem=` (runlock.write_gpumem),
# and the DLL charges each device-local
# allocation against it at vkAllocateMemory, refusing one that would take the sum past it
# (inc/tagpu_vkcap.h): a game's own allocations never sum past cap_mib, by construction. The only
# allocations sized against free memory -- the restorer's neighbourhood atlas and its restored
# chain -- ask the cap's headroom first and restore the terrain per tile instead.
# 920, from tools/vramproof.py at cap 768 on the play defaults (MEASURED 2026-11-13, run3: 8 games of
# scenarios/200v200 and 4 of scenarios/500v500 at once on the reference setup):
#   * 200v200: no refusal; the ledger's peak 654 MiB in every game.
#   * 500v500: the cap refused one allocation in every game, of 63.75 MiB (66 846 720 bytes, at 747
#     MiB held) or 31.875 MiB (33 423 360, at 741-754 MiB held), while the terrain's per-tile
#     restore ran. The least the heaviest game asked for is therefore 747 + 64 = 811 MiB (754 + 32 =
#     786 in another), and 768 was too small.
#   * The games at once: a game takes cap_mib + 96 of the budget (below), and (12 282 - 3072) //
#     (cap_mib + 96) is 9 for every cap_mib from 826 to 927; 920 is the largest multiple of 8 that
#     keeps 9 games on the GPU, and so the most headroom the same 9 games buy: 109 MiB over the 811
#     MiB asked.
#   * What a larger cap changes: the neighbourhood atlas (192 MB) is taken only when it is at most
#     half of the cap's headroom at that moment; the ledger then held 411-463 MiB in the 200v200
#     games and 609-625 in the 500v500 ones (768 less the `MB left` of each game's `vk: terr` line).
#     At 920 the 200v200 games TAKE the atlas (192 <= half the headroom), so their peak at 768 is
#     not their peak at 920; the 500v500 games keep the per-tile restore (the atlas would need a
#     cap of 1009). The fits rule keeps the atlas from taking the last half of the headroom, but no
#     rule bounds what a game asks for after it: that no allocation is refused is MEASURED per
#     scenario, by tools/vramproof.py, never inferred from a cap.
#   * The proof at 920 (MEASURED 2026-11-13, run4, at 19e25a09; every game capped at 920, no
#     allocation refused):
#       200v200 x 9: all nine restore the terrain by neighbourhood (457-524 MiB of headroom when
#       the terrain asked); the ledger at most 881 MiB, a process at most 906 of the 984 bound,
#       the processes together at most 7516 and the device's use at most 8984 MiB, of which 1321
#       before the games.
#       500v500 x 4: per tile (302-305 MiB of headroom); the ledger at most 894 MiB, a process at
#       most 941, the largest process over its ledger 47 MiB (driver_mib's 64 below).
# A test-render game (tareplay's TEST_RENDER: ss 1, no restorer) held 308-338 MiB (MEASURED
# 2026-11-12), far under the cap.
cap_mib = 920
#
# driver_mib: what the driver holds for a game outside its allocations -- the swapchain's images,
# pipelines, descriptor and command pools -- and what the ledger's 64 KiB charge granule misses. 64:
# in run3 above the largest process peak over its ledger's peak was 46 MiB (a 500v500 game: 800
# MiB per process, 754 in its ledger), past the 32 a game at the main menu suggested (19 MiB in
# all, MEASURED 2026-11-12); 64 keeps 18 MiB over the largest seen, and run4 at 920 saw 47. The two peaks are sampled at
# different moments (nvidia-smi once a second, the ledger at each high water), so the gap is a
# figure of the run and not a bound. The bound of one game, B, is cap_mib + driver_mib = 984.
driver_mib = 64
#
# margin_mib: over B, for what the device holds for a game outside every process. 32: in run3 the
# device's use rose 5011 MiB with the eight 200v200 games, 115 more than their processes' 4896,
# 14.4 MiB a game, and 2525 with the four 500v500 games, 53 more than their 2472, 13.3 a game; in
# run4 at 920, 7663 against 7516 for nine 200v200 games (16.3 a game) and 3622 against 3567 for
# four 500v500 ones (13.8 a game).
margin_mib = 32
#
# A game at cap_mib takes B + margin_mib = 1016 of the budget. On the reference setup the budget is
# 12 282 - 3072 = 9210 MiB, 287 units of 32 (9184 MiB), and 9 such games fit: 9 x 1016 = 9144,
# rounded up to whole units once a run (runlock.gpu_units).
