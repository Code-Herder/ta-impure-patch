# The run lock's GPU memory budget (tools/runlock.py, THE VRAM TOKENS): the device's total memory,
# less reserve_mib, in tokens of game_mib, one token a game that renders on the GPU.
#
# PROVISIONAL, both figures, until a runner measures a game's peak device memory.
#
# reserve_mib: what the runs must leave to everything else on the card. The reference setup's
# desktop holds about 2 GB of its 12 282 MiB with no game running (the owner's figure, 2026-11-12);
# 3 GiB keeps a further GiB for its growth and for the drivers' own allocations.
reserve_mib = 3072
#
# game_mib: the most one game may hold. A 200v200 skirmish on the default settings held 917-921 MiB
# alone on an RTX 4070 and 935 MiB at its worst with other games on the GPU (MEASURED 2026-11-06,
# tools/compat/tacompat.py); 18 games at once filled 11 824 of 12 282 MiB and four setups lost their
# UI. Each game's compute restorer sizes its atlas to half of what is free when it starts
# (ta-vulkan-compute-restorer, D10), so a game on an emptier card, or a heavier one than that
# skirmish, may take more: 1 GiB is a margin over one measured game, not a measured peak.
game_mib = 1024
#
# On the reference setup: (12 282 - 3072) // 1024 = 8 games on the GPU at once.
