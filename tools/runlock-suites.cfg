# The GPU memory cap of each suite's games, MiB (tools/runlock.py, THE GPU MEMORY): what a run that
# names the suite (runlock.hold(..., suite=NAME), `runlock.py run --suite NAME`) writes into each
# of its games' impure.cfg as `gpumem=`, and what each of its games takes of the lock's GPU budget,
# with driver_mib and margin_mib of the lock's runslots/vram.cfg. A run that names no suite runs
# under the play defaults' cap_mib (tools/runlock-vram.cfg).
#
# These are this tree's figures, not the lock's: a suite's peak is its renderer's, so a tree whose
# renderer changes measures its own. Each figure is the suite's measured peak -- the most its games
# held, in the DLL's ledger (`vk: gpumem: ... held at most N MiB`) and per process (nvidia-smi) --
# plus a margin stated beside it; `tools/vramproof.py watch --suite NAME -- <the suite's command>`
# measures one. A figure too small is not a silent change: a refusal the renderer does not plan for
# fails the game by name in every suite, read from the game's whole log once it has stopped
# (tools/runlock.py, THE GPU MEMORY; talog.CapWatch).
#
# replay: tareplay.py's lanes (landing, broad, run) and the replay network tests (recmp_*).
# MEASURED 2026-11-13 at 105ce1a8 (`vramproof watch`, battle, battle-los, tenseat, stock-limits and
# impai-fight on the players' renderer, --cover, under a cap of 920): ledger peak 320 MiB in every
# game, process peak 345, no refusal. 384 = the ledger peak plus 64. The two-player groups
# (multiplayer-raised, -stock) exist only inside `landing` and were not measured; a refusal there
# fails the game by name, so the first landing that plays them measures them.
replay = 384
#
# compat: tacompat.py wine's games, every setup and stage, and the mod tools that start games the
# same way (tools/mods/modmp.py). NOT YET MEASURED: at a cap of 920 (2026-11-13, 105ce1a8) the cap
# refused 40-64 MiB allocations at 877-915 MiB held in 36 of 68 games -- 31 rows UNEXPECTED and 8
# network games failed -- so the peak is above 920 by at least the refused allocation. 1536 is a
# provisional bound to measure under, not a measurement.
compat = 1536
#
# wiki: wiki_regression.py's gate, its game lanes and its mods and mp lanes. NOT YET MEASURED: at a
# cap of 920 (2026-11-13) the players and units lanes were refused at 912 MiB held. 1536 is a
# provisional bound to measure under, not a measurement.
wiki = 1536
