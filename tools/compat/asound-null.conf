# ALSA's default device for the games tacompat starts: the null plugin, which accepts every sample
# and plays none. The game still finds a working sound device (TA:ESC puts up "No sound driver is
# available for use." without one), and nothing reaches the speakers. tacompat points
# ALSA_CONFIG_PATH here and keeps Wine off PulseAudio, so Wine's ALSA driver is the one it uses.
pcm.!default {
    type null
}
