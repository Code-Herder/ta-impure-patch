<title>Replay UI Prototype</title>
<!-- PROTOTYPE — throwaway. Delete before the S5 landing, or fold the winner into the real screens.

     Question: what should the demo recorder's S5 UI feel like in use? The main-menu entry, the
     Replays browser and the in-game controls are walked through as one flow, in three directions:
       A  Native TA       centre REPLAYS button · list + detail browser · the left panel becomes
                          the replay panel · TA's own -10..+10 speed steps · REWIND in the Tab menu
       B  Video player    an icon beside the sprocket · an expandable table · a bottom dock ·
                          speed presets · a top-bar rewind button and a hotkey
       D  The pick        A's menu and browser · B's dock without its view/follow dropdowns ·
                          C's player cards on the right, each with stats, jump, sight and follow
       C  Spectator desk  REPLAYS in INTRO's slot · the fork graph · a timeline on top and
                          player cards · one cycling speed button · a top-bar rewind button
     Switch with the bottom bar or the arrow keys; #A..#D in the URL picks one; D is the default.
     Everything is in memory: the recordings, the forks and the world are fake.

     Verdict so far (owner, 2026-10-01): main menu A (centre REPLAYS button), browser A (list +
     detail), in game B's bottom dock with C's player cards on the right — names, stats, a button to
     jump to each player. That is D. Still to settle: D's in-game details, then delete this file. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one 1280x720 game frame scaled to the window, a state readout under it, the switcher floating. */
:root {
  --paper: #e9ecef; --box: #ffffff; --screen: #dde1e5; --world: #c9d0d6; --fog: #3a434c;
  --line: #8a949e; --ink: #1d2329; --muted: #5d6873;
  --accent: #2456c9; --new-fill: #e3ebfb; --imp: #7a5cc0; --imp-fill: #efeafa; --warn: #b5541c;
  --bar: #1d2329; --bar-ink: #f4f6f8;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #14181d; --box: #262c35; --screen: #20262e; --world: #1c2228; --fog: #05070a;
  --line: #66717d; --ink: #e2e6ea; --muted: #98a2ad;
  --accent: #7ea4ff; --new-fill: #1f2d4d; --imp: #b39cf0; --imp-fill: #2a2440; --warn: #f0995e;
  --bar: #f4f6f8; --bar-ink: #14181d; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #14181d; --box: #262c35; --screen: #20262e; --world: #1c2228; --fog: #05070a;
  --line: #66717d; --ink: #e2e6ea; --muted: #98a2ad;
  --accent: #7ea4ff; --new-fill: #1f2d4d; --imp: #b39cf0; --imp-fill: #2a2440; --warn: #f0995e;
  --bar: #f4f6f8; --bar-ink: #14181d; color-scheme: dark }
body { background: var(--paper); color: var(--ink); font-family: var(--mono); font-size: 13px; }
.wrap { padding-inline: 16px; padding-block: 16px 96px; display: grid; gap: 10px; }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 24px; }
h1 { font-family: var(--display); font-size: 26px; text-transform: uppercase; letter-spacing: .03em; margin: 0; }

#stage { width: 100%; height: auto; display: block; border: 1px solid var(--line); background: var(--screen); touch-action: none; user-select: none; }
#state { margin: 0; padding: 10px 12px; background: var(--box); border: 1px solid var(--line); font-size: 12px; line-height: 1.45; white-space: pre-wrap; overflow-x: auto; color: var(--muted); }
.switcher { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; align-items: center; gap: 4px; background: var(--bar); color: var(--bar-ink); border-radius: 999px; padding: 4px; box-shadow: 0 6px 24px rgba(0,0,0,.3); z-index: 10; max-width: calc(100vw - 32px); }

svg text { font-family: var(--mono); fill: var(--ink); dominant-baseline: central; }
.scr { fill: var(--screen); } .world { fill: var(--world); }
.art { fill: var(--world); stroke: var(--line); stroke-dasharray: 4 4; }
.stk { fill: var(--box); stroke: var(--line); }
.imp { fill: var(--imp-fill); stroke: var(--imp); stroke-dasharray: 3 2; }
.new { fill: var(--new-fill); stroke: var(--accent); stroke-width: 1.5; }

.dim { opacity: .4; }
.t-m { fill: var(--muted); } .t-a { fill: var(--accent); } .t-w { fill: var(--warn); } .t-i { fill: var(--imp); }
.acc { fill: var(--accent); } .warnf { fill: var(--warn); } .mutedf { fill: var(--muted); } .inkf { fill: var(--ink); }
.ln { fill: none; stroke: var(--line); stroke-width: 1.5; }

.p0 { fill: #3b6fd8; } .p1 { fill: #d0453b; } .p2 { fill: #d2a21f; } .p3 { fill: #3a9a5b; } .p4 { fill: #9a54c8; } .p5 { fill: #2aa3a8; }
.s0 { stroke: #3b6fd8; } .s1 { stroke: #d0453b; } .s2 { stroke: #d2a21f; } .s3 { stroke: #3a9a5b; } .s4 { stroke: #9a54c8; } .s5 { stroke: #2aa3a8; }

<div class="wrap">
  <div class="head">
    <h1>Replay UI Prototype</h1>
    <span class="hint">Click through it: main menu → Replays → Watch. Single Player starts a live skirmish to try rewind. ← → switch direction.</span>
  </div>
  <svg id="stage" viewBox="0 0 1280 720" role="application" aria-label="Replay UI prototype"></svg>
  <pre id="state"></pre>
</div>
<div class="switcher" role="group" aria-label="Prototype variant">

  <span id="vlabel"></span>
  <button type="button" id="next" aria-label="Next variant">▶</button>
</div>

<script>
/* ======================= model ======================= */
const VARIANTS = [
  { key: "A", name: "Native TA", menu: "A", browser: "A", hud: "A", speed: "A" },
  { key: "B", name: "Video player", menu: "B", browser: "B", hud: "B", speed: "B" },
  { key: "C", name: "Spectator desk", menu: "C", browser: "C", hud: "C", speed: "C" },
  { key: "D", name: "The pick: A's menus, B's dock, player cards", menu: "A", browser: "A", hud: "D", speed: "B" },
];
const MAP = { w: 2600, h: 1600 }, CENTER = [1300, 800];
const BASES = [[260, 260], [2340, 1340], [2340, 260], [260, 1340], [1300, 180], [1300, 1420]];
const DAY = 864e5;
let uid = 1;
function tl(name, parent, forkT, end, defeats, extra = {}) {
  return { id: "t" + uid++, name, parent, forkT, end, defeats, k: 1 + Math.random() * 1.2, marks: [], lastPlayed: Date.now() - 5 * DAY, ...extra };
}
function rec(map, kind, players, len, result, defeats, extra = {}) {
  const orig = tl("Original", null, null, len, defeats);
  return { id: "r" + uid++, map, kind, players, result, fav: false, date: extra.date || "Sep 30", tls: [orig], incompatible: false, live: false, ...extra };
}
const P = (name, side, ai = false) => ({ name, side, ai });
const RECS = [];
{
  const r = rec("Comet Catcher", "skirmish", [P("You", "ARM"), P("AI 2", "CORE", 1), P("AI 3", "CORE", 1), P("AI 4", "ARM", 1)], 2292, "Victory", { 1: 1900, 2: 2162, 3: 2292 }, { fav: true, date: "Sep 30", diff: "Hard" });
  const o = r.tls[0];
  r.tls.push(tl("Fork 1, from 25:00, as You", o.id, 1500, 1750, { 1: 1700 }, { as: 0, lastPlayed: Date.now() - 2 * DAY }));
  r.tls.push(tl("Fork 2, from 31:40, as AI 2", o.id, 1900, 1985, {}, { as: 1, lastPlayed: Date.now() - 3600e3 }));
  RECS.push(r);
  RECS.push(rec("Painted Desert", "multiplayer", [P("You", "CORE"), P("Kestrel", "ARM")], 1300, "Defeat", { 0: 1300 }, { date: "Sep 29" }));
  RECS.push(rec("Lava Highlands", "skirmish", [P("You", "ARM"), P("AI 2", "CORE", 1), P("AI 3", "ARM", 1), P("AI 4", "CORE", 1), P("AI 5", "ARM", 1), P("AI 6", "CORE", 1)], 723, "Incomplete", {}, { date: "Sep 28", diff: "Medium" }));
  const s = rec("Seven Islands", "multiplayer", [P("You", "ARM"), P("Brannoc", "CORE")], 2698, "Victory", { 1: 2698 }, { fav: true, date: "Sep 26" });
  const so = s.tls[0];
  s.tls.push(tl("Fork 1, from 12:00, as Brannoc", so.id, 720, 1100, {}, { as: 1, lastPlayed: Date.now() - 9 * DAY }));
  s.tls.push(tl("Fork 2, from 20:00, as You", so.id, 1200, 1500, {}, { as: 0, lastPlayed: Date.now() - 4 * DAY }));
  s.tls.push(tl("Fork 3, from 30:00, as You", so.id, 1800, 2000, {}, { as: 0, lastPlayed: Date.now() - DAY }));
  RECS.push(s);
  RECS.push(rec("Gods of War", "skirmish", [P("You", "ARM"), P("AI 2", "CORE", 1), P("AI 3", "CORE", 1), P("AI 4", "ARM", 1)], 1817, "Needs v0.3", {}, { date: "Sep 21", incompatible: true }));
}
const S = {
  v: 0, screen: "menu", mode: "watch", rec: null, tl: null, t: 0, now: 0, playing: false, speed: 1, step: 0,
  seek: null, drag: null, persp: -1, follow: -1, ov: { cursors: true, clicks: true, sel: true, orders: true },
  dialog: null, pop: null, rewind: false, tabmenu: false, resuming: 0, cam: [600, 300],
  sel: 0, selTl: null, selT: null, expand: 0, record: true, toast: null,
};
const findTl = (r, id) => r.tls.find(x => x.id === id);
// A deleted fork stays in memory, hidden: a fork branched from it still needs its history.
const shown = r => r.tls.filter(x => !x.deleted);
const forksOf = r => shown(r).filter(x => x.parent);
function shownParent(r, t) { let p = findTl(r, t.parent); while (p && p.deleted) p = findTl(r, p.parent); return p; }
// The fork the next one would replace: least recently played, never the one in use.
const lruFork = (r, inUse) => forksOf(r).filter(x => x.id !== inUse).sort((a, b) => a.lastPlayed - b.lastPlayed)[0];
function defeatAt(r, t, pid) {
  const d = t.defeats[pid];
  if (d !== undefined) return d;
  if (t.parent) { const p = findTl(r, t.parent), pd = defeatAt(r, p, pid); return pd !== null && pd <= t.forkT ? pd : null; }
  return null;
}
function phase(r, t, time) {
  if (!t.parent) return time;
  const p = findTl(r, t.parent);
  return time <= t.forkT ? phase(r, p, time) : phase(r, p, t.forkT) + (time - t.forkT) * t.k;
}
const alive = (r, t, pid, time) => { const d = defeatAt(r, t, pid); return d === null || time < d; };
function hash(a, b) { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); }
function units(r, t, time) {
  const out = [], ph = phase(r, t, time);
  r.players.forEach((p, pid) => {
    if (!alive(r, t, pid, time)) return;
    const [bx, by] = BASES[pid];
    for (let i = 0; i < 24; i++) {
      const spawn = i * 55;
      if (time < spawn) break;
      const prog = i % 3 ? Math.min(1, (time - spawn) / 500) * 0.55 : 0.08;
      const ang = hash(pid, i) * 6.283 + ph / (9 + pid) + i;
      const rad = 40 + (i % 5) * 18;
      out.push({ pid, i, x: bx + (CENTER[0] - bx) * prog + rad * Math.cos(ang), y: by + (CENTER[1] - by) * prog + rad * Math.sin(ang) });
    }
  });
  return out;
}
function econ(r, t, pid, time) {
  const ph = phase(r, t, time);
  if (!alive(r, t, pid, time)) return { m: 0, e: 0, n: 0 };
  return { m: Math.round(300 + 900 * (1 - Math.exp(-time / 600)) + 90 * Math.sin(ph / 30 + pid)), e: Math.round(1500 + 4300 * (1 - Math.exp(-time / 700)) + 300 * Math.sin(ph / 40 + pid)), n: Math.min(24, Math.floor(time / 55) + 1) };
}
function events(r, t) {
  const ev = [];
  const end = t.end;
  r.players.forEach((p, pid) => { const d = defeatAt(r, t, pid); if (d !== null && d <= end) ev.push({ t: d, kind: "death", pid }); });
  r.tls.filter(x => x.parent === t.id && !x.deleted).forEach(f => ev.push({ t: f.forkT, kind: "fork", tl: f }));
  if (t.parent) ev.push({ t: t.forkT, kind: "forkpt" });
  t.marks.forEach(m => ev.push({ t: m, kind: "mark" }));
  return ev.filter(e => e.t <= end);
}

/* ======================= drawing helpers ======================= */
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const fmt = s => { s = Math.max(0, Math.floor(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const act = (a, arg) => a ? ` data-act="${a}"${arg !== undefined ? ` data-arg="${arg}"` : ""}` : "";
function B(x, y, w, h, cls, label = "", fs = 12, tcls = "", a, arg) {
  let s = `<g${act(a, arg)}><rect x="${x}" y="${y}" width="${w}" height="${h}" class="${cls}"/>`;
  if (label !== "") s += `<text x="${x + w / 2}" y="${y + h / 2}" font-size="${fs}" text-anchor="middle" class="${tcls}">${esc(label)}</text>`;
  return s + "</g>";
}
const T = (x, y, s, fs = 12, cls = "", anchor = "start") => `<text x="${x}" y="${y}" font-size="${fs}" class="${cls}" text-anchor="${anchor}">${esc(s)}</text>`;
const L = (x1, y1, x2, y2, cls = "ln", st = "") => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${cls}" style="${st}"/>`;
function marker(x, y, k, s = 1) {
  if (k === "fork" || k === "forkpt") return `<path d="M${x} ${y - 7 * s} L${x + 7 * s} ${y} L${x} ${y + 7 * s} L${x - 7 * s} ${y} Z" class="${k === "fork" ? "acc" : "mutedf"}"/>`;
  if (k === "death") return `<path d="M${x - 6 * s} ${y - 6 * s} L${x + 6 * s} ${y + 6 * s} M${x + 6 * s} ${y - 6 * s} L${x - 6 * s} ${y + 6 * s}" style="stroke:var(--warn);stroke-width:${2.5 * s}"/>`;
  if (k === "mark") return `<rect x="${x - 3 * s}" y="${y - 8 * s}" width="${6 * s}" height="${12 * s}" class="inkf"/>`;
  return "";
}
// A 640x480 shell screen, drawn at 1.5x in the middle of the frame.
const shell = inner => `<rect width="1280" height="720" class="scr"/><svg x="160" y="0" width="960" height="720" viewBox="0 0 640 480"><rect width="640" height="480" class="scr" style="stroke:var(--line)"/>${inner}</svg>`;

/* ======================= main menu ======================= */
function mainMenu() {
  const v = VARIANTS[S.v].menu;
  let s = B(120, 40, 400, 300, "art", "background art", 11, "t-m");
  s += B(596, 2, 28, 28, "imp", "⚙", 14, "t-i", "toast", "The sprocket opens Impure's settings");
  s += B(139, 393, 96, 20, "stk", "SINGLE PLAYER", 9, "", "skirmish");
  s += B(139, 430, 96, 20, "stk", "MULTIPLAYER", 9, "", "toast", "Not in the prototype");
  s += B(409, 430, 96, 20, "stk", "EXIT", 9, "", "toast", "Not in the prototype");
  s += B(280, 440, 80, 40, "art", "Cavedog", 9, "t-m");
  if (v === "A") s += B(409, 393, 96, 20, "stk", "INTRO", 9, "", "toast", "The intro movie") + B(272, 393, 96, 20, "new", "REPLAYS", 9, "t-a", "browser");
  if (v === "B") s += B(409, 393, 96, 20, "stk", "INTRO", 9, "", "toast", "The intro movie") + B(564, 2, 28, 28, "new", "▶", 12, "t-a", "browser") + T(560, 16, `Replays · ${RECS.length}`, 8, "t-a", "end");
  if (v === "C") s += B(409, 393, 96, 20, "new", "REPLAYS", 9, "t-a", "browser");
  s += T(20, 470, "Single Player starts a live skirmish (prototype shortcut)", 8, "t-m");
  return shell(s);
}

/* ======================= browsers ======================= */
function browserHead() {
  let s = T(24, 26, "REPLAYS", 18);
  s += T(616, 26, `${RECS.length} recordings`, 8, "t-m", "end");
  return s;
}
function footer(y) {
  let s = T(24, y, "Replays use 412 MB of disk.", 9, "t-m");
  s += B(200, y - 9, 70, 18, "new", "Clean up…", 8, "t-a", "toast", "Cleanup by age or total size; favorites are kept");
  s += B(280, y - 9, 130, 18, S.record ? "on" : "new", (S.record ? "☑" : "☐") + " Record my games", 8, "t-a", "record");
  return s;
}
const resCls = r => r.result === "Incomplete" || r.incompatible ? "t-w" : "t-m";
const curRec = () => RECS[S.sel];
const selTl = () => { const r = curRec(); return (S.selTl && findTl(r, S.selTl)) || r.tls[0]; };
function lastPlayedText(t) { const d = (Date.now() - t.lastPlayed) / DAY; return d < 0.01 ? "just now" : d < 1 ? "today" : `${Math.round(d)} d ago`; }
function tlRows(x, y, w, r) {
  let s = "";
  shown(r).forEach((t, i) => {
    const yy = y + i * 34, isSel = t.id === selTl().id;
    s += B(x, yy, w, 30, isSel ? "on" : "stk", "", 8, "", "selTl", t.id);
    s += T(x + 8, yy + 9, t.name, 8);
    s += T(x + 8, yy + 21, t.parent ? `→ ${fmt(t.end)} · played ${lastPlayedText(t)}` : `${fmt(t.end)} · ${r.result}`, 7, "t-m");
    if (t.parent) s += B(x + w - 22, yy + 6, 18, 18, "new", "✕", 9, "t-a", "delFork", t.id);
  });
  return s;
}
function browserA() {
  let s = browserHead() + B(20, 46, 330, 330, "stk");
  RECS.forEach((r, i) => {
    const y = 52 + i * 46;
    s += `<g${act("selRec", i)}><rect x="24" y="${y - 2}" width="322" height="44" class="${i === S.sel ? "on" : "stk"}" style="${i === S.sel ? "" : "stroke:none"}"/>`;
    s += T(32, y + 10, (r.fav ? "★ " : "") + r.map, 10) + T(32, y + 28, `${r.players.length} · ${r.kind} · ${r.date} · ${fmt(r.tls[0].end)}`, 8, "t-m");
    s += T(340, y + 10, r.incompatible ? "Needs v0.3" : r.result, 8, resCls(r), "end");
    const nf = forksOf(r).length;
    if (nf) s += T(340, y + 28, `${nf} fork${nf > 1 ? "s" : ""}`, 8, "t-a", "end");
    s += "</g>";
  });
  const r = curRec();
  s += B(362, 46, 258, 330, "stk") + B(370, 54, 90, 90, "art", "minimap", 8, "t-m");
  s += T(470, 62, r.map, 10);
  r.players.forEach((p, i) => { const d = defeatAt(r, r.tls[0], i); s += `<rect x="470" y="${74 + i * 13}" width="8" height="8" class="p${i}"/>` + T(482, 78 + i * 13, p.name, 8) + T(612, 78 + i * 13, d === null ? (r.result === "Incomplete" ? "–" : "won") : "out " + fmt(d), 7, "t-m", "end"); });
  s += T(370, 162, "TIMELINES", 8, "t-m") + tlRows(370, 172, 242, r);
  s += footer(396);
  const dis = r.incompatible;
  s += B(20, 440, 96, 20, dis ? "stk dim" : "new", "WATCH", 9, "t-a", "watch");
  s += B(124, 440, 116, 20, dis ? "stk dim" : "new", "PLAY ON FROM END…", 8, "t-a", "takeoverEnd");
  s += B(248, 440, 80, 20, "stk", r.fav ? "★ UNFAV" : "☆ FAVORITE", 8, "", "fav");
  s += B(336, 440, 72, 20, "stk", "EXPORT", 8, "", "toast", "Export timeline writes one timeline to its own file");
  s += B(540, 440, 80, 20, "stk", "BACK", 9, "", "menu");
  return shell(s);
}
function browserB() {
  let s = browserHead() + B(20, 46, 600, 370, "stk");
  [[30, "MAP"], [180, "PLAYERS"], [300, "DATE"], [356, "LENGTH"], [420, "RESULT"], [500, "FORKS"]].forEach(([x, n]) => s += T(x, 58, n, 7, "t-m"));
  s += L(24, 66, 616, 66);
  let y = 70;
  RECS.forEach((r, i) => {
    const open = S.expand === i;
    s += `<g${act("expand", i)}><rect x="24" y="${y}" width="592" height="20" class="${open ? "on" : "stk"}" style="${open ? "" : "stroke:none"}"/>`;
    s += T(30, y + 10, (open ? "▾ " : "▸ ") + (r.fav ? "★ " : "") + r.map, 9) + T(180, y + 10, `${r.players.length} · ${r.kind}`, 8) + T(300, y + 10, r.date, 8) + T(356, y + 10, fmt(r.tls[0].end), 8) + T(420, y + 10, r.incompatible ? "Needs v0.3" : r.result, 8, resCls(r));
    const nf = forksOf(r).length;
    s += T(500, y + 10, nf || "–", 8, nf ? "t-a" : "t-m") + "</g>";
    y += 22;
    if (open) shown(r).forEach(t => {
      s += L(40, y, 40, y + 20) + L(40, y + 10, 52, y + 10);
      s += T(58, y + 10, t.parent ? `${t.name} · → ${fmt(t.end)} · ${lastPlayedText(t)}` : `Original · ${fmt(t.end)} · ${r.result}`, 8);
      if (!r.incompatible) s += B(430, y + 2, 50, 16, "new", "Watch", 7, "t-a", "watchTl", t.id) + B(484, y + 2, 70, 16, "new", "Play on…", 7, "t-a", "takeoverTl", t.id);

    else if (S.mode === "live" && !S.rewind && !S.dialog) { S.now += dt; S.t = S.now; S.tl.end = S.now; }
    else if (S.mode === "watch" && S.playing && !S.seek && !S.drag && !S.dialog) { S.t = Math.min(S.tl.end, S.t + dt * S.speed); if (S.t >= S.tl.end) S.playing = false; }
    if (!S.drag) render();
  } else if (S.toast && S.toast.until > now - 100) render();
  requestAnimationFrame(tick);
}
render();
requestAnimationFrame(tick);
</script>
