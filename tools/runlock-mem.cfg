# The run lock's host memory (tools/runlock.py, THE HOST MEMORY): the machine's memory (/proc/meminfo's
# MemTotal) less reserve_mib, shared by the 28 slots, so each slot carries (MemTotal - reserve_mib) // 28
# MiB and the slots held never carry more than MemTotal - reserve_mib. A job that needs more than a slot
# runs through runlock.forked(), which takes the slots that carry it and holds its process to them.
# Every figure is MiB.
#
# This file SEEDS the lock's own copy, runslots/mem.cfg beside tareplay.lock in the common git
# directory, as tools/runlock-vram.cfg seeds runslots/vram.cfg: the first run that needs the figure
# writes it from its tree's file, and every run reads the lock's, whatever its tree's says. A change
# here reaches the runs only once that copy is edited or removed.
#
# reserve_mib: what the runs leave to everything the lock does not admit -- the owner's own programs,
# the agent sessions, the kernel. On the reference setup's 63 437 MiB those held about 13 GiB beside one
# four-slot run (MEASURED 2026-11-14, 20:15); 20 GiB leaves them 7 GiB to grow. A slot then carries
# 1534 MiB, a game lane's two slots 3068 MiB.
reserve_mib = 20480
