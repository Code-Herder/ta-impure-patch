<title>ImpAI Thought Viewer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one instrument, read top to bottom. The flight recorder spans the width (time needs it), the sentence
   for the moment sits under its cursor, and the war room below shows that moment on the map beside its figures.
   Dark first: it stands beside a game. Gunmetal neutrals and a warm-steel accent, the replay HUD's look. */
:root {
  --bg:#121518; --panel:#1a1e22; --panel2:#21262b; --line:#323a41; --fg:#dde1e4; --muted:#8d969e;
  --steel:#c9a46a; --steel-ink:#1b1608; --cyan:#68b6cf;
  --map:#0d1012; --grid:#232a30; --truth:#aeb7bf;
  --t-form:#8794a0; --t-defend:#5bb071; --t-raid:#e3a63b; --t-attack:#e05a52; --t-retreat:#a77ddb; --t-scout:#4fb8dd;
  --j-build:#c9a46a; --j-assist:#d8cf73; --j-reclaim:#6cc48a; --j-none:#6c757d;
  --enemy:#ff6b5e; --radar:#f2d45c; --ghost:#9aa3ab; --held:#c9a46a;
  --good:#5bb071; --warn:#e3a63b; --bad:#e05a52; --info:#68b6cf;
  --font-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg:#eceef0; --panel:#ffffff; --panel2:#f3f4f6; --line:#cfd4d8; --fg:#1a1e22; --muted:#5b646c;
  --steel:#8a6424; --steel-ink:#fff8ea; --cyan:#1f7896;
  --map:#f7f8f9; --grid:#dfe3e6; --truth:#59626a;
  --t-form:#6b7884; --t-defend:#2f8a49; --t-raid:#b77908; --t-attack:#c23a32; --t-retreat:#7a4fb6; --t-scout:#1f88b0;
  --j-build:#8a6424; --j-assist:#8f841a; --j-reclaim:#2f8a49; --j-none:#7b848c;
  --enemy:#d0362a; --radar:#a88a00; --ghost:#6b737a; --held:#8a6424;
  --good:#2f8a49; --warn:#b77908; --bad:#c23a32; --info:#1f7896; color-scheme: light; } }
:root[data-theme="light"] {
  --bg:#eceef0; --panel:#ffffff; --panel2:#f3f4f6; --line:#cfd4d8; --fg:#1a1e22; --muted:#5b646c;
  --steel:#8a6424; --steel-ink:#fff8ea; --cyan:#1f7896;
  --map:#f7f8f9; --grid:#dfe3e6; --truth:#59626a;
  --t-form:#6b7884; --t-defend:#2f8a49; --t-raid:#b77908; --t-attack:#c23a32; --t-retreat:#7a4fb6; --t-scout:#1f88b0;
  --j-build:#8a6424; --j-assist:#8f841a; --j-reclaim:#2f8a49; --j-none:#7b848c;
  --enemy:#d0362a; --radar:#a88a00; --ghost:#6b737a; --held:#8a6424;
  --good:#2f8a49; --warn:#b77908; --bad:#c23a32; --info:#1f7896; color-scheme: light; }
* { box-sizing:border-box }
[hidden] { display:none !important }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 var(--font-body);
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:18px 56px }
main { display:grid; grid-template-columns:minmax(0,1fr); gap:14px; max-width:1680px; margin-inline:auto }
h1, h2 { font-family:var(--font-display); letter-spacing:.02em; margin:0; text-wrap:balance }
h1 { font-size:clamp(26px,3.2vw,36px); font-weight:700; line-height:1.05 }
h2 { font-size:21px; font-weight:600; line-height:1.1 }
h3 { margin:0; font:600 12px/1.2 var(--font-mono); letter-spacing:.06em; color:var(--muted) }
p { margin:0 }
.muted { color:var(--muted) }
.tnum { font-family:var(--font-mono); font-variant-numeric:tabular-nums }
header.top { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:end; justify-content:space-between }
header.top > div { display:grid; grid-template-columns:minmax(0,1fr); gap:6px; min-width:0 }
.chips { display:flex; flex-wrap:wrap; gap:6px }
.chip { font:500 12px/1 var(--font-mono); padding:6px 8px; border:1px solid var(--line); border-radius:4px; background:var(--panel) }
.chip.win { border-color:var(--steel); color:var(--steel) }
select, .btn { font:600 13px/1 var(--font-mono); background:var(--panel2); color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:8px 10px }
.btn { cursor:pointer; white-space:nowrap }
.btn:hover { border-color:var(--steel) }
.btn[aria-pressed="true"] { background:var(--steel); color:var(--steel-ink); border-color:var(--steel) }
select { max-width:100%; min-width:0; text-overflow:ellipsis }
:focus-visible { outline:2px solid var(--cyan); outline-offset:2px }
.pane { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:12px; display:grid; gap:10px; min-width:0 }
.panehead { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:baseline; justify-content:space-between }
.transport { display:flex; flex-wrap:wrap; gap:8px; align-items:center }
.transport input[type=range] { flex:1 1 180px; min-width:0; accent-color:var(--steel) }
canvas { display:block; max-width:100% }
#rec { width:100%; touch-action:pan-y; cursor:crosshair; border-radius:4px }
.readout { font:12.5px/1.45 var(--font-mono); color:var(--muted); min-height:2.9em; overflow-wrap:anywhere }
.legend { display:flex; flex-wrap:wrap; gap:5px 14px; font-size:12px; color:var(--muted) }
.legend span { white-space:nowrap }
.sw { display:inline-block; width:10px; height:10px; border-radius:2px; vertical-align:-1px; margin-right:5px }
.sw.ring { background:transparent; border:2px solid; border-radius:50% }
.sw.hollow { background:transparent; border:1.5px dashed }
/* the sentence for the moment: the joint between the two halves */
.now { border-left:4px solid var(--steel); background:var(--panel); border-radius:0 6px 6px 0; padding:10px 12px; display:grid;
  grid-template-columns:auto minmax(0,1fr) auto; gap:6px 14px; align-items:start }
.now .when { font:700 30px/1 var(--font-display); letter-spacing:.02em; white-space:nowrap }
.now .when small { display:block; font:500 12px/1.3 var(--font-mono); color:var(--muted); letter-spacing:0 }
.now p { font:14px/1.5 var(--font-mono); overflow-wrap:anywhere; user-select:text }
@media (max-width:640px) { .now { grid-template-columns:1fr auto } .now p { grid-column:1 / -1 } }
.bench { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr); gap:14px; align-items:start }
@media (max-width:980px) { .bench { grid-template-columns:1fr } }
.mapwrap { position:relative; display:grid; justify-items:center; background:var(--map); border-radius:4px; overflow:hidden }
#map { cursor:pointer }
.tip { position:absolute; z-index:3; pointer-events:none; max-width:min(300px,80%); background:var(--panel2); color:var(--fg);
  border:1px solid var(--line); border-radius:4px; padding:5px 7px; font:12px/1.4 var(--font-mono) }
.ctl { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; font-size:13px }
.ctl label { display:flex; gap:5px; align-items:center; cursor:pointer; white-space:nowrap }
.ctl input { accent-color:var(--steel) }
.pills { display:flex; flex-wrap:wrap; gap:6px }
.pill { font:600 11px/1 var(--font-mono); padding:5px 7px; border-radius:3px; border:1px solid var(--line); color:var(--muted) }
.pill.on { color:var(--bg); background:var(--tone, var(--warn)); border-color:var(--tone, var(--warn)) }
.scroll-x { overflow-x:auto; min-width:0 }
table.mini { width:100%; border-collapse:collapse; font-size:12.5px }
table.mini td, table.mini th { padding:4px 6px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top }
table.mini th { font:600 10.5px/1.2 var(--font-mono); letter-spacing:.06em; color:var(--muted) }
table.mini td.r, table.mini th.r { text-align:right }
table.mini tr.pick { cursor:pointer }
table.mini tr.pick:hover td { background:var(--panel2) }
table.mini tr.sel td { background:color-mix(in srgb, var(--steel) 20%, transparent) }
.side { display:grid; gap:14px; min-width:0 }
.side section { display:grid; gap:7px; min-width:0 }
.side p { font-size:13px }
.foot { font-size:12.5px; color:var(--muted); max-width:95ch }
.gist { font:14px/1.5 var(--font-body); max-width:120ch }
.gist b { font-weight:600; color:var(--steel) }
.err { border:1px solid var(--bad); color:var(--bad); border-radius:6px; padding:12px; font:13px var(--font-mono) }
</style>

<main>
  <header class="top">
    <div>
      <h1>ImpAI Thought Viewer</h1>
      <p class="muted">What the seat held in mind through one recorded game: the whole game in time above, that moment on the map below.</p>
    </div>
    <div>
      <label class="muted" for="pick" style="font-size:12px">Recording</label>
      <select id="pick"></select>
    </div>
  </header>
  <div class="chips" id="chips"></div>
  <p class="gist" id="gist"></p>
  <div class="err" id="err" hidden></div>

  <section class="pane" aria-label="Flight recorder">
    <div class="panehead">
      <h2>Flight recorder</h2>
      <div class="transport">
        <button class="btn" id="prev" title="The decision before (left arrow)">◀ decision</button>
        <button class="btn" id="play" aria-pressed="false" title="Play or pause (space)">Play</button>
        <button class="btn" id="next" title="The next decision (right arrow)">decision ▶</button>
        <select id="speed" aria-label="Playing speed">
          <option value="300">10× game speed</option><option value="900" selected>30×</option><option value="2700">90×</option>
        </select>
      </div>
    </div>
    <canvas id="rec" tabindex="0" aria-label="The game on one time axis: events, judgements, a lane a squad, curves. Drag to set the moment."></canvas>
    <input type="range" id="scrub" min="0" max="1" value="0" step="1" aria-label="Game tick">
    <p class="readout" id="hover"></p>
    <div class="legend" id="reclegend"></div>
  </section>

  <div class="now" aria-live="off">
    <div class="when"><span id="nowtick" class="tnum">0</span><small id="nowclock"></small></div>
    <p id="nowtext"></p>
    <button class="btn" id="copy">Copy</button>
  </div>

  <div class="bench">
    <section class="pane" aria-label="War room">
      <div class="panehead">
        <h2>War room</h2>
        <div class="ctl" id="layers"></div>
      </div>
      <div class="mapwrap" id="mapwrap"><canvas id="map" aria-label="The seat's picture of the map at the moment"></canvas><div class="tip" id="tip" hidden></div></div>
      <div class="legend" id="maplegend"></div>
      <p class="foot" id="sampled"></p>
    </section>
    <aside class="pane side" id="side" aria-label="The seat's figures at the moment"></aside>
  </div>

  <p class="foot" id="foot"></p>
</main>

<script>
/* THE DATA is thinkview.py's (build): a recording's file calls thinkviewData(id, data). Exact at every tick:
   `tracks` {field: [[tick...], [value...]]}, `lanes`, `judgements`, `events`, `episodes`, `known`. Sampled:
   `frames` [{t, m: [life, x, z, ...], j: [slot, kind, build, cx, cz, squad, target, ...], k: [slot, type, how,
   owner, bx, bz, ...], h: index into helds, a: units alive a seat, i: metal income a seat}], with `lives`
   [[slot, type, born, gone, structure, x, z, complete], ...]. Places: blocks x units.block px, cells x units.cell. */
const MANIFEST = /*MANIFEST*/[];
const $ = id => document.getElementById(id);
const cache = {}, waiting = {};
let D = null, T = 0, SEL = -1, playing = 0, HOVER = null;
const LAYERS = { truth: true, held: true, jobs: true, trails: true, labels: true };
const TASKVAR = { FORM: 't-form', DEFEND: 't-defend', RAID: 't-raid', ATTACK: 't-attack', RETREAT: 't-retreat', SCOUT: 't-scout' };
const JOBVAR = { BUILD: 'j-build', ASSIST: 'j-assist', RECLAIM: 'j-reclaim', RECLAIM_GO: 'j-reclaim' };
const EVENTS_SHOWN = { plant: ['steel', 'a plant sited'], wave: ['t-attack', 'an attack wave starts'], lost: ['t-retreat', 'a prediction lost'],
  contact: ['enemy', 'first enemy known'], sight: ['enemy', 'an enemy comes into sight'], cmdr: ['enemy', 'a commander seen'], judge: ['muted', 'a judgement changes'] };
const SEATVAR = ['steel', 'enemy', 'cyan', 't-defend', 't-retreat', 'radar'];
const C = {};
const MONO = '"IBM Plex Mono", ui-monospace, Menlo, monospace', DISPLAY = '"Saira Condensed", "Arial Narrow", sans-serif';

function colors() {
  const cs = getComputedStyle(document.documentElement);
  for (const k of ['bg', 'panel', 'panel2', 'line', 'fg', 'muted', 'steel', 'steel-ink', 'cyan', 'map', 'grid', 'truth', 't-form', 't-defend', 't-raid',
    't-attack', 't-retreat', 't-scout', 'j-build', 'j-assist', 'j-reclaim', 'j-none', 'enemy', 'radar', 'ghost', 'held', 'good', 'warn', 'bad', 'info'])
    C[k] = cs.getPropertyValue('--' + k).trim();
}
const fmt = n => Math.round(n).toLocaleString('en-US').replace(/,/g, ' ');
const clock = t => `${Math.floor(t / 1800)}:${String(Math.floor(t / 30) % 60).padStart(2, '0')}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

/* a track's value at tick t: its last change at or before t; a field never written reads 0 */
function at(tr, t, d = 0) {
  if (!tr) return d;
  const a = tr[0]; let lo = 0, hi = a.length;
  while (lo < hi) { const m = (lo + hi) >> 1; if (a[m] <= t) lo = m + 1; else hi = m; }
  return lo ? tr[1][lo - 1] : d;
}
const TR = name => D.tracks[name];
const NONE = () => D.macros.WQ_NONE ?? 65535;
const nm = t => (t === NONE() || t == null) ? 'unidentified' : (D.names[t] || `type ${t}`);
const seatOf = slot => slot >= 1 && D.each > 0 ? Math.floor((slot - 1) / D.each) : -1;
const seatName = s => { const p = D.players.find(p => p.index === s); return p ? p.name : `seat ${s}`; };
const blockPx = b => b * D.units.block + D.units.block / 2;
const taskName = v => (D.enums['mil.sq.task'] || {})[v] || String(v);
const layerName = v => ((D.enums['mil.sq.layer'] || {})[v] || String(v)).toLowerCase();
const jobName = v => (D.enums['job.kind'] || {})[v] || String(v);

function prepare(d) {
  d.structs = []; d.bySlot = new Map();
  d.lives.forEach((l, i) => { if (l[4]) d.structs.push(i); if (!d.bySlot.has(l[0])) d.bySlot.set(l[0], []); d.bySlot.get(l[0]).push(i); });
  d.lost = new Set((d.tracks['mil.lost_t'] || [[]])[0]);
  d.shown = d.events.filter(e => EVENTS_SHOWN[e[1]]);
  d.legs = d.events.filter(e => e[1] === 'leg');
  // the rows of the commanders' memory and of the given-up goals that were ever written
  const rowsOf = name => Object.keys(d.tracks).map(k => k.match(new RegExp(`^mil\\.${name}\\[(\\d+)\\]\\.t$`))).filter(Boolean).map(m => +m[1]);
  d.foes = rowsOf('foe'); d.unreached = rowsOf('unreached');
  d.seatCol = {}; let other = 1;
  for (const s of d.seats) d.seatCol[s] = s === d.seat ? SEATVAR[0] : SEATVAR[1 + (other++ - 1) % (SEATVAR.length - 1)];
  return d;
}
function frameIndex(t) { const f = D.frames; let lo = 0, hi = f.length - 1; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (f[m].t <= t) lo = m; else hi = m - 1; } return lo; }
/* the life a slot holds at tick t: the unit there, or the last that was */
function lifeAt(slot, t) { const ls = D.bySlot.get(slot); if (!ls) return null; let best = null; for (const i of ls) if (D.lives[i][2] <= t) best = i; return best == null ? null : D.lives[best]; }
const alive = (l, t) => l[2] <= t && (l[3] == null || l[3] > t);
/* a sample's units by slot: [x, z, life] in px, the structures standing at its tick included */
function units(f) {
  if (f._u) return f._u;
  const u = new Map();
  for (let i = 0; i < f.m.length; i += 3) { const l = D.lives[f.m[i]]; u.set(l[0], [f.m[i + 1], f.m[i + 2], l]); }
  for (const i of D.structs) { const l = D.lives[i]; if (alive(l, f.t)) u.set(l[0], [l[5], l[6], l]); }
  return (f._u = u);
}
function jobs(f) {
  if (f._j) return f._j;
  const out = [];
  for (let i = 0; i < f.j.length; i += 7) out.push({ slot: f.j[i], kind: jobName(f.j[i + 1]), build: f.j[i + 2], cx: f.j[i + 3], cz: f.j[i + 4], squad: f.j[i + 5], target: f.j[i + 6] });
  return (f._j = out);
}
function knownRows(f) {
  if (f._k) return f._k;
  const m = D.macros, out = [];
  for (let i = 0; i < f.k.length; i += 6) {
    const how = f.k[i + 2];
    const cls = how & ((m.IMPAI_LOS || 0) | (m.IMPAI_SHARED || 0)) ? 'now' : how & (m.IMPAI_GHOST || 0) ? 'ghost' : 'pass';
    out.push({ slot: f.k[i], type: f.k[i + 1], how, cls, owner: f.k[i + 3], bx: f.k[i + 4], bz: f.k[i + 5] });
  }
  return (f._k = out);
}
const HOWSAYS = { now: 'in sight', pass: 'a radar contact', ghost: 'remembered' };
/* a squad's members in a sample, and their centre */
function members(f, k) {
  f._m = f._m || {};
  if (f._m[k]) return f._m[k];
  const u = units(f), list = []; let x = 0, z = 0;
  for (const j of jobs(f)) if (j.kind === 'SQUAD' && j.squad === k) { const p = u.get(j.slot); if (p) { list.push(p); x += p[0]; z += p[1]; } }
  return (f._m[k] = { list, x: list.length ? x / list.length : null, z: list.length ? z / list.length : null });
}
function typesOf(list) {
  const n = {}; for (const p of list) { const t = nm(p[2][1]); n[t] = (n[t] || 0) + 1; }
  return Object.entries(n).map(([t, c]) => `${c} ${t}`).join(', ');
}
/* a squad's state at tick t, exact, with the task's span and episode */
function squadAt(k, t) {
  const g = m => at(TR(`mil.sq[${k}].${m}`), t);
  const lane = D.lanes.find(l => l.k === k);
  const span = lane && lane.spans.find(s => s[0] <= t && t < s[1]) || (lane && t >= D.end ? lane.spans.find(s => s[1] === D.end && s[0] <= t) : null);
  const task = taskName(g('task'));
  return { k, task, free: task === 'FREE', layer: layerName(g('layer')), n: g('n'), tx: g('tx'), tz: g('tz'), target: g('target'), since: g('since'),
    value: g('value'), ep: span ? D.episodes[span[3]] : null };
}
const squadsAt = t => D.lanes.map(l => squadAt(l.k, t)).filter(s => !s.free);
function goalOf(s, f) {
  if (s.target === NONE() && !(s.tx || s.tz)) return '';
  let what = '';
  if (s.target !== NONE()) { const row = knownRows(f).find(r => r.slot === s.target); what = row && row.type !== NONE() ? `the ${nm(row.type)} at ` : `slot ${s.target} at `; }
  return `goal ${what}(${s.tx},${s.tz})`;
}

/* ---------- the sentence for the moment ---------- */
function nowText() {
  const f = D.frames[frameIndex(T)], sq = squadsAt(T), parts = [];
  if (!sq.length) parts.push(T < (D.lanes.reduce((a, l) => Math.min(a, l.spans[0][0]), Infinity)) ? 'no squad yet' : 'no squad holds a task');
  for (const s of sq) {
    const mem = members(f, s.k).list;
    let line = `sq[${s.k}] ${s.task} ${s.layer}, ${mem.length ? typesOf(mem) : plural(s.n, 'unit')}`;
    const goal = goalOf(s, f); if (goal) line += `, ${goal}`;
    if (s.task === 'RETREAT' && s.ep && D.lost.has(s.ep.from)) line += ', on a lost prediction';
    parts.push(line);
  }
  const rows = knownRows(f);
  let enemy;
  if (!rows.length) enemy = 'no enemy known';
  else {
    const by = { now: 0, pass: 0, ghost: 0 }; rows.forEach(r => by[r.cls]++);
    enemy = rows.length <= 4 ? 'enemy known: ' + rows.map(r => `${nm(r.type)} ${HOWSAYS[r.cls]} at (${r.bx},${r.bz})`).join(', ')
      : `${rows.length} enemy rows known: ${by.now} in sight, ${by.pass} on radar, ${by.ghost} remembered`;
    const mobile = rows.some(r => { if (r.type === NONE()) return true; const l = lifeAt(r.slot, f.t); return !l || !l[4]; });
    if (!mobile) enemy += '; no enemy mobile known';
  }
  const judged = [];
  for (const j of D.judgements) { const s = j.spans.find(s => s[0] <= T && T < s[1]) || (T >= D.end ? j.spans.find(s => s[1] === D.end) : null); if (s && j.id !== 'estimate' && s[3] !== 'muted') judged.push(j.label); }
  const est = estimateAt(T);
  if (est) judged.push(`enemy base ${est.says} at (${est.bx},${est.bz})`);
  // between two samples the members and the enemy rows are the earlier sample's: the sentence says so

function play(on) {

  if (!on) return;

/* the game in one line: when the seat first went out and with how much, how large its army got, how its

function gist() {
  const si = D.seats.indexOf(D.seat), out = [];

  out.push(first ? `First ${first.task === 'RAID' ? 'raid' : 'attack'} at tick <b>${fmt(first.from)}</b> (${clock(first.from)}) with <b>${plural(first.n[1], 'unit')}</b>.` : 'No attack and no raid in the whole game.');
  const ts = [...new Set(D.lanes.flatMap(l => (TR(`mil.sq[${l.k}].n`) || [[]])[0].concat((TR(`mil.sq[${l.k}].task`) || [[]])[0])))].filter(t => t <= D.end).sort((a, b) => a - b);
  const held = {}, since = {}; ts.forEach((t, i) => { const n = armyAt(t), d = (ts[i + 1] ?? D.end) - t; for (let v = 1; v <= n; v++) { held[v] = (held[v] || 0) + d; since[v] = since[v] ?? t; } });
  let peak = 0; for (const v in held) if (held[v] >= 300 && +v > peak) peak = +v;

  const back = D.episodes.filter(e => e.task === 'RETREAT' && e.from <= D.end), lost = back.filter(e => D.lost.has(e.from)).length;
