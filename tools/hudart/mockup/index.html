<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Replay HUD mockup</title>
<!-- The replay HUD drawn from art/hud/: layout.json, kit.json and the parts. Serve the repository root over HTTP
     (python3 -m http.server -d <repo>) and open /tools/hudart/mockup/. research/notes/hud-layout.md says how. -->
<!-- The faces the game draws with, the files in art/hud/fonts/: a glyph they lack is missing here as it is in game. -->
<style>
@font-face { font-family: 'Oswald'; font-weight: 500; src: url('../../../art/hud/fonts/oswald-500.ttf'); }
@font-face { font-family: 'Oswald'; font-weight: 700; src: url('../../../art/hud/fonts/oswald-700.ttf'); }
@font-face { font-family: 'Barlow Condensed'; font-weight: 600; src: url('../../../art/hud/fonts/barlowcondensed-600.ttf'); }
</style>
<link rel="stylesheet" href="hud.css">
<style>
:root { --bg: #111310; --fg: #d8d8c8; --muted: #8f9384; --line: #34372e; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, sans-serif; padding: 12px 16px 40px; }
header { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin-bottom: 10px; }
header h1 { font-size: 16px; margin: 0 8px 0 0; font-weight: 600; }
header label { display: flex; gap: 6px; align-items: center; color: var(--muted); }
select { background: #1c1e19; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; font: inherit; }
.wrap { max-width: 100%; overflow: auto; border: 1px solid var(--line); background: #000; }
.stage { --u: 1px; position: relative; overflow: hidden; user-select: none; -webkit-user-select: none; }
.stage .bg { position: absolute; inset: 0; width: 100%; height: 100%; background: #000; }
p.note { color: var(--muted); max-width: 80ch; }
.err { color: #ff8a6a; }
</style>
</head>
<body>
<header>
  <h1>Replay HUD mockup</h1>
  <label>Screen <select id="res"><option value="fit">fit the window</option><option>1920x1080</option><option>2560x1440</option><option>3840x2160</option></select></label>
  <label>Game HUD <select id="game"><option value="-1">off</option><option value="0">auto</option><option value="100">100%</option><option value="150">150%</option><option value="200">200%</option><option value="300">300%</option><option value="400">400%</option></select></label>
  <label>Replay HUD <select id="hud"><option value="0.75">75%</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option></select></label>
  <label>Players <select id="np"></select></label>
  <label>Teams <select id="nt"><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
</header>
<div class="wrap" id="wrap"><div class="stage" id="stage"><canvas class="bg" id="bg"></canvas><div class="hud" id="hud-layer"></div></div></div>
<p class="note">Every size, position and style here comes from <code>art/hud/layout.json</code> and the parts in <code>art/hud/</code>;
this page only supplies a game to show. Hover a player row for its actions; drag the timeline to seek and the window by its title.
The numbers are synthetic.</p>
<script src="hud.js"></script>
<script>
const $ = s => document.querySelector(s);
const stage = $('#stage'), layer = $('#hud-layer');

/* ---- a synthetic game: 132 seconds, up to 16 players, the second half of the seats losing their commanders in turn ---- */
const T = 132, SPEEDS = [0.5, 1, 2, 4, 8], UI_STEPS = [0.75, 1, 1.25, 1.5];
const NAMES = ['Fang', 'Kesh', 'Moro', 'Vex', 'Nyx', 'Ash', 'Rook', 'Sable', 'Flint', 'Vale', 'Iris', 'Dax', 'Orin', 'Hex', 'Lark', 'Juno'];
// stand-ins for TA's player colours; the chart's team colours and its measures are layout.json's
const SEAT_COL = ['#233bcb', '#d32b00', '#fbfbfb', '#2f771b', '#7a3fb0', '#e8d200', '#2a2a2a', '#e07018', '#6fb6e8', '#7a5230',
  '#e070b0', '#18a090', '#8a8a20', '#8a8a8a', '#701c1c', '#9ae040'];

// the four overlay switches are on whenever a replay starts, and never saved; the stats window is closed whenever a
// replay starts, and keeps its measure, its split and its place
const S = { t: 70, playing: true, speed: 1, hud: 1, game: 150, res: 'fit', np: 10, nt: 2, fold: [], bm: [40], stat: false, sm: 'units', ss: 'player', sw: null,
  ov: { cursors: true, clicks: true, selections: true, chat: true }, sight: -1, follow: -1, scroll: 0, toast: '' };
try { const o = JSON.parse(localStorage.getItem('hud-mockup') || '{}'); delete o.stat; Object.assign(S, o); } catch (e) {}
const save = () => { try { localStorage.setItem('hud-mockup', JSON.stringify({ hud: S.hud, game: S.game, res: S.res, np: S.np, nt: S.nt, sm: S.sm, ss: S.ss, sw: S.sw })); } catch (e) {} };
{ const q = new URLSearchParams(location.search);   // screenshot switches: res=3840x2160&game=150&hud=150&np=10&nt=2&t=70&paused,
  // and scroll=<first item>, sight=<seat>, follow=<seat>, toast=<text>, stat=1, sm=<measure>, ss=<player|team>, sx=<x>&sy=<y> (the window's place)
  if (q.has('paused')) S.playing = false; if (q.get('res')) S.res = q.get('res'); if (q.get('hud')) S.hud = +q.get('hud') / 100;
  if (q.get('game')) S.game = { off: -1, auto: 0 }[q.get('game')] ?? +q.get('game');
  for (const k of ['np', 'nt', 't', 'scroll', 'sight', 'follow']) if (q.get(k)) S[k] = +q.get(k); for (const k of ['sm', 'ss', 'toast']) if (q.get(k)) S[k] = q.get(k);
  if (q.has('stat')) S.stat = q.get('stat') !== '0';
  if (q.has('sx')) S.sw = { x: +q.get('sx'), y: +(q.get('sy') || 0) }; }

/* ---- the game's own state: state=<url> loads what the game dumped (tagpu_replayhud.dump, tagpu_hudstate.c) -- the screen,
   the engine frame's scale and the HUD's state in units -- and draws that instead of the made-up game below, still ---- */
let GAME = null;
const GAME_URL = new URLSearchParams(location.search).get('state');

function seats() {
  const N = S.np, lost = [...Array(N).keys()].filter(i => i > 0 && (i * 7) % 10 >= 5);
  return [...Array(N).keys()].map(i => {
    const r = lost.indexOf(i), l = r >= 0, units = l ? 20 + (i * 7) % 30 : 420 - 23 * i + (i * 37) % 50;
    const mf = Math.min(1, units / 470), ef = Math.min(1, units / 420 + .08), mmax = 1000 * (2 + Math.round(units / 28)), emax = 4000 * (1 + Math.round(units / 30));
    // only the first seat's camera was recorded, as in a skirmish where the others are AI
    return { i, name: NAMES[i % 16], colour: SEAT_COL[i % SEAT_COL.length], units, lost: l, death: l ? 50 + r * 70 / Math.max(1, lost.length) : null, out: l && r % 2 === 0, cam: i === 0,
      res: { m: Math.round(mf * mmax * .7 / 10) * 10, mmax, e: Math.round(ef * emax * .66 / 10) * 10, emax,
             mi: Math.round(40 + mf * 90), mo: Math.round(20 + mf * 60), ei: Math.round(300 + ef * 600), eo: Math.round(150 + ef * 500) } };
  });
}
const teams = () => { const N = S.np, k = Math.max(1, Math.min(S.nt, N)); return [...Array(k)].map((_, t) => [...Array(N).keys()].filter(i => Math.floor(i * k / N) === t)); };

// the stats window's series: 67 samples per player over the game
const NS = 67, DT = T / (NS - 1), frac = x => x - Math.floor(x);
const nz = (i, k, s) => frac(Math.sin(i * 12.9898 + k * 78.233 + s * 37.719) * 43758.5453) - .5;
const wob = (i, k, s) => { const a = Math.floor(k / 5), f = k / 5 - a, g = f * f * (3 - 2 * f); return nz(i, a, s) * (1 - g) + nz(i, a + 1, s) * g; };
const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
function series(k, ps) {
  return ps.map(p => {
    const i = p.i, a = p.lost ? .55 + .3 * frac(i * .37) : Math.min(1.5, .55 + p.units / 450), td = p.lost ? p.death : Infinity;
    const peak = p.lost ? 110 + (i * 37) % 90 : p.units * 1.15, waste = .04 + .3 * frac(i * .61);
    let kills = 0, loss = 0, ex = 0; const v = [];
    for (let s = 0; s < NS; s++) {
      const t = s * DT, eco = sstep(0, .55 * T, t), dead = t >= td, fade = dead ? (p.out ? Math.exp(-(t - td) / 6) : .2 + .8 * Math.exp(-(t - td) / 6)) : 1;
      const m = Math.max(0, (3 + 44 * a * eco + 6 * wob(i, s, 1)) * fade), e = Math.max(0, (25 + 640 * a * Math.pow(eco, .8) + 70 * wob(i, s, 2)) * fade);
      let u = peak * sstep(0, .62 * T, t) + 14 * wob(i, s, 3) * eco;
      if (!p.lost) u += (p.units - peak) * sstep(.62 * T, T, t);
      else if (dead) u = p.out ? u * Math.exp(-(t - td) / 4) : p.units + (u - p.units) * Math.exp(-(t - td) / 5);
      u = Math.max(0, u);
      const fight = sstep(.25 * T, .5 * T, t) * (dead && p.out ? 0 : 1);
      kills += fight * Math.max(0, .9 * a + 1.4 * nz(i, s, 4));
      loss += fight * Math.max(0, .9 / a + 1.4 * nz(i, s, 5)) + (dead && t - td < DT ? peak * .3 : 0);
      ex += m * DT * waste * sstep(.15 * T, .4 * T, t) * (1 - .7 * sstep(.7 * T, T, t));
      v.push({ metal: m, energy: e, units: u, army: u * (60 + 140 * eco), kills, losses: loss, excess: ex }[k]);
    }
    return { name: p.name, col: p.colour, v, death: p.lost ? p.death : null };
  });
}

/* ---- the engine's own frame, as the game lays it out: tagpu_hud_geom (tagpu_hud.c) at the Game HUD setting ----
   The side panel is 128 engine pixels wide and the bars 32 tall, magnified by q8 / 256: 1 when the setting is off, the
   setting's percentage otherwise, never past the ceiling (480 panel rows in the screen's height, 256 pixels of view left
   beside the panel), and Auto is the ceiling. In device pixels. */
function engineFrame(W, H, pct) {
  let q = GAME ? GAME.q8 : 256;
  if (!GAME && pct >= 0) {
    const cap = Math.max(256, Math.min(Math.floor(H * 256 / 480), Math.floor((W - 256) * 256 / 128)));
    q = Math.min(cap, Math.max(256, pct === 0 ? cap : Math.floor(pct * 256 / 100)));
  }
  return { panel: (128 * q) >> 8, bar: (32 * q) >> 8, scale: q / 256 };
}
function device() { const d = window.devicePixelRatio || 1; return { W: Math.round(parseFloat(stage.style.width) * d), H: Math.round(parseFloat(stage.style.height) * d), d }; }

/* ---- the state hud.js draws: the screen and the engine's own frame in HUD units, then the game ---- */
function unit() { return parseFloat(stage.style.getPropertyValue('--u')) || 1; }
function state() {
  const u = unit(), w = parseFloat(stage.style.width), h = parseFloat(stage.style.height);
  const dv = device(), ef = engineFrame(dv.W, dv.H, S.game), ud = u * dv.d;
  const L = HUD.layout, MS = L.window.measures, TC = L.chart.teams;
  const ps = seats(), tm = teams(), m = MS.find(x => x.k === S.sm) || MS[0];
  // the samples are grouped by team only when the teams are told apart, as the teams chip is enabled (hud.js, headed)
  const byTeam = S.ss === 'team' && tm.length > 1 && tm.some(mm => mm.length > 1), pl = series(m.k, ps);
  const groups = byTeam ? tm.map((mm, t) => ({ name: `Team ${t + 1}`, col: TC[t % TC.length], death: null, v: pl[0].v.map((_, s) => mm.reduce((a, i) => a + pl[i].v[s], 0)) })) : pl;
  const markers = ps.filter(p => p.lost).flatMap(p => [{ t: p.death, kind: 'death', seat: p.i }, ...(p.out ? [{ t: p.death + 3, kind: 'defeat', seat: p.i }] : [])])
    .concat(S.bm.map(t => ({ t, kind: 'bookmark', seat: -1 })));
  const sw = S.sw || { x: L.window.x, y: L.window.y };
  // the game's dump carries its stats whole: the window, its measure and split, and the groups as the game drew them
  if (GAME) { const g = GAME.state;
    return { W: g.W, H: g.H, frame: g.frame, t: g.t, T: g.T, playing: g.playing, speed: g.speed, hud: g.hud, seats: g.seats, teams: g.teams,
      folded: g.folded, markers: g.markers, toggles: g.toggles, sight: g.sight, follow: g.follow, scroll: g.scroll, toast: g.toast,
      stats: g.stats }; }
  return { W: w / u, H: h / u, frame: { panel: ef.panel / ud, top: ef.bar / ud, bottom: ef.bar / ud },
    t: S.t, T, playing: S.playing, speed: S.speed, hud: S.hud, seats: ps, teams: tm, folded: S.fold, markers,
    sight: S.sight, follow: S.follow, scroll: S.scroll, toast: S.toast,
    toggles: { ...S.ov, stats: S.stat },
    stats: { open: S.stat, x: sw.x, y: sw.y, measure: m.k, split: byTeam ? 'team' : 'player', groups, dt: DT, t0: 0 } };
}
const px = () => unit() * (window.devicePixelRatio || 1);
function build() { HUD.draw(layer, state(), px()); }

/* ---- the backdrop: a 1280 x 720 replay frame from our renderer, whose own side panel is 128 pixels and bars 32, recut so that
   the panel and bars are drawn at the engine's magnification and the world fills what they leave. The bars' plain tile
   repeats out to the screen's right, as far as the screen is wide; the HUD only depends on where the frame ends. ---- */
const BD = new Image(); BD.src = '../../../research/notes/assets/hud-art/backdrop.png';
function backdrop() {
  const cv = $('#bg'), dv = device(), f = engineFrame(dv.W, dv.H, S.game), k = f.scale;
  if (!BD.complete || !BD.naturalWidth) { BD.onload = backdrop; return; }
  cv.width = dv.W; cv.height = dv.H;
  const g = cv.getContext('2d'); g.imageSmoothingEnabled = false; g.fillStyle = '#000'; g.fillRect(0, 0, dv.W, dv.H);
  const world = { x: f.panel, y: f.bar, w: dv.W - f.panel, h: dv.H - 2 * f.bar }, src = { x: 128, y: 32, w: 1152, h: 656 };
  const c = Math.max(world.w / src.w, world.h / src.h), sw = world.w / c, sh = world.h / c;
  g.drawImage(BD, src.x + (src.w - sw) / 2, src.y + (src.h - sh) / 2, sw, sh, world.x, world.y, world.w, world.h);
  const bar = (sy, y) => {
    g.drawImage(BD, 128, sy, 688, 32, f.panel, y, 688 * k, f.bar);                                      // the bar's content
    for (let x = f.panel + 688 * k; x < dv.W - 64 * k; x += 168 * k) g.drawImage(BD, 816, sy, 168, 32, x, y, 168 * k, f.bar);   // its plain tile
    g.drawImage(BD, 1216, sy, 64, 32, dv.W - 64 * k, y, 64 * k, f.bar);                                  // its right end
  };
  bar(0, 0); bar(688, dv.H - f.bar);
  g.fillStyle = '#000'; g.fillRect(0, 0, f.panel, dv.H);
  g.drawImage(BD, 0, 0, 128, 720, 0, 0, f.panel, 720 * k);
}

/* ---- the screen: a resolution, or the window's width at 16:9; one HUD unit is the screen height / 720 x the replay HUD's scale ---- */
function resize() {
  let w, h;
  if (S.res === 'fit') { w = $('#wrap').clientWidth; h = w * 9 / 16; const maxh = window.innerHeight - 120; if (h > maxh && maxh > 240) { h = maxh; w = h * 16 / 9; } }
  else { const [pw, ph] = S.res.split('x').map(Number), dpr = window.devicePixelRatio || 1; w = pw / dpr; h = ph / dpr; }
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
  stage.style.setProperty('--u', (h / 720 * S.hud) + 'px');
  backdrop(); build();
}

/* ---- input ---- */
function toast(msg) { S.toast = msg; clearTimeout(toast.h); toast.h = setTimeout(() => { S.toast = ''; build(); }, HUD.layout.toast.ms); }
let seek = null, drag = null;
function seekTo(tr, x) { const r = tr.getBoundingClientRect(), e = +tr.dataset.ends * unit(); S.t = Math.min(T, Math.max(0, (x - r.left - e) / (r.width - 2 * e) * T)); HUD.tick(layer, state()); }
layer.addEventListener('pointerdown', e => {
  const b = e.target.closest('.art.hot[data-down]');
  if (b && !b.dataset.on) { HUD.press(b, true); const up = () => { HUD.press(b, false); window.removeEventListener('pointerup', up); }; window.addEventListener('pointerup', up); }
  const tr = e.target.closest('[data-track]');
  if (tr) { seek = tr; tr.setPointerCapture(e.pointerId); seekTo(tr, e.clientX); return; }
  if (e.target.closest('[data-act="drag"]')) { const st = state().stats; drag = { x: e.clientX, y: e.clientY, ox: st.x, oy: st.y }; e.target.setPointerCapture(e.pointerId); }
});
layer.addEventListener('pointermove', e => {
  if (seek) seekTo(seek, e.clientX);
  if (drag) {
    const u = unit(), st = state(), W = HUD.layout.window, win = $('#statwin');
    S.sw = { x: Math.max(0, Math.min(st.W - W.w, drag.ox + (e.clientX - drag.x) / u)), y: Math.max(0, Math.min(st.H - W.h, drag.oy + (e.clientY - drag.y) / u)) };
    win.style.left = `calc(${S.sw.x} * var(--u))`; win.style.top = `calc(${S.sw.y} * var(--u))`;
  }
});
window.addEventListener('pointerup', () => { if (drag) save(); seek = drag = null; });
// the wheel over the column scrolls it an item a notch
layer.addEventListener('wheel', e => {
  const c = e.target.closest('[data-last]'); if (!c || !e.deltaY) return;
  e.preventDefault(); S.scroll = Math.max(0, Math.min(+c.dataset.last, +c.dataset.first + Math.sign(e.deltaY))); build();
}, { passive: false });
layer.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  switch (a.dataset.act) {
    case 'play': if (S.t >= T) S.t = 0; S.playing = !S.playing; break;
    case 'rew': S.t = Math.max(0, S.t - 10); break;
    case 'fwd': S.t = Math.min(T, S.t + 10); break;
    case 'speed': S.speed = SPEEDS[(SPEEDS.indexOf(S.speed) + 1) % SPEEDS.length]; break;
    case 'bookmark': { const near = S.bm.findIndex(t => Math.abs(t - S.t) < 3); if (near >= 0) S.bm.splice(near, 1); else S.bm.push(Math.round(S.t));
      toast(near >= 0 ? 'Bookmark removed' : `Bookmark at ${Math.floor(S.t / 60)}:${String(Math.round(S.t) % 60).padStart(2, '0')}`); break; }
    case 'uiscale': S.hud = UI_STEPS[(UI_STEPS.indexOf(S.hud) + 1) % UI_STEPS.length]; $('#hud').value = S.hud; save(); resize(); return;
    case 'leave': S.playing = false; toast('Leave this replay?'); break;
    case 'cursors': case 'clicks': case 'selections': case 'chat': S.ov[a.dataset.act] = !S.ov[a.dataset.act]; break;
    case 'stats': S.stat = !S.stat; break;
    case 'fold': { const t = +a.dataset.team; S.fold = S.fold.includes(t) ? S.fold.filter(x => x !== t) : S.fold.concat(t); break; }
    case 'jump': case 'follow': { const i = +a.dataset.seat;
      if (!state().seats[i].cam) toast('Camera was not recorded');
      else S.follow = a.dataset.act === 'jump' || S.follow === i ? -1 : i;   // a jump moves the camera once and ends a follow
      break; }
    case 'sight': { const i = +a.dataset.seat; S.sight = S.sight === i ? -1 : i; break; }
    case 'scroll_up': case 'scroll_down': { const c = a.closest('[data-last]');
      S.scroll = Math.max(0, Math.min(+c.dataset.last, +c.dataset.first + (a.dataset.act === 'scroll_up' ? -1 : 1))); break; }
    case 'close': S.stat = false; break;
    case 'chip': if (a.dataset.kind === 'measure') S.sm = a.dataset.val; else S.ss = a.dataset.val; save(); break;
  }
  build();
});

/* ---- playback ---- */
let last = performance.now(), lastTick = 0;
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (S.playing) { S.t += dt * S.speed; if (S.t >= T) { S.t = T; S.playing = false; build(); } else if (now - lastTick > 100) { lastTick = now; HUD.tick(layer, state()); } }
  requestAnimationFrame(frame);
}

/* ---- the toolbar ---- */
$('#np').innerHTML = [...Array(15)].map((_, i) => `<option>${i + 2}</option>`).join('');
for (const k of ['res', 'np', 'nt']) { $('#' + k).value = S[k]; $('#' + k).onchange = e => { S[k] = k === 'res' ? e.target.value : +e.target.value; if (k !== 'res') S.fold = []; save(); resize(); }; }
$('#hud').value = S.hud; $('#hud').onchange = e => { S.hud = +e.target.value; save(); resize(); };
$('#game').value = S.game; $('#game').onchange = e => { S.game = +e.target.value; save(); resize(); };
window.addEventListener('resize', resize);
document.addEventListener('keydown', e => { if (e.key === ' ' && e.target === document.body) { e.preventDefault(); S.playing = !S.playing; build(); } });
// the faces are loaded before the first layout, so no text is measured in a fallback
const FACES = ['500 10px Oswald', '700 10px Oswald', '600 10px "Barlow Condensed"'].map(f => document.fonts.load(f));
Promise.all([HUD.load('../../../art/hud/'), GAME_URL ? fetch(GAME_URL).then(r => r.json()) : null, ...FACES]).then(([, g]) => {
  if (g) { GAME = g; S.res = `${g.device.W}x${g.device.H}`; S.hud = g.state.hud; S.playing = false; }
  resize(); requestAnimationFrame(frame); })
  .catch(err => { layer.innerHTML = `<p class="err" style="padding:16px">Could not load art/hud/: ${err}. Serve the repository root over HTTP and open /tools/hudart/mockup/.</p>`; });
</script>
</body>
</html>
