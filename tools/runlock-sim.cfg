# The run lock's sim pool (tools/runlock.py, THE SIM POOL): places for the coarse simulator's batches,
# outside the 28 slots. At a batch's admission the pool holds the machine's threads less the engine slots
# held at that moment, never under floor nor over cap, less the places other batches hold. Each tree
# reads its own file when it takes a place; the places themselves, runslots/sim-NN, are the lock's, so
# every worktree shares one pool, and every place held is counted whatever the tree that took it.
#
# A coarse game is one process that keeps one thread busy and takes no GPU: 34-36 MB resident 10 s into
# a game (MEASURED 2026-11-20 on the reference setup).
#
# floor: 8, the owner's figure (2026-11-20): the places a batch can count on while the engine runs hold
# every slot. Its processes run at idle priority, so an engine game wins every contest for a CPU
# against them; what they still cost an engine game is the residual of THE SIM POOL (the sibling
# hardware thread of a shared core), which is why the floor is small.
floor = 8
#
# cap: 24, the owner's figure (2026-11-20): the most places at once, the reference setup's 32 threads
# less 8 left to the engine runs and to the work the lock does not see.
cap = 24
#
# pool_mib: 2048, the owner's figure (2026-11-20): the host memory the pool is charged, flat, out of the
# lock's reserve (runslots/mem.cfg), not slots' worth. Each process a batch starts for a place is held by
# RLIMIT_DATA to pool_mib // cap, 85 MiB.
# 85 MiB DOES NOT HOLD A COARSE GAME, and the figure that would is the owner's decision. RLIMIT_DATA counts
# private writable mappings, touched or not, and a game maps about 80 MiB at its map's load besides its
# heap (MEASURED 2026-11-20 on the reference setup, three bar-hota games -- coreprime-cc-1,
# redtriangle-ac-1, plainspasses-ac-1 -- to GameTime 12000: VmData 114, 119 and 127 MiB, sampled every
# 20 ms, against 30-33 MiB resident; one game sampled for 10 minutes of a game to 90000 held 119 MiB
# from its start to the end of the sampling). Under Workers.argv's bound each of the three fails at 85,
# 110, 118, 120, 124 and 126 MiB with exit 2, "coarse_run: the map's values do not load", and plays the
# same game as unbound (every figure of its JSON but `timing`) at 128, 136 and 160. So a place needs
# 128 MiB: pool_mib 3072 keeps the cap's 24 places, or this 2048 holds 16.
pool_mib = 2048
