# The slots one game lane takes of the run lock's budget, by the renderer its games draw with
# (tools/runlock.py, THE LANE WEIGHTS). A slot stands for one thread of load; a figure is a whole
# number of slots, 1 to the budget's 28: the whole lane's measured cost, rounded UP. Rounded to the
# nearest, a lane that costs 1.2 threads takes one slot, and the 28 slots then admit 28 lanes that
# want 34 threads of a machine that has 32: past the threads every runnable thread waits for a CPU,
# a lane's load grows with the wait (1.67 a lane at 21 lanes, below), and every run slows. Rounded
# up, the lanes the slots admit want no more threads than the slots stand for, and the load guard
# (tools/runlock-load.cfg) is left the work outside the lock. A weight decides only how many lanes a
# run's slots admit, never what the slots bound: the slots held never sum past the budget whatever
# the weights. These are this tree's figures: a lane's cost is its renderer's, and a tree whose
# renderer changes measures its own.
#
# A lane is everything its game makes run: the game, its prefix's wineserver and services, its
# Xvfb, and the harness that drives it.
#
# lane_slots_gdi: a lane that renders with GDI and takes no GPU memory -- every AI test tool's by
# default (bar.py, tourney.py, calib.py engine, eco_bench.py, handicap_check.py, econ_check.py,
# applysweep.py, the net checks), tareplay.py --gdi, a `runlock.py run --vram 0`.
# MEASURED 2026-11-13 23:05, the whole lane as the load guard sees it: every process that carries
# RUNLOCK_HELD -- Wine's processes and the ones it forks off inherit it, so the lane's wineserver,
# services and game count wherever they are reparented -- sampled every 0.5 s for 150 s, its threads
# in state R or D (what the load average averages) and its own CPU time. 3.3 lanes of bar.py and
# calib.py engine, the reference setup's CPU 11.6 threads of 32 busy: 1.13 runnable threads a lane
# (1.28 a game while its TotalA.exe lives), 1.06 threads of CPU a lane (1.21 a game). The game is
# nearly all of it (one game's TotalA.exe, sampled ten times, had a thread runnable at each and a
# second at one); the wineserver, Wine's services, Xvfb and the harness together 0.1 a lane. Two more figures
# bound it: calib.py engine's lane in a cgroup scope of its own, every process it starts counted,
# a mean of 1.39 threads and 1.54 at its peak over ten seconds (tools/lanecpu.py, MEASURED
# 2026-11-13, research/notes/modules/tasim-calibration.md, Speed); and 14 bar.py games' CPU over
# 30 s by process class, 1.16 a lane (MEASURED 2026-11-13 17:43).
# Past the threads the load per lane grows. MEASURED 2026-11-13 22:58 the same way, over two
# windows of 15 and 12 s: 21 lanes of three bar.py play runs at one slot a lane, the CPU 31.2 to
# 31.3 threads of 32 busy, the 1-minute load 65 to 69: 1.48 to 1.67 runnable threads a lane against
# 0.82 to 0.88 threads of CPU, the game waiting for a CPU the rest of the time; beside them 21 to 24
# runnable threads of work outside the lock. Five minutes before, 28
# lanes (all 28 slots) had taken the 1-minute load to 61. And about 12 GDI games fill the reference
# setup's 16 cores (MEASURED 2026-11-13 18:00-18:05: 16 bar.py games on 4 lanes and on 8 beside the
# bar's own pieces; at 12 games on the machine the CPU was 83 % busy, at 15.5 91.5 %, and the
# machine played about as many games a second either way).
# 1.54, the highest of the three figures taken below the threads, rounds up to 2: the budget's 28
# slots hold 14 GDI lanes.
lane_slots_gdi = 2
#
# lane_slots_vulkan: a lane that renders with Vulkan -- on the GPU, or on the CPU through llvmpipe
# (`modsscreen.py --software`, which takes no GPU memory and is charged this figure all the same).
# [INFERRED, not measured a lane as a whole]: a bar.py lane on `--gpu` costs what a GDI lane does,
# and the suites' lanes are bounded by load. Four bar.py games on `--gpu` (cap 6000, two lanes,
# MEASURED 2026-11-13 18:10) ran their TotalA.exe at 1.09-1.15 threads each over their lives, as
# the 17 GDI games beside them did (1.10 on average), so a bar game's render thread costs little;
# the rest of the lane is the GDI lane's 0.1 (above), so it rounds up to two as GDI's does. The
# landing gate at its default -j 12 peaks at a load of about 24 (MEASURED 2026-10-12), two threads
# a lane with the lane's share of the offline checks, which its offline workers now hold slots of
# their own for, so two a lane is an upper bound on the game's own. A 200v200 battle is heavier:
# tacompat's six battles held a load of 28 (MEASURED 2026-09-28), nearer five a lane. The suites'
# games -- the replay groups' battles, compat's setups, the wiki's scenes, at their own settings --
# have not been measured by their CPU, nor has an llvmpipe lane, which spreads its rasterising over
# the threads; tasim-calibration.md's Speed sets a GDI lane beside a Vulkan lane's 2.20 threads, a
# figure whose measurement is not written down, which would round up to three.
lane_slots_vulkan = 2
