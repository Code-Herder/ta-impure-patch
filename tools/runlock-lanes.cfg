# The slots one game lane takes of the run lock's budget, by the renderer its games draw with
# (tools/runlock.py, THE LANE WEIGHTS). A slot stands for one thread of load; a figure is a whole
# number of slots, 1 to the budget's 28, the lane's measured CPU rounded to the nearest. What the
# rounding leaves out is load the load guard reads (tools/runlock-load.cfg), so a weight decides
# only how many lanes a run's slots admit, never what the slots bound: the slots held never sum past
# the budget whatever the weights. These are this tree's figures: a lane's cost is its renderer's,
# and a tree whose renderer changes measures its own.
#
# A lane is everything its game makes run: the game, its prefix's wineserver and services, its
# Xvfb, and the harness that drives it.
#
# lane_slots_gdi: a lane that renders with GDI and takes no GPU memory -- every AI test tool's by
# default (bar.py, tourney.py, calib.py engine, eco_bench.py, handicap_check.py, econ_check.py,
# applysweep.py, the net checks), tareplay.py --gdi, a `runlock.py run --vram 0`.
# MEASURED 2026-11-13 17:43, 14 bar.py games on the reference setup (ImpAI against OTA AI, GDI, one
# lane a piece), the CPU time of every process over 30 s by class: the games 15.45 threads, Xvfb
# 0.29, wineservers 0.19, Wine's services 0.17, the harnesses 0.12 -- 16.22 threads, 1.16 a lane.
# Each game's TotalA.exe ran at 104-114 % of a thread. 1.16 rounds to 1.
# What a run gains, and what the machine does (MEASURED 2026-11-13 18:00-18:05, beside the bar's own
# GDI pieces): the same 16 games (cap 6000) as one piece on 4 lanes, what 8 slots held at two a lane,
# and on 8 lanes, what they hold at one. 4 lanes: 171 s first start to last end, 336 games an hour,
# 41 s a game; 12.0 games on the machine on average, the CPU 83 % busy, the 1-minute load 31.8 (peak
# 37.9). 8 lanes: 124 s, 465 games an hour (+38 %), 55 s a game (+33 %); 15.5 games on the machine,
# the CPU 91.5 % busy, the load 38.8 (peak 48.5). Every game on the machine slowed with the four more,
# so the machine played about as many games a second either way (12.0 / 41.4 s and 15.5 / 54.9 s):
# with about 12 GDI games the reference setup's 16 cores were full, and the run's gain was the other
# runs' share. A GDI game adds about 2 to the 1-minute load (7.0 more for 3.5 more games), not its
# 1.16 threads, so the load guard, which reads that load, holds GDI admissions near where the cores
# fill; the weight speeds a run up where the cores are not full.
lane_slots_gdi = 1
#
# lane_slots_vulkan: a lane that renders with Vulkan -- on the GPU, or on the CPU through llvmpipe
# (`modsscreen.py --software`, which takes no GPU memory and is charged this figure all the same).
# [INFERRED from load, not measured a lane]: the landing gate at its default -j 12 peaks at a load
# of about 24 (MEASURED 2026-10-12), two threads a lane with the lane's share of the offline
# checks, which its offline workers now hold slots of their own for, so two a lane is an upper
# bound on the game's own. A 200v200 battle is heavier: tacompat's six battles held a load of 28
# (MEASURED 2026-09-28), nearer five a lane. The one Vulkan lane measured by its CPU does not bear
# the two out: four bar.py games on `--gpu` (cap 6000, two lanes, 2026-11-13 18:10) ran their
# TotalA.exe at 1.09-1.15 threads each over their lives, as the 17 GDI games beside them did (1.10
# on average), so a bar game's render thread costs little. The suites' games -- the replay groups'
# battles, compat's setups, the wiki's scenes, at their own settings -- have not been measured by
# their CPU, and the figure stays two until they are. An llvmpipe lane spreads its rasterising
# over the threads and has not been measured.
lane_slots_vulkan = 2
